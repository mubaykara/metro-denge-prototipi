<html lang="tr">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
/* Düzen: tek ekran, vagonun içi 3D. Üstte vagonun LED tabelası, ortada karakter. Metro tabelası dili. */
:root {
  color-scheme: dark;
  --tunnel: #10151b;
  --wall: #232b34;
  --floor: #2e3843;
  --steel: #6d7a88;
  --text: #eef2f5;
  --muted: #a6b1bc;
  --sign: #ffc82e;
  --safe: #4cc9b0;
  --danger: #ff6b57;
  --led: #ff9f1a;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0; background: var(--tunnel); color: var(--text); font-family: var(--body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#led {
  position: absolute; z-index: 2; left: 10px; right: 92px; top: calc(10px + env(safe-area-inset-top, 0px));
  padding: 7px 10px; border-radius: 6px; background: #0b0d10; border: 1px solid #2a2f36;
  font: 700 17px/1.1 var(--display); letter-spacing: .06em; color: var(--led); text-transform: uppercase;
  text-shadow: 0 0 8px rgba(255, 159, 26, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#led.blink { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { color: #3a2a10; text-shadow: none; } }
#task {
  position: absolute; z-index: 2; left: 10px; top: calc(52px + env(safe-area-inset-top, 0px)); max-width: calc(100% - 20px);
  padding: 5px 10px; border-radius: 6px; background: rgba(11, 13, 16, .85); border: 1px solid #2a2f36;
  font: 700 15px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--text);
}
#task.ok { color: var(--safe); border-color: var(--safe); }
#task.fail { color: var(--danger); border-color: var(--danger); }
/* Dert çipi: dertte görev olmadığı için #task ile aynı yeri kullanır */
#dert {
  position: absolute; z-index: 2; left: 10px; top: calc(52px + env(safe-area-inset-top, 0px)); max-width: calc(100% - 20px);
  padding: 5px 10px; border-radius: 6px; background: rgba(11, 13, 16, .85); border: 1px solid #2a2f36;
  font: 700 15px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--text);
}
#dert.gec { color: var(--danger); border-color: var(--danger); }
#gear {
  position: absolute; z-index: 2; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
  font: 600 13px var(--body); color: var(--muted); background: var(--wall);
  border: 1px solid var(--steel); border-radius: 6px; padding: 8px 9px;
}
#pause {
  position: absolute; z-index: 2; right: 10px; top: calc(54px + env(safe-area-inset-top, 0px));
  width: 44px; height: 44px; font: 700 16px var(--body); color: var(--text); background: var(--wall);
  border: 1px solid var(--steel); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
#pause i { width: 5px; height: 16px; background: var(--text); border-radius: 1px; }
/* Sarsıntı uyarısı: itileceğin yöndeki ekran kenarı parlar */
.cue { position: absolute; z-index: 1; pointer-events: none; opacity: 0; }
.cue.l { left: 0; top: 0; bottom: 0; width: 22%; background: linear-gradient(to right, var(--cue, rgba(255, 200, 46, .75)), transparent); }
.cue.r { right: 0; top: 0; bottom: 0; width: 22%; background: linear-gradient(to left, var(--cue, rgba(255, 200, 46, .75)), transparent); }
.cue.t { left: 0; right: 0; top: 0; height: 16%; background: linear-gradient(to bottom, var(--cue, rgba(255, 200, 46, .75)), transparent); }
.cue.b { left: 0; right: 0; bottom: 0; height: 16%; background: linear-gradient(to top, var(--cue, rgba(255, 200, 46, .75)), transparent); }
/* Tutunmama çarpanı */
#combo {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  text-align: center; pointer-events: none; font: 700 20px var(--display); letter-spacing: .04em; color: var(--muted);
  text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
}
#combo b { font-size: 40px; color: var(--sign); margin-right: 8px; display: inline-block; }
#combo b.pop { animation: pop .35s ease-out; }
#combo.lost b { color: var(--muted); }
@keyframes pop { from { transform: scale(1.6); } to { transform: scale(1); } }
#flash {
  position: absolute; z-index: 2; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none;
  font: 700 34px var(--display); letter-spacing: .03em; text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0, 0, 0, .7); opacity: 0; transition: opacity .25s;
}
#flash.on { opacity: 1; transition: none; }
#overlay {
  position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
  background: rgba(16, 21, 27, .82); overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
#panel { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; margin: auto; }
#panel h1 {
  margin: 0; font: 700 44px/1 var(--display); letter-spacing: .01em; text-transform: uppercase;
  color: var(--sign); text-wrap: balance;
}
#panel p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--text); }
#panel ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; line-height: 1.4; }
#panel .small { font-size: 14px; color: var(--muted); }
#panel h2 { margin: 6px 0 0; font: 700 22px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
#panel button.dert { text-align: left; font-size: 20px; }
#panel button.dert small { display: block; margin-top: 4px; font: 400 14px/1.35 var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
#panel .dsat { font-size: 15px; line-height: 1.4; color: var(--muted); }
#panel .stars { font: 700 44px var(--display); color: var(--sign); letter-spacing: .1em; }
#panel .score { font: 700 22px var(--display); letter-spacing: .04em; color: var(--text); }
#panel button {
  font: 700 22px var(--display); letter-spacing: .03em; text-transform: uppercase;
  padding: 14px; border-radius: 6px; border: 1px solid var(--steel);
  background: var(--wall); color: var(--text); touch-action: manipulation;
}
#panel button.primary { background: var(--sign); color: var(--tunnel); border-color: var(--sign); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--safe); outline-offset: 2px; }
.row { display: grid; gap: 4px; font-size: 15px; }
.row label { display: flex; justify-content: space-between; gap: 12px; }
.row output { font-variant-numeric: tabular-nums; color: var(--sign); }
input[type=range] { width: 100%; accent-color: var(--sign); touch-action: pan-x; }
pre {
  margin: 0; padding: 10px; background: var(--tunnel); border: 1px solid var(--wall); border-radius: 6px;
  font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);
  -webkit-user-select: text; user-select: text;
}
</style>

<body>
<div id="app">
  <canvas id="game" role="img" aria-label="Metro vagonunun içinde ayakta duran karakter, yolcular ve kapılar"></canvas>
  <div id="led"></div>
  <div id="task" hidden></div>
  <div id="dert" hidden></div>
  <button id="gear" type="button">Ayarlar</button>
  <button id="pause" type="button" aria-label="Duraklat"><i></i><i></i></button>
  <div class="cue l"></div><div class="cue r"></div><div class="cue t"></div><div class="cue b"></div>
  <div id="combo" hidden><b>×1</b><span>0</span></div>
  <div id="flash"></div>
  <div id="overlay"><div id="panel"></div></div>
</div>

<script type="module">
import * as THREE from "three";

const $ = (id) => document.getElementById(id);
const css = getComputedStyle(document.documentElement);
const C = Object.fromEntries(["tunnel", "wall", "floor", "steel", "text", "muted", "sign", "safe", "danger"]
  .map((k) => [k, css.getPropertyValue("--" + k).trim()]));

// ---------- Ayarlanabilir değerler ----------
// tilt: tam güç için gereken eğim (derece); invert: eğim yönlerini ters çevir; help: gizli yardım açık mı.
const DEFAULTS = { gain: 8, force: 1, recover: 2, tilt: 22, invert: false, help: true, sound: true };
const T = { ...DEFAULTS };
try { Object.assign(T, JSON.parse(localStorage.getItem("denge-ayar-5") || "{}")); } catch (e) {}
const saveT = () => { try { localStorage.setItem("denge-ayar-5", JSON.stringify(T)); } catch (e) {} };

// Denge: telefonu hangi yöne eğersen karakterin ağırlığı oraya kayar. Yürümek için yere dokunursun.
// Yürürken denge çok daha zayıftır, bu yüzden ne zaman yürüyeceğine yolu okuyarak karar verirsin.
// Zor görünür, kolay oynanır: karakter gerçekte olduğundan daha yatık çizilir, gizli yardım
// zorlanan ama çabalayan oyuncuya fark ettirmeden yardım eder, kapı yetişmek üzere olana biraz daha açık kalır.
const DAMP = 3, STUMBLE_TIME = 1.6, FALL_LIMIT = 1.8, FIXED = 1 / 120, THUMB_RANGE = 60;
const SHOW = 1.5, DEAD_ZONE = 2, NEUTRAL_DRIFT = 5;
const WALK_SPEED = 1.3, WALK_FORCE = 1.7, WALK_RECOVER = .6, AHEAD = 10;
const DOOR_OPEN = 4, STOP_TIME = 5.5, ANNOUNCE = 10, NPC_SPEED = .9, ELDER_SPEED = .45, RIVAL_SPEED = .7;

// ---------- Araç ölçüleri (metre): körüklü metrobüs. x sağa, z arkaya, ön cam z = BUS.front'ta ----------
// İstanbul metrobüsü şeridin solundan gider; kapılar hep sağdan, iki yönün ortasındaki peronlara açılır.
const BUS = { halfW: 1.27, front: -9.2, back: 9.2, height: 2.45 };
const JOINT = -1; // körük (ön ve arka gövdenin birleştiği döner tabla)
const DOORS = [-7.9, -3.4, 1.9, 6.6]; // sağ duvardaki dört kapının z konumları
const START = [.2, 3.4];
const nearDoor = (z) => DOORS.some((d) => Math.abs(z - d) < .55);
const inDoorZone = (x, z, side) => x * side > .55 && nearDoor(z);
const sideName = (s) => (s > 0 ? "sağdan" : "soldan");

// ---------- Çarpışma (kuşbakışı x,z). Beden, kol ve baş duvardan, koltuktan, direkten ya da başka birinden geçmez ----------
// BODY_R kollar dahil beden yarıçapı. Üst gövde dengeye göre LEAN_M metre/birim kayar; bir şeye değince oraya yaslanır.
const BODY_R = .3, TORSO_R = .22, SHOULDER_R = .24, LEAN_M = .55, WALL_X = BUS.halfW - .04;
const POLES = []; // [x, z, yarıçap]
// Koridor kenarında, koltuk sıralarının arasında dikey direkler; körükte direk yok
for (let z = -7.2; z <= 8.4; z += 1.6) {
  if (Math.abs(z - JOINT) < .8) continue;
  POLES.push([-.31, z, .03]);
  // Sağda tekli koltuk sırası varsa koridor kenarında, yoksa (ayakta durma alanı) cam kenarında
  if (!DOORS.some((d) => Math.abs(z - d) < .8)) POLES.push([z < JOINT - .9 || z > 7.5 ? .74 : WALL_X - .07, z, .03]);
}
for (const d of DOORS) for (const s of [-1, 1]) POLES.push([WALL_X, d + s * .57, .03]); // kapı çerçeveleri
// Koltuklar öne bakar: solda ikili, sağda tekli sıralar. Kapı önleri, körük ve tekerlekli sandalye alanı boş.
// Cam kenarındaki koltuğa yalnızca yanındaki koridor koltuğundan geçilir; görevler koridor koltuklarını seçer.
const SEATS = [], SEAT_AISLE = [];
for (let z = -7.6; z <= 8.7; z += .8) {
  if (Math.abs(z - JOINT) < .9) continue;
  if (Math.abs(z - DOORS[2]) >= 1) { SEATS.push([-1, z]); SEAT_AISLE.push(false); SEATS.push([-.55, z]); SEAT_AISLE.push(true); }
  if ((z < JOINT - .9 || z > 7.5) && !DOORS.some((d) => Math.abs(z - d) < 1)) { SEATS.push([.98, z]); SEAT_AISLE.push(true); } // arka gövdenin sağı ayakta durma alanı
}
const AISLE_X = .22; // koridorun ortası
// Sağda tekli koltuk olan sıralarda koridor tek kişilik: ayakta duran orayı kapatır, yolcular orada durmaz.
const PINCH = (z) => SEATS.some(([sx, sz]) => sx > 0 && Math.abs(sz - z) < .62);
const seatFront = (i) => [SEATS[i][0] < 0 ? -.02 : .45, SEATS[i][1]];
const RECTS = SEATS.map(([x, z]) => [x - .22, x + .22, z - .21, z + .23]);
const CAB = [-BUS.halfW, -.12, BUS.front, BUS.front + 1.05]; // sol öndeki sürücü kabini
RECTS.push(CAB);
function pushCircle(pt, R, x, z) {
  const dx = pt[0] - x, dz = pt[1] - z, d = Math.hypot(dx, dz);
  if (d >= R) return;
  if (d < 1e-6) { pt[0] = x - Math.sign(x || 1) * R; return; }
  pt[0] = x + dx / d * R; pt[1] = z + dz / d * R;
}
// Noktayı (r yarıçaplı beden) sabit engellerin dışına iter; itildiyse true döner.
function pushStatic(pt, r) {
  const x0 = pt[0], z0 = pt[1];
  for (let it = 0; it < 3; it++) {
    pt[0] = Math.max(-WALL_X + r, Math.min(WALL_X - r, pt[0]));
    pt[1] = Math.max(BUS.front + .04 + r, Math.min(BUS.back - .04 - r, pt[1]));
    for (const [a, b, c, e] of RECTS) {
      const cx = Math.max(a, Math.min(b, pt[0])), cz = Math.max(c, Math.min(e, pt[1]));
      const dx = pt[0] - cx, dz = pt[1] - cz, d = Math.hypot(dx, dz);
      if (d >= r) continue;
      if (d < 1e-6) pt[0] = a > 0 ? a - r : b + r;
      else { pt[0] = cx + dx / d * r; pt[1] = cz + dz / d * r; }
    }
    for (const [x, z, pr] of POLES) pushCircle(pt, r + pr, x, z);
  }
  return Math.abs(pt[0] - x0) > 1e-6 || Math.abs(pt[1] - z0) > 1e-6;
}
// Üst gövdenin değebileceği yüzeyler: [nx, nz, uzaklık, yolcu]. Açık kapının olduğu yerde duvar yok.
function supports(x, z, openSide) {
  const out = [];
  const gap = openSide && nearDoor(z);
  if (!(gap && openSide > 0)) out.push([1, 0, WALL_X - x, null]);
  if (!(gap && openSide < 0)) out.push([-1, 0, WALL_X + x, null]);
  out.push([0, -1, z - BUS.front - .04, null], [0, 1, BUS.back - .04 - z, null]);
  const circ = (cx, cz, r, who) => {
    const dx = cx - x, dz = cz - z, d = Math.hypot(dx, dz);
    if (d < 1.4 && d > 1e-6) out.push([dx / d, dz / d, d - r, who]);
  };
  for (const [px, pz, pr] of POLES) circ(px, pz, pr, null);
  for (const n of G.npcs) if (n.state !== "exit" && n.state !== "board") circ(n.x, n.z, TORSO_R, n);
  return out;
}
// Kolların yana açılabileceği boşluk (sol, sağ), omuz ekleminden ölçülür.
function armRoom(x, z, p, openSide) {
  const room = [9, 9];
  for (const [nx, nz, d] of supports(x, z, openSide)) for (let i = 0; i < 2; i++) {
    const s = i ? 1 : -1;
    if (nx * s < .5) continue;
    room[i] = Math.min(room[i], (d - s * p[0] * LEAN_M) / (nx * s) - .33);
  }
  return room;
}
// Kapıdan çıkmakta olan (yarıdan fazlası dışarıda) artık engel sayılmaz; binmekte olan kapı ağzını tutar.
const solidNpcs = () => G.npcs.filter((n) => n.state !== "exit" || n.outT < .5);
const hitsPerson = (pt, r, skip) => solidNpcs().some((n) => n !== skip && Math.hypot(n.x - pt[0], n.z - pt[1]) < r);
// Bir yönde düşmeden önce ne kadar boş yer var
function freeDist(x, z, dx, dz, skip = null, noPeople = false) {
  for (let t = .1; t < 1.8; t += .05) {
    const pt = [x + dx * t, z + dz * t];
    if (pushStatic(pt, .15) || (!noPeople && hitsPerson(pt, TORSO_R + .15, skip))) return t;
  }
  return 1.8;
}

// ---------- Hat verisi ----------
// Bir oyun bir hat yolculuğudur. Ara duraklarda yolcular iner biner, kapı tarafı duraktan durağa değişir,
// her ara yolun bir görevi olur. Asıl hedef kendi durağında inmektir.
const UP = [0, -1], DOWN = [0, 1], L = [-1, 0], R = [1, 0];
const KV = { accel: DOWN, brake: UP, left: R, right: L };
const ev = (t, k, s, d, v) => ({ t, k, s: s * .8, d, v: v || KV[k] });
// Yol kalıpları: kuvvetler sabit, ezberlenebilir; sonuncusu en zoru.
const SEGS = [
  { dur: 24, sway: .3, ev: [ev(1.5, "accel", 4, 1.4), ev(6, "left", 4, 1.8), ev(11, "right", 4, 1.8), ev(21, "brake", 4.5, 2.6)] },
  { dur: 26, sway: .5, ev: [ev(1.5, "accel", 4.5, 1.4), ev(6, "brake", 4, .9), ev(8, "accel", 4, 1), ev(12, "left", 5, 1.6), ev(15.5, "right", 5, 1.6), ev(22.8, "brake", 5, 2.8)] },
  { dur: 28, sway: .7, ev: [ev(1.5, "accel", 5, 1.3), ev(5, "pot", 11, .22, UP), ev(8, "right", 5.5, 1.7), ev(12, "pot", 12, .22, L), ev(13.4, "pot", 12, .22, R), ev(16, "left", 5.5, 1.7), ev(19, "pot", 12, .22, DOWN), ev(24.6, "brake", 5.5, 2.8)] },
  { dur: 30, sway: .9, ev: [ev(1.5, "accel", 5.5, 1.2), ev(5, "left", 6, 1.3), ev(6.6, "right", 6, 1.3), ev(10, "brake", 6, .8), ev(11.2, "accel", 5.5, .9), ev(14, "pot", 13, .22, UP), ev(17, "right", 6.5, 1.6), ev(20, "left", 6.5, 1.4), ev(22.5, "pot", 13, .22, R), ev(26.4, "brake", 6, 3)] },
];
// Mekanik testi (adrese ?test eklenince): yalnızca denge. Yürüme, görev, durak ve inme yok; 30 saniyelik tek yol,
// düşünce bir dokunuşla baştan. ?test=1..4 yukarıdaki kalıplardan birini seçer; sayı yoksa bu 30 saniyelik kalıp oynanır.
const TEST = new URLSearchParams(location.search).get("test");
SEGS.push({ dur: 30, sway: .6, ev: [ev(1.5, "accel", 4.5, 1.4), ev(5.5, "left", 5, 1.6), ev(9, "right", 5, 1.6), ev(12.5, "brake", 4.5, .9), ev(14.2, "accel", 4.5, 1), ev(17.5, "pot", 11, .22, UP), ev(20, "right", 5.5, 1.5), ev(22.2, "left", 5.5, 1.5), ev(26.6, "brake", 5.5, 2.8)] });
const TEST_LINE = { name: "Mekanik testi", from: "", crowd: 6, seat: .85, seg: [{ to: "Durak", side: 1, tpl: TEST >= 1 && TEST <= 4 ? TEST - 1 : 4, task: null, view: "sehir", test: true }] };
// seg: duraktan durağa yol. to: varılan durak, side: kapının açılacağı yan, board: binecek yolcu sayısı.
// Metrobüs hattı, gerçek durak sırasıyla (Söğütlüçeşme yönü). İlk hat Okmeydanı Hastane → Altunizade dilimi
// (Mehmet Umut'un kararı, tasarim/README.md); köprü oyunda "Boğaz Köprüsü" adını taşır.
// view: camdan görünen manzara ("sehir" ya da Boğaz'ı geçen "kopru"). Köprü, Zincirlikuyu ile köprü durağı arasında geçilir:
// durak Anadolu yakasında, köprünün çıkışındadır (data/haritalar/istanbul-metrobus.json).
const LINES = [
  { name: "Metrobüs · Okmeydanı Hastane → Altunizade", from: "Okmeydanı Hastane", codes: ["34A", "34AS"], crowd: 5, seat: .8, seg: [
    { to: "Çağlayan", side: 1, tpl: 0, board: 3, task: null, view: "sehir" },
    { to: "Mecidiyeköy", side: 1, tpl: 1, board: 4, task: "kahve", view: "sehir" },
    { to: "Zincirlikuyu", side: 1, tpl: 2, board: 3, task: "yasli", view: "sehir" },
    { to: "Boğaz Köprüsü", side: 1, tpl: 2, board: 2, task: "kahve", view: "kopru" },
    { to: "Burhaniye", side: 1, tpl: 3, board: 2, task: "koltuk", view: "sehir" },

    // Gizli yardım: yalnızca doğru yöne çabalayana, zorlandıkça artar.
    const m0 = Math.hypot(G.p[0], G.p[1]) || 1;
    const effort = Math.max(0, Math.min(1, -(G.j[0] * G.p[0] + G.j[1] * G.p[1]) / m0 * 2));
    const a = T.help ? G.assist * effort : 0;
    fx *= 1 - .4 * a; fy *= 1 - .4 * a;
    const k = T.recover * G.mod.toparla * (1 + 1.5 * a) * (1 - (1 - WALK_RECOVER) * wk);
    const edge = Math.max(0, m0 - .7) * 7 * (.5 + G.assist) * (T.help ? effort : 0);
    G.v[0] += (-G.p[0] * k + fx + G.j[0] * T.gain - G.v[0] * DAMP - G.p[0] / m0 * edge) * h;
    G.v[1] += (-G.p[1] * k + fy + G.j[1] * T.gain - G.v[1] * DAMP - G.p[1] / m0 * edge) * h;
    G.p[0] += G.v[0] * h; G.p[1] += G.v[1] * h;

    // Yaslanma: üst gövde bir yüzeye değerse orada durur; duvar, direk ya da kapı seni tutar.
    // Bir yolcuya sertçe değmek çarpma sayılır.
    const wasLean = G.lean; G.lean = null; G.leanT += dt;
    for (const [nx, nz, d, who] of supports(G.pos[0], G.pos[1], G.state === "doors" ? G.doorSide : 0)) {
      // Zorla geçerken bedenler iç içe girer: kalabalık seni dik tutar ama geriye fırlatmaz.
      const lim = Math.max(who && G.squeeze ? 0 : -9, (d - SHOULDER_R) / LEAN_M), pn = G.p[0] * nx + G.p[1] * nz;
      if (pn <= lim) continue;
      G.p[0] -= nx * (pn - lim); G.p[1] -= nz * (pn - lim);
      const vn = G.v[0] * nx + G.v[1] * nz;

      if (who) { if (vn > .7 && !who.bumped) bump(who); }

    }
    if (G.lean && !wasLean && G.leanT > 2 && Math.hypot(G.p[0], G.p[1]) > .35) { flash("YASLANDIN", C.safe); tone(300, .08, "triangle", .1); }
    if (G.lean) G.leanT = 0;
    const m = Math.hypot(G.p[0], G.p[1]);
    G.assist = Math.min(1, Math.max(0, G.assist + (m > .7 ? .15 : -.02) * h));

    // Az kalsın anı
    if (m > .75 && G.stumble <= 0) G.near = true;
    else if (G.near && m < .35) { G.near = false; const b = 50 * G.mult; G.score += b; flash(`AZ KALSIN! +${b}`, C.safe); beep(760, .08); }

    if (G.stumble > 0) {
      G.stumble -= dt;
      if (m < .85) { G.stumble = 0; G.near = false; G.rescues++; flash("KURTARDIN!", C.safe); beep(880, .12); buzz(30); }
      else if (G.stumble <= 0 || m > FALL_LIMIT) return fall();
    } else if (m >= 1) {
      loseMult();
      G.stumble = STUMBLE_TIME; G.lineStumbled = true; G.target = null; G.assist = Math.min(1, G.assist + .25);
      if (G.task && G.task.type === "kahve" && G.task.ok === null) G.coffee -= .2;
      flash("DİKKAT!", C.danger); beep(180, .2); buzz(120);
      kanca("olay", "tokezle");
    }
  }
  updateTask(dt);
  updateDozer(dt);
  updateMult(dt);
  updateWob(h);
  updateGags(h);
  kanca("adim", dt, h);

  if (seg.test) { if (G.t >= tpl.dur) testDone(); return; }
  if (G.state === "ride" && !G.announced && G.t >= tpl.dur - ANNOUNCE) {
    G.announced = true; if (!kancaSor("anonsSessiz")) chime(); // uykulu oyuncu anonsu duymaz (Son sefer)
    setLed(`${seg.mine ? "Senin durağın: " : ""}${seg.to} · Kapılar ${sideName(seg.side)} açılacak`, true);
    kanca("olay", "anons");
  }
  if (G.state === "ride" && G.t >= tpl.dur) return openDoors();
  if (G.state === "doors") {
    if (seg.mine) {
      if (G.sitting < 0 && inDoorZone(G.pos[0], G.pos[1], seg.side) && G.stumble <= 0 && !engelVar("in")) return arrive();
      // Kapıya yaklaşmış olana kapı fark ettirmeden biraz daha açık kalır.
      const dist = Math.min(...DOORS.map((d) => Math.hypot(seg.side * .8 - G.pos[0], d - G.pos[1])));
      G.doorT -= dt * (T.help && dist < 1.6 ? .45 : 1);
      if (G.doorT <= 0) return missed();
    } else {
      // Ara durak: kapıya dokunup yürüdüysen burada inersin (kapı ağzında durmak tek başına indirmez).
      if (G.exitWant && G.sitting < 0 && inDoorZone(G.pos[0], G.pos[1], seg.side) && G.stumble <= 0 && !engelVar("in")) return arrive();
      G.doorT -= dt;
      if (G.doorT <= 0) closeDoors();
    }

}

// İnmeyecek olanlar kapı ağzından bir adım çekilir (inenlere yol açılır).
function clearDoorways(side) {
  for (const n of G.npcs) {
    if (n.state !== "stand" || n.exitSide || n.rival || n.dozer || !inDoorZone(n.x, n.z, side)) continue;
    const d = DOORS.reduce((a, b) => (Math.abs(b - n.z) < Math.abs(a - n.z) ? b : a)), dir = Math.sign(n.z - d) || 1;
    let spot = null;
    for (const dz of [.75, 1, 1.3, -.75, -1, -1.3]) for (const x of [.85, .5, .2]) {
      const z = d + dir * dz;
      if (!spot && !inDoorZone(x, z, side) && !PINCH(z) && spotFree(x, z, n)) spot = [x, z];

}
function openDoors() {

  if (nextGor === "yasli") {

function closeDoors() {

  for (const n of G.npcs) if (n.exitSide) { n.exitSide = 0; n.goal = null; n.state = "stand"; n.alightAt = -1; }
  // Görevi biten yolda hâlâ koltuğuna varamamış amca kapı kapanırken oturmuş sayılır.
  if (segGorev(curSeg()) === "yasli") for (const n of G.npcs) if (n.elder && n.toSeat >= 0 && !G.seatOcc[n.toSeat]) { G.seatOcc[n.toSeat] = { color: n.color, elder: true, look: n.look, yoldas: n.yoldas, teh: n.teh }; n.gone = true; G.seatsDirty = true; }
  G.npcs = G.npcs.filter((n) => !n.gone);
  G.crowdDirty = true;
  doorSound();

  const dd = dertTanim();
  if (dd && G.ds && !G.ds.kacirdi && curSeg().to === dd.hedef) { G.ds.kacirdi = true; flash("DURAĞI KAÇIRDIN", C.danger, 1600); }
  kanca("olay", "kapandi");

// ---------- Yolcular: duran, yürüyen, binen, inen ----------
function updateNpcs(h) {
  const seg = curSeg();
  // Binenler kapı boşluğundan girer; kapının önü doluysa bekler.
  if (G.state === "doors" && G.leaveQueue.length) processLeaves();
  if (G.state === "doors" && G.boardQueue.length) {
    G.boardT -= h;
    if (G.boardT <= 0) {
      const b = G.boardQueue[0];
      // Amca oyuncunun arkasındaki en yakın kapıdan biner, önündeki koltuğa giderken onun yanından geçer.
      const behind = DOORS.filter((z) => z > G.pos[1] + .8);
      const d = b.elder ? (behind.length ? Math.min(...behind) : DOORS[DOORS.length - 1]) : DOORS[(G.boardQueue.length + G.seg) % DOORS.length];
      const pt = [seg.side * (WALL_X - BODY_R), d];
      if (!G.npcs.some((o) => Math.hypot(o.x - pt[0], o.z - pt[1]) < 2 * BODY_R) && Math.hypot(pt[0] - G.pos[0], pt[1] - G.pos[1]) >= 2 * BODY_R) {
        G.boardQueue.shift();
        const n = npc(pt[0], pt[1], { state: "board", inT: 0, alightAt: b.alightAt ?? -1, boardSide: seg.side });
        if (b.elder) Object.assign(n, { elder: true, toSeat: b.toSeat, color: ELDER.color, speed: ELDER_SPEED });
        G.npcs.push(n); G.crowdDirty = true; G.boardT = .7;
      } else G.boardT = .2;
    }
  }
  let removed = false;
  for (const n of G.npcs) {
    if (n.state === "board") {
      n.inT += h / .6;
      if (n.inT >= 1) {
        n.inT = 1; n.state = "walk"; n.goal = n.elder ? seatFront(n.toSeat) : chooseSpot(n); n.speed = n.elder ? ELDER_SPEED : NPC_SPEED;
        // Amca önce oyuncunun durduğu yere yürür: kenara çekilmezsen geçemez.
        // Önce koridora çıkar, sonra oyuncunun durduğu yerden geçer: kenara çekilmezsen geçemez.
        if (n.elder) {
          n.path = [[n.boardSide * .25, n.z]];
          if (G.sitting < 0) n.path.push([G.pos[0], G.pos[1]]);
          n.goal = n.path.shift(); n.via = true;
        }
        if (!n.goal) n.state = "stand";
      }
    } else if (n.state === "exit") {
      n.outT += h / .6;
      if (n.outT >= 1) { n.gone = true; removed = true; }
    } else if (n.state === "walk") moveNpc(n, h);
  }
  if (removed) { G.npcs = G.npcs.filter((n) => !n.gone); G.crowdDirty = true; }
}
// Binen yolcu ya oyuncunun çevresine ya da ineceği kapının yakınına yerleşir.
function chooseSpot(n) {
  const line = curLine(), at = line.seg[n.alightAt];
  if (at && G.rnd() < .55) {
    const d = DOORS[Math.floor(G.rnd() * DOORS.length)];
    const s = findSpot(at.side * .55, d, .7, n); if (s) return s;
  }
  return findSpot(G.pos[0], G.pos[1], 1.4, n) || findSpot(0, 0, 1, n, 8.5);
}
function moveNpc(n, h) {
  if (n.via && Math.hypot(n.goal[0] - n.x, n.goal[1] - n.z) < .25) {
    if (n.path && n.path.length) n.goal = n.path.shift(); else { n.via = false; n.goal = seatFront(n.toSeat); }
  }
  // İlerleyemeyen (direkle duvar arasına sıkışan gibi) koridorun ortasından dolaşır.
  const gd = Math.hypot(n.goal[0] - n.x, n.goal[1] - n.z);
  const gk = n.goal[0].toFixed(2) + "," + n.goal[1].toFixed(2);
  if (n.goalKey !== gk) { n.goalKey = gk; n.bestD = 9; n.noProg = 0; n.detour = null; n.bestAll = 9; n.slowT = 0; }
  // Kalabalıkta hedefine uzun süre yaklaşamayan yolcu olduğu yerde durur.
  if (gd < (n.bestAll ?? 9) - .05) { n.bestAll = gd; n.slowT = 0; } else n.slowT = (n.slowT || 0) + h;
  if (n.slowT > 4 && !n.exitSide && !n.elder && !n.rival && !n.via) {
    const s2 = PINCH(n.z) && (n.relocs = (n.relocs || 0) + 1) <= 2 && findSpot(n.x, n.z, 1, n, 2.5); // dar yerde kalmaz, yakındaki açıklığa geçer
    if (s2) { n.goal = s2; return; }
    n.state = "stand"; n.goal = null; n.toSeat = -1; n.slowT = 0; return;
  }
  if (!n.detour) {
    if (gd < (n.bestD ?? 9) - .04) { n.bestD = gd; n.noProg = 0; } else n.noProg = (n.noProg || 0) + h;
    // Biri yolunu kesiyorsa dolaşmaz, yol ister (amca da sen çekilene kadar bekler).
    if (n.via || !n.staticHit) n.noProg = 0;
    if (n.noProg > .6) { n.detour = [AISLE_X - Math.sign(n.x - AISLE_X) * .05, n.z + Math.sign(n.goal[1] - n.z) * .35]; n.noProg = 0; n.bestD = 9; }
  }
  if (n.detour && (Math.hypot(n.detour[0] - n.x, n.detour[1] - n.z) < .12 || (n.detourT = (n.detourT || 0) + h) > 3)) { n.detour = null; n.detourT = 0; n.bestD = 9; }
  const aim = n.detour || n.goal;
  const dx = aim[0] - n.x, dz = aim[1] - n.z, d = Math.hypot(dx, dz);
  if (!n.detour && d < .06) { n.bestD = 9; return npcArrived(n); }
  const ux = dx / d, uz = dz / d, s = Math.min(d, n.speed * h);

    if (!k) n.staticHit = pushed && prog < .5; // engelin kenarında kayıyor ama hedefe yaklaşmıyor
    if (G.sitting < 0 && closing({ x: G.pos[0], z: G.pos[1] }, [n.x, n.z], pt, 2 * BODY_R)) { blockedByPlayer = true; continue; }
    let ok = true;
    for (const o of solidNpcs()) {

    }

  }

  // Uzun süre yol bulamayan, inecek ya da yaşlı değilse olduğu yerde kalır.
  if (n.stuck > 2.5 && !n.exitSide && !n.elder && !n.rival) { n.state = "stand"; n.goal = null; n.toSeat = -1; n.stuck = 0; return; }
  if (blockedByPlayer && n.wait > .7 && !(n.rival && G.task && G.task.fight)) {
    n.wait = 0;
    if (n.elder) { flash("YOL VER!", C.sign); tone(260, .15, "triangle", .1); }
    else { G.v[0] += ux * .9; G.v[1] += uz * .9; flash("MÜSAADE!", C.sign); tone(440, .06, "triangle", .1); buzz(30); }
  }
}
function npcArrived(n) {
  if (n.rival && G.task && G.task.fight) return; // kapışma sürerken oturamaz, koltuğun önünde direnir
  if (n.exitSide) { n.state = "exit"; n.outT = 0; return; }
  if (n.toSeat >= 0) { // koltuğa oturur
    const i = n.toSeat;
    if (!G.seatOcc[i]) {
      G.seatOcc[i] = { color: n.color, elder: n.elder, look: n.look, yoldas: n.yoldas, teh: n.teh }; G.seatsDirty = true;
      n.gone = true; G.npcs = G.npcs.filter((o) => !o.gone); G.crowdDirty = true;
      if (G.task && G.task.ok === null) {
        if (G.task.type === "yasli" && n.elder) taskDone(true, "SAĞ OL EVLADIM!");
        if (G.task.type === "koltuk" && i === G.task.seat) {
          taskDone(false, "KOLTUK KAPILDI");
          for (const o of G.npcs) if (o.toSeat === i) Object.assign(o, { toSeat: -1, goal: null, state: "stand", rival: false });
        }

// ---------- Görevler ----------
function updateTask(dt) {
  G.spilling = 0; // dökülme yalnızca sarsılırken sürer, sakinleşince durur
  const t = G.task; if (!t || t.ok !== null) return;
  if (t.type === "kahve") {
    // Sert yalpa ve hızlı savrulma kahveyi döker; yürürken bardak daha hassastır.
    const m = Math.hypot(G.p[0], G.p[1]), v = Math.hypot(G.v[0], G.v[1]), w = G.walking ? 1.4 : 1;
    const spill = (Math.max(0, m * SHOW * w - .62) * .4 + Math.max(0, v * w - .62) * .4) * dt;
    G.coffee -= spill; G.spilling = spill / dt;
    if (G.coffee < .35) taskDone(false, "KAHVE DÖKÜLDÜ!");
  } else if (t.type === "koltuk") {
    const f = seatFront(t.seat), dist = (x, z) => Math.hypot(x - f[0], z - f[1]);
    const pd = dist(G.pos[0], G.pos[1]);
    // Rakip: koltuğa yakın duran biri. Sen yaklaşınca, aşağı yukarı seninle aynı anda varacağı an yürür; koltuğun önünde karşılaşırsınız.
    if (!t.rival && G.t > .8) {
      const all = G.npcs.filter((n) => n.state === "stand" && !n.elder && !n.dozer && !n.yoldas && !n.teh && n.alightAt !== G.seg && dist(n.x, n.z) > .45);
      const cand = all.sort((a, b) => dist(a.x, a.z) - dist(b.x, b.z))[0];
      if (cand) { t.rival = true; cand.rival = true; cand.toSeat = t.seat; cand.rivalWait = true; }
    }
    const r = G.npcs.find((n) => n.rival && n.toSeat === t.seat);
    if (r && r.rivalWait && G.sitting < 0 && pd < dist(r.x, r.z) * (WALK_SPEED / RIVAL_SPEED) + .6) {
      // Uzaktaysa koşturur: seninle aşağı yukarı aynı anda varacak hızda.
      const sp = Math.min(1.25, Math.max(.5, dist(r.x, r.z) / (pd / WALK_SPEED + .1)));
      Object.assign(r, { rivalWait: false, goal: [...f], state: "walk", speed: sp, stuck: 0 });
      flash("!", C.danger);
    }
    // Kapışma: ikiniz de koltuğun önündeyken kimse oturamaz. Rakip seni omuzlar; sen telefonu ona doğru eğip ağırlığını ona verirsin.
    // İttikçe sen kazanırsın, bırakırsan o kazanır. Fazla eğilirsen dengen gider.
    if (r && !r.rivalWait && G.sitting < 0 && pd < 1 && dist(r.x, r.z) < 1 && Math.hypot(r.x - G.pos[0], r.z - G.pos[1]) < (t.fight ? 1.1 : .75)) {
      if (!t.fight) { t.fight = true; t.win = 0; t.shoveT = .5; flash("KAPIŞ!", C.sign); tone(300, .08, "square", .07); }
      const dx = r.x - G.pos[0], dz = r.z - G.pos[1], d = Math.hypot(dx, dz) || 1;
      const push = Math.min(1, Math.max(0, (G.p[0] * dx + G.p[1] * dz) / d) * 2); // ağırlığını ona verdiğin kadar
      t.win = Math.min(1, t.win + (push * 1.5 - .4) * dt);
      r.v[0] -= dx / d * push * 2 * dt; r.v[1] -= dz / d * push * 2 * dt; // ittikçe o yalpalar
      t.shoveT -= dt;
      if (t.shoveT <= 0) {
        t.shoveT = .85 + G.rnd() * .3;
        G.v[0] -= dx / d * 1.1; G.v[1] -= dz / d * 1.1; r.v[0] += dx / d * .6; r.v[1] += dz / d * .6;
        flash("BENİM!", C.danger); tone(200, .1, "square", .08); buzz(40);
      }
      if (t.win >= 1) {

  G.wave = .7; G.waveAt = { x: n.x, z: n.z };
  if (n.pokes > 3) { anger(n); return; }
  n.act = { type: "talk", t: 0, dur: 1.6 };
  say(n, n.elder ? POKE_ELDER[(n.pokes - 1) % POKE_ELDER.length] : pickOf(POKE[n.pokes - 1]), n.pokes > 2 ? "mad" : "talk", 1.6);
  tone(520 + n.pokes * 60, .06, "triangle", .08);
}
function tapPerson(cx, cy) {
  if (G.sitting >= 0 || curSeg().test) return false;
  const c = G.npcs.filter((n) => n.state === "stand" && !n.wob && n.fade > .6 && Math.hypot(n.x - G.pos[0], n.z - G.pos[1]) < 2.4 && tapOnNpc(n, cx, cy, true));
  if (!c.length) return false;
  poke(c.reduce((a, b) => (Math.hypot(b.x - G.pos[0], b.z - G.pos[1]) < Math.hypot(a.x - G.pos[0], a.z - G.pos[1]) ? b : a)));
  return true;
}
function updateGags(h) {
  for (const n of G.npcs) {
    const a = n.act; if (!a) continue;
    const was = a.t; a.t += h;
    if (a.type === "sneeze" && was < .9 && a.t >= .9) {
      say(n, "HAPŞUU!", "warn", 1.1); tone(900, .05, "sawtooth", .09); tone(300, .25, "sawtooth", .08, .04);
      let blessed = false;
      for (const o of G.npcs) if (o !== n && idle(o) && Math.hypot(o.x - n.x, o.z - n.z) < 1.4) { o.act = { type: "recoil", t: 0, dur: 1.3, from: [n.x, n.z] }; if (!blessed) { blessed = true; say(o, "Çok yaşa!", "talk", 1.4, .5); } }
      const dx = G.pos[0] - n.x, dz = G.pos[1] - n.z, d = Math.hypot(dx, dz) || 1;
      if (d < 1.15 && G.sitting < 0) { G.v[0] += dx / d * .7; G.v[1] += dz / d * .7; }
    }
    if (a.type === "phone") for (const [k, at] of [[1, 1.8], [2, 3.6]]) if (was < at && a.t >= at) say(n, a.lines[k], "talk", 1.6);
    if (a.type === "yawn" && was < 1 && a.t >= 1 && a.gen < 3) {
      const o = G.npcs.filter((q) => q !== n && idle(q) && Math.hypot(q.x - n.x, q.z - n.z) < 1.8)[0];
      if (o) { o.act = { type: "yawn", t: 0, dur: 1.9, gen: a.gen + 1 }; say(o, "Haaah...", "talk", 1.5); }
    }
    if (a.t >= a.dur) n.act = null;
  }
  if (G.state !== "ride" || curSeg().test) return;
  G.gagT -= h;
  if (G.gagT > 0) return;
  G.gagT = 7 + Math.random() * 6;
  const c = G.npcs.filter((n) => idle(n) && !n.elder && n.z < G.pos[1] + .2 && Math.abs(n.z - G.pos[1]) < 5.5);
  if (!c.length) return;
  const n = pickOf(c), type = pickOf(["sneeze", "phone", "yawn"]);
  if (type === "sneeze") { n.act = { type, t: 0, dur: 1.8 }; say(n, "Hap...", "talk", .9); }
  else if (type === "phone") { const lines = [...PHONE_SAY].sort(() => Math.random() - .5).slice(0, 3); n.act = { type, t: 0, dur: 5.4, lines }; say(n, lines[0], "talk", 1.6); tone(1400, .08, "sine", .05); tone(1400, .08, "sine", .05, .16); }
  else { n.act = { type, t: 0, dur: 1.9, gen: 0 }; say(n, "Haaah...", "talk", 1.5); }
}
// Çarpılan yolcu kızar: sana döner, yumruğunu sallar, başının üstünde balon çıkar. Aynı kişiye yine çarparsan daha çok kızar.
// Yalnız görüntü ve ses; puana ve dengeye etkisi yok (ceza ilk çarpmada, bump içinde).
const MAD_T = 1.8;
const MAD_SAY = ["Hop!", "Yavaş!", "Ayağım!", "Önüne baksana!", "Öf ya!"], MAD_AGAIN = ["Yine mi?!", "Yeter ama!", "Hâlâ mı?!"];

  n.hits = (n.hits || 0) + 1; n.mad = { t: 0 }; n.madAt = G.t;
  const list = n.hits > 1 ? MAD_AGAIN : MAD_SAY;
  say(n, (n.hits > 1 ? "\u{1F4A2} " : "") + list[Math.floor(Math.random() * list.length)], "mad", MAD_T);
  tone(170, .16, "sawtooth", .06, .12); tone(140, .2, "sawtooth", .06, .28);
  kanca("olay", "kizdi", { n });

function arrive() {
  const line = curLine(), tanim = dertTanim(), hedefte = !!tanim && curSeg().to === tanim.hedef;
  finishTask();
  kanca("olay", "indi", { durak: curSeg().to, hedef: hedefte });
  let stars = 0;
  if (!tanim) { // dertte yıldız, rekor ve hat sonucu yok; sonucu dert verir
    const tasksOk = line.seg.every((s, i) => i < G.seg0 || i > G.seg || !segGorev(s) || G.results[i] === true); // yalnız bindiğin yollar sayılır
    stars = 1 + (tasksOk ? 1 : 0) + (!G.lineStumbled && !G.lineFalls ? 1 : 0);
    G.starsByLine[G.line] = Math.max(G.starsByLine[G.line] || 0, stars);
    G.lastStars = stars;
  }
  G.state = "arrived";
  if (!tanim) {
    const sc = Math.floor(G.score); G.newBest = sc > (best[G.line] || 0);
    if (G.newBest) { best[G.line] = sc; try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {} }
  }

  if (tanim) {
    if (G.ds.kacirdi) return dertGec({ kacirdi: true }); // hedefi kaçırmıştın: indiğin ilk durakta dert biter

  }
  if (G.line >= 0 && servicesAt(curSeg().to).length) { flash(tanim ? "İNDİN!" : `İNDİN! ${"★".repeat(stars)}${"☆".repeat(3 - stars)}`, C.safe, 1600); return startPlatform(); }
  setTimeout(showArrived, 900);
}

// ---------- Aktarma: in, peronda bekle, sonraki araca bin ----------
// Panel açılmaz; kamera oyuncuyla perona çıkar. Araç kalkar, başka hatların araçları sırayla gelir.
// Oyuncu peronda serbest yürür, istediği araca dokunup biner; bindiği aracın hattı başlar.
const PLAT_X = BUS.halfW + .58, PLAT_WAIT_Z = 7.7, PLAT_SPEED = 3, PICK_TIME = 8;
const PLAT_MIN_X = BUS.halfW + .4, PLAT_MAX_X = 4.2, PLAT_Z = 13, WAITER_R = .5;
// Peron koşusu (dert varışı): çıkış işareti peronun ön ucunda, ortasında; bu kadar yaklaşınca yetişmiş sayılır.
const KOS_X = (PLAT_MIN_X + PLAT_MAX_X) / 2, KOS_Z = -PLAT_Z + 1, KOS_R = .8;
const svcOf = (pl) => pl.list[pl.svc % pl.list.length];
const svcName = (pl) => `${svcOf(pl).code} ${lineEnd(svcOf(pl).line)}`;
const awayFrom = (pt) => { for (const w of waiters) { const dx = pt[0] - w[0], dz = pt[1] - w[1], d = Math.hypot(dx, dz) || 1e-3; if (d < WAITER_R) { pt[0] += dx / d * (WAITER_R - d); pt[1] += dz / d * (WAITER_R - d); } } };
function startPlatform() {
  const d = DOORS.reduce((a, b) => (Math.abs(b - G.pos[1]) < Math.abs(a - G.pos[1]) ? b : a));
  G.state = "platform"; G.target = null; G.walking = false; G.p = [0, 0]; G.v = [0, 0]; G.F = [0, 0]; G.speed = G.speedTarget = 0;
  G.pl = { x: G.pos[0], z: G.pos[1], wp: 0, moving: false, yaw: 0, path: [[PLAT_X, d], [PLAT_X, PLAT_WAIT_Z]],
    bus: "open0", t: 0, open: true, name: curSeg().to, door: null, ghost: null, gz: 0, gv: 0,
    svc: -1, list: servicesAt(curSeg().to) }; // svc -1: indiğin araç; kalkınca listedeki ilk araç gelir
  setBusSign(`${G.code || curLine().codes[0]} ${curSeg().to}`);
  setLed("Peronda yürümek için yere dokun");
}
function leaveGhost() {
  // Kalkan araç: o anki hâlinin kopyası uzaklaşır; asıl araç yeni yolcularla arkadan gelir.
  const pl = G.pl, g = busG.clone(true), lights = [];
  g.traverse((o) => { if (o.isLight) lights.push(o); });
  for (const l of lights) l.removeFromParent();
  if (pl.ghost) scene.remove(pl.ghost);
  pl.ghost = g; pl.gz = 0; pl.gv = 0; scene.add(g);
  if (pl.final) return; // peron koşusunda yeni araç gelmez, tabela değişmez
  // Kalkan araç kendi tabelasıyla gider; sıradaki araç öbür tabelayı takar.
  busSignCur = 1 - busSignCur; for (const m of busSigns) m.material = busSignMats[busSignCur].mat;
  pl.svc++; setBusSign(svcName(pl));
}
function updatePlatform(dt) {
  const pl = G.pl;
  pl.t += dt;
  updateNpcs(dt);
  // Oyuncu sıradaki noktaya yürür
  const aim = pl.path[0];
  pl.moving = !!aim;
  if (aim) {
    const dx = aim[0] - pl.x, dz = aim[1] - pl.z, d = Math.hypot(dx, dz), stepLen = PLAT_SPEED * G.mod.yuru * dt;
    pl.wantYaw = Math.atan2(-dx, -dz);
    if (d <= stepLen) { pl.x = aim[0]; pl.z = aim[1]; pl.path.shift(); }
    else { pl.x += dx / d * stepLen; pl.z += dz / d * stepLen; pl.wp += dt * 11; }
    if (pl.x > BUS.halfW + .3) { const pt = [pl.x, pl.z]; awayFrom(pt); pl.x = Math.min(PLAT_MAX_X, pt[0]); pl.z = pt[1]; } // bekleyenlerin içinden geçmez
  } else pl.wantYaw = 0;
  pl.yaw += Math.atan2(Math.sin(pl.wantYaw - pl.yaw), Math.cos(pl.wantYaw - pl.yaw)) * Math.min(1, dt * 9);
  if (pl.ghost) { pl.gv += 3.5 * dt; pl.gz -= pl.gv * dt; if (pl.gz < -170) { scene.remove(pl.ghost); pl.ghost = null; } }

  if (pl.bus === "open0" && pl.t > 1.5) { pl.bus = "closing"; pl.t = 0; pl.open = false; doorSound(); setLed("Kapılar kapanıyor"); }
  else if (pl.bus === "closing" && pl.t > .8) {
    // Araç kalkar. Gelen her araç kendi hattının yolcuları ve görevleriyle kurulur.
    leaveGhost();
    if (pl.final) { G.busZ = 400; pl.bus = "gone"; pl.t = 0; pl.door = null; } // koşuda yenisi gelmez; asıl araç görüş dışına alınır
    else {
      startLine(svcOf(pl).line, svcOf(pl).seg); G.state = "platform"; flash("", C.text);
      G.busZ = 60; pl.bus = "away"; pl.t = 0; pl.door = null;
      setLed(`${svcName(pl)} · geliyor`);
    }
  } else if (pl.bus === "away" && pl.t > 1.5) { pl.bus = "arriving"; pl.t = 0; }
  else if (pl.bus === "arriving") {
    const k = Math.min(1, pl.t / 4.5);
    G.busZ = 55 * (1 - k) * (1 - k);
    if (k >= 1) {
      G.busZ = 0; pl.bus = "open"; pl.t = 0; pl.open = true; doorSound(); clearDoorways(1);
      setLed(`${svcName(pl)} · binmek için araca dokun`, true);
    }
  } else if (pl.bus === "open") {
    // Kapı seçilmediyse araç beklemez: kapanır, kalkar, sıradaki gelir.
    if (pl.door === null && pl.t > PICK_TIME * G.mod.kapi) { pl.bus = "closing"; pl.t = 0; pl.open = false; doorSound(); setLed(`${svcName(pl)} kalkıyor`); }
    else if (pl.door !== null && !pl.path.length) boardBus();
  }
  if (pl.final && platformKos(dt)) return;

// Peron koşusu: süre akar, LED sayar; işarete yetişince ya da süre bitince dert biter. Biterse true döner.
function platformKos(dt) {
  const f = G.pl.final;
  f.t -= dt;
  const yazi = `${f.yazi} · ${Math.max(0, Math.ceil(f.t))} sn`;
  if ($("led").textContent !== yazi) setLed(yazi, f.t < 3);
  if (Math.hypot(G.pl.x - KOS_X, G.pl.z - KOS_Z) < KOS_R) { dertBitir({ yetisti: true, kalan: Math.max(0, f.t) }); return true; }
  if (f.t <= 0) { dertBitir({ yetisti: false }); return true; }
  return false;
}
function pickDoor(z) {
  const pl = G.pl;
  if (!pl || pl.bus !== "open" || pl.x < BUS.halfW + .2) return false; // koşuda araç hiç açılmaz: binilmez
  if (engelVar("bin")) return false;
  pl.door = DOORS.reduce((a, b) => (Math.abs(b - z) < Math.abs(a - z) ? b : a));
  pl.path = [[PLAT_X, pl.door], [.85, pl.door]];
  setLed(`Sıradaki durak: ${curSeg().to}`); beep(700, .06);
  return true;
}
// Peronda serbest yürüme: dokunulan yere gider. Araçtan inerken ya da kapıdan girerken yön değişmez.
function platWalk(x, z) {
  const pl = G.pl;
  if (!pl || pl.x < BUS.halfW + .2) return;
  const pt = [Math.max(PLAT_MIN_X, Math.min(PLAT_MAX_X, x)), Math.max(-PLAT_Z, Math.min(PLAT_Z, z))];
  awayFrom(pt);
  if (pl.door !== null && pl.bus === "open") setLed(`${svcName(pl)} · binmek için araca dokun`, true);
  pl.door = null; pl.path = [pt];
}
function boardBus() {
  const pl = G.pl, line = curLine();
  // Kapının hemen içi doluysa bir adım daha içeri girer.
  for (const x of [.85, .65, .45, .25]) { G.pos = [x, pl.door]; pushStatic(G.pos, BODY_R); if (!hitsPerson(G.pos, 2 * BODY_R)) break; }
  if (G.snap) G.snap.pos = [...G.pos]; // düşersen bindiğin kapının önünden devam edersin
  if (pl.ghost) scene.remove(pl.ghost);
  G.code = svcOf(pl).code;
  G.pl = null; G.busZ = 0; G.t = 0; G.state = "ride";
  tehlikeKur(); if (G.snap) G.snap.npcs = clone(G.npcs); // oyuncunun gerçek biniş yerine göre; düşünce aynı tehlikelerle dönülür
  doorSound();
  flash(`Senin durağın: ${line.seg[line.seg.length - 1].to}`, C.sign, 1800);

// Mekanik testi: 30 saniye düşmeden biterse yol tamamlanır. Deneme sayısı ve en uzun dayanma telefonda saklanır,

const TEST_KEY = "denge-test-kayit";
let tlog = {}; try { tlog = JSON.parse(localStorage.getItem(TEST_KEY)) || {}; } catch (e) {}

  tlog.tries = (tlog.tries || 0) + 1; if (won) tlog.wins = (tlog.wins || 0) + 1;
  tlog.bestT = Math.max(tlog.bestT || 0, G.testT);
  const sc = Math.floor(G.score); G.newBest = sc > (tlog.best || 0); if (G.newBest) tlog.best = sc;
  try { localStorage.setItem(TEST_KEY, JSON.stringify(tlog)); } catch (e) {}

function testDone() {
  G.state = "arrived"; G.testText = "30 saniye tutunmadan durdun."; recordTest(true);
  setLed("İyi yolculuklar"); beep(660, .1); setTimeout(() => beep(990, .16), 120);
  setTimeout(() => showTest(), 600);
}

function missed() {
  G.state = "missed"; G.misses++;
  setLed("Kapılar kapanıyor"); doorSound();
  setTimeout(() => showEnd("Durağı kaçırdın", MISS_LINES[G.misses % MISS_LINES.length]), 900);
}

function fall() {
  const m = Math.hypot(G.p[0], G.p[1]) || 1;
  G.fallDir = [G.p[0] / m, G.p[1] / m];
  // Önü kapalıysa koridor boyunca düşer; açı da boş yere göre sınırlanır, kimsenin ya da hiçbir şeyin içine girmez.
  const [x, z] = G.pos, fd = G.fallDir, sz = Math.sign(fd[1]) || 1;
  const opts = [fd, [0, sz], [0, -sz]].map((u) => ({ u, f: freeDist(x, z, u[0], u[1]) }));
  // Önünde biri varsa ona doğru düşer (domino); yoksa boş yere.
  const best = opts[0].f >= 1.4 || nextInLine([x, z], fd) ? opts[0] : opts.reduce((a, b) => (b.f > a.f + .2 ? b : a));
  G.fallDir = best.u;
  G.fallMax = Math.min(1.35, Math.asin(Math.min(1, Math.max(.25, best.f - .05) / 1.6)));
  G.state = "fallen"; G.fallT = 0; G.falls++; G.lineFalls++; G.stumble = 0; G.target = null;
  G.assist = Math.min(1, G.assist + .4); // sonraki deneme fark ettirmeden kolaylaşır
  thud(); buzz([80, 50, 150]);
  // Domino: düştüğün yönde biri varsa onu da devirirsin, o da önündekini.
  // Her beden önündekine yaslanabildiği kadar eğilir; önündeki devrildikçe o da devrilir (bkz. leanOnto).
  G.knocked = 0; G.chain = []; G.fallAng = 0;
  let from = [x, z], dir = G.fallDir, delay = .3;
  for (let k = 0; k < 4; k++) {
    const hit = nextInLine(from, dir);
    if (!hit) break;
    hit.fallT = -delay; hit.fallDir = [...dir]; hit.fallAng = 0;
    hit.gap = (hit.x - from[0]) * dir[0] + (hit.z - from[1]) * dir[1];
    G.chain.push(hit); G.knocked++; from = [hit.x, hit.z]; delay += .28;
  }
  G.chain.forEach((n, i) => {
    const last = i === G.chain.length - 1, f = freeDist(n.x, n.z, dir[0], dir[1], n, !last);
    n.fallMax = Math.min(1.25, Math.asin(Math.min(1, Math.max(.3, f - .05) / 1.6)));
  });
  if (G.chain.length) G.fallMax = Math.min(1.35, Math.asin(Math.min(1, Math.max(.25, freeDist(x, z, dir[0], dir[1], null, true) - .05) / 1.6)));
  const text = G.knocked ? KNOCK_LINES[Math.min(G.knocked, KNOCK_LINES.length) - 1] : FALL_LINES[G.falls % FALL_LINES.length];
  if (curSeg().test) { G.testText = text; recordTest(false); }
  G.endText = text; G.endT = FALL_HOLD + G.knocked * .35;
  startReactions();
  kanca("olay", "dusme");
}
// Düşünce ekran hemen kapanmaz: sahne bir süre izlenir. Ayaktakiler döner, güler, bir ikisi telefonla çeker.
// Beklemek istemeyen ekrana dokunur, panel hemen gelir.
const FALL_HOLD = 3.6;
function fallEnd() {
  if (G.state !== "fallen" || G.endT === null) return;
  G.endT = null;
  if (curSeg().test) showTest(); else showEnd("Düştün", G.endText);
}
function startReactions() {
  hidePhones();
  const [x, z] = G.pos;
  const others = G.npcs.filter((n) => n.fallT === undefined && (n.state === "stand" || n.state === "walk"));
  for (const n of others) {
    const d = Math.hypot(n.x - x, n.z - z);
    n.react = { t: -(.45 + d * .1 + Math.random() * .35), film: false, d, ph: Math.random() * 6 };
  }
  // Çekenler: kameranın gördüğü tarafta, bir adımdan uzak, en yakın iki kişi
  const film = others.filter((n) => !n.elder && n.react.d > .9 && n.z < z + .3).sort((a, b) => a.react.d - b.react.d).slice(0, 2);
  film.forEach((n, i) => { n.react.film = true; n.react.t = -(.9 + i * .5); });
  G.chain.forEach((n, i) => say(n, i % 2 ? "Ayy!" : "Hop hop!", "mad", 2.2, .3 + i * .28));
  film.forEach((n, i) => say(n, "\u25CF REC", "rec", 9, .9 + i * .5 + .3));
  others.filter((n) => !n.react.film).slice(0, 4).forEach((n) => say(n, "\u{1F602}", "fun", 9, -n.react.t + .15));
  // Kahkaha: iki ayrı ses, kısa inen heceler
  for (let v = 0; v < Math.min(2, others.length); v++)
    for (let r = 0; r < 2; r++)
      for (let j = 0; j < 5; j++) tone((v ? 560 : 400) - j * 28 + r * 20, .09, "triangle", .05, .9 + v * .22 + r * 1.1 + j * .13);
  film.forEach((n, i) => tone(2600, .03, "square", .03, 1.25 + i * .5));
}
// Arası gap olan, önündeki phi açısıyla eğikken bir bedenin ona değmeden eğilebileceği en büyük açı
const FALL_H = 1.6, FALL_T = 2 * TORSO_R;
const leanOnto = (gap, phi) => phi - Math.asin(Math.max(-1, Math.min(1, (FALL_T - gap * Math.cos(phi)) / FALL_H)));
// Düşme yönünde, yaklaşık bir boy mesafesindeki ilk yolcu
function nextInLine([x, z], [dx, dz]) {
  let best = null, bd = 9;
  for (const n of G.npcs) {
    if (n.fallT !== undefined || n.state === "exit" || n.state === "board") continue;
    const ox = n.x - x, oz = n.z - z, along = ox * dx + oz * dz, side = Math.abs(ox * dz - oz * dx);
    if (along > .2 && along < 1.25 && side < .5 && along < bd) { best = n; bd = along; }
  }
  return best;
}

// ---------- Ses ve titreşim ----------
let ac = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume().catch(() => {}); }
function tone(freq, dur, type, vol, at = 0) {
  if (!T.sound || !ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + at;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
const beep = (f, d) => tone(f, d, "square", .05);
const thud = () => tone(70, .22, "sine", .35);
const chime = () => { tone(659, .5, "sine", .14); tone(523, .7, "sine", .14, .42); };
const doorSound = () => { tone(1320, .12, "square", .04); tone(1320, .12, "square", .04, .25); tone(220, .5, "sawtooth", .05, .1); };
const buzz = (p) => {
  try { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(p); } catch (e) {}
};

let flashTimer = 0;
function flash(text, color, ms = 700) {
  const f = $("flash"); f.textContent = text; f.style.color = color;
  f.classList.toggle("on", !!text); clearTimeout(flashTimer);
  if (text) flashTimer = setTimeout(() => f.classList.remove("on"), ms);
}
function setLed(text, blink = false) { const l = $("led"); l.textContent = text; l.classList.toggle("blink", blink); }

function setTask() {
  const el = $("task"), t = G.task;

// iOS ve Android bu verileri yalnızca HTTPS sayfalara verir; iOS ayrıca bir dokunuşla izin ister.

  const listen = () => addEventListener("deviceorientation", onOrient);
  if (typeof DOE.requestPermission === "function") DOE.requestPermission().then((r) => { if (r === "granted") listen(); }).catch(() => {});

function updateTilt(dt) {

  tilt.beta0 += (tilt.beta - tilt.beta0) * Math.min(1, dt / NEUTRAL_DRIFT);
  const s = T.invert ? -1 : 1;
  let x = s * deadZone(tilt.gamma) / T.tilt, y = s * deadZone(tilt.beta - tilt.beta0) / T.tilt;
  const m = Math.hypot(x, y);

// Oyuncunun görünümünü yamayla yeniden kurar (null: varsayılan). `player` nesnesinin kimliği korunur: bardak, yüz, yumuşak beden durumu

function oyuncuGiy(yama) {

  const L = yama ? { ...PLAYER_LOOK, ...yama } : PLAYER_LOOK, g = personGeo(L), p = player;
  const takas = (grp, geo) => { const m = grp.children[0]; if (m && m.isMesh) m.geometry = geo; };
  p.legs.forEach((l, i) => { takas(l, g.legU); takas(p.knees[i], g.legL); l.position.x = (i ? 1 : -1) * J.legX * g.w; });
  takas(p.hip, g.hip); takas(p.head, g.head);
  p.arms.forEach((a, i) => { takas(a, g.armU[i]); takas(p.elbows[i], g.armL[i]); a.position.x = (i ? 1 : -1) * (g.sh * g.w * J.tsx + J.armX); });

// Tehlikeler: `teh` alanı olan modüller, olasılığa göre ayakta duran sıradan yolculara `n.teh = id` yazılır.

function tehlikeIste(id) { const l = G.ortak.tehIste || (G.ortak.tehIste = []); if (!l.includes(id)) l.push(id); }
function tehlikeKur() {

  const url = (TEH_URL || "").split(",").filter(Boolean), iste = G.ortak.tehIste || [];
  for (const m of MODS) {
    if (!m.teh) continue;
    const kesin = url.includes("hepsi") || url.includes(m.id) || iste.includes(m.id);
    if (!kesin && !(G.rnd() < m.teh.olasilik)) continue;
    const uygun = G.npcs.filter((n) => n.state === "stand" && !n.elder && !n.teh && !n.yoldas && !n.rival && !n.dozer && !n.exitSide && n.alightAt !== G.seg

}

// Üst baş: leke, kırışıklık, dağınık saç, ıslaklık. Durum G.ortak.ust'ta; görseller karakterin üstünde (gösterge yok).

const UST_PANT = [[-.095, .001], [-.08, .13], [-.035, .172], [.04, .186], [.12, .178]];
const ustBel = (f) => STIL ? (f ? .18 : .196) : f ? .152 : .172, ustOmuz = (f) => f ? .17 : .188;
const ustUstP = (f) => [[.08, ustBel(f)], [.2, ustBel(f)], [.34, f ? .19 : .195], [.45, f ? .198 : .208], [.52, ustOmuz(f) + .005], [.59, ustOmuz(f) - .012], [.64, .15], [.662, .06]];
const ustMontP = (f) => [[-.14, .196], [0, .198], [.2, ustBel(f) + .028], [.42, (f ? .2 : .21) + .014], [.52, ustOmuz(f) + .02], [.6, ustOmuz(f) + .004], [.648, .16]];

const UST_LEKE = [[.38, .3, .05], [.25, -.55, .04], [.5, -.25, .045], [.12, .95, .04], [.42, -1.25, .05], [.3, 1.3, .04]];
// Kırışıklık: [y, açı, eğim, boy]
const UST_KIRIS = [[.42, .25, .5, .1], [.3, -.4, -.45, .09], [.5, -.1, .15, .11], [.16, .45, .6, .08], [.36, 1.0, -.3, .08]];

const UST_KAFA = [.095, .13, .115]; // kafa yarıçapları (kafatası .08/.112/.098 + saç kabuğu payı)
const UST_ISLAK_A = .12, UST_ISLAK_B = .3;   // ıslak katman saydamlığı: A + B * islak
const UST_ALT = [[.001, -.1], [.14, -.09], [.19, -.04], [.2, .04], [.19, .1]];   // ıslak katman, pantolon kısmı (z ölçeği .72)

const ustSph = new THREE.SphereGeometry(1, 8, 6), ustKut = new THREE.BoxGeometry(1, 1, 1);
const ustMLeke = new THREE.MeshLambertMaterial({ color: 0x5a3a1e }), ustMKir = new THREE.MeshLambertMaterial({ color: 0x1f1a17, transparent: true, opacity: .55 });
const ustMSac = new THREE.MeshLambertMaterial({ color: PLAYER_LOOK.hairC }), ustMIslak = new THREE.MeshLambertMaterial({ color: 0x14202e, transparent: true, opacity: UST_ISLAK_A, depthWrite: false });
const ustLat = (p) => new THREE.LatheGeometry(p.map(([r, y]) => new THREE.Vector2(r, y)), 20);
const ustPr = (p, y) => { // [y, r] dizisinde y'deki yarıçap; aralık dışında 0
  if (y < p[0][0] || y > p[p.length - 1][0]) return 0;
  for (let i = 1; i < p.length; i++) if (y <= p[i][0]) return p[i - 1][1] + (p[i][1] - p[i - 1][1]) * (y - p[i - 1][0]) / (p[i][0] - p[i - 1][0]);
  return 0;
};
const ustYuz = (y, f, mont) => { // y'deki [z, x] yarıçapı: pantolon, üst ve (varsa) mont yüzeyinin en dışı
  const pa = ustPr(UST_PANT, y), us = ustPr(ustUstP(f), y), mo = mont ? ustPr(ustMontP(f), y) : 0;
  return [Math.max(pa * .7, us * .62, mo * .66) + UST_PAY, Math.max(pa, us, mo) + UST_PAY];

const ustLeke = UST_LEKE.map(([y, a, s]) => {

});
const ustKiris = UST_KIRIS.map(([y, a, e, b]) => {

  m.rotation.set(0, a, e); m.scale.set(b, .007, .012); m.visible = false; ustHip.add(m); return m;
});
const ustSac = UST_SAC.map(([p, t]) => {

  m.position.set(pv.x * UST_KAFA[0], pv.y * UST_KAFA[1], pv.z * UST_KAFA[2]).addScaledVector(tv, .03);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tv); m.scale.set(.013, .045, .013); m.visible = false; ustBas.add(m); return m;
});
const ustIslakA = new THREE.Mesh(ustLat(UST_ALT), ustMIslak), ustIslakU = new THREE.Mesh(ustLat([[.2, .07], [.2, .2]]), ustMIslak);

// Leke, kırışıklık ve ıslak gövde katmanını geçerli görünümün yüzeyine oturtur (mont varken mont lathe'inin dışına). Yalnız görünüm değişince çalışır.
function ustYerles(L) {

  UST_LEKE.forEach(([y, a], i) => { const [rz, rx] = ustYuz(y, f, mont); ustLeke[i].position.set(Math.sin(a) * rx, y, Math.cos(a) * rz); });
  UST_KIRIS.forEach(([y, a], i) => { const [rz, rx] = ustYuz(y, f, mont); ustKiris[i].position.set(Math.sin(a) * rx, y, Math.cos(a) * rz + .004); });
  // ıslak gövde: mont varken mont profili, yoksa üst profili; ikisi de yüzeyin biraz dışında

  const lp = pr.map(([y, r]) => [r + UST_ISLAK_PAY, y]); lp.push([.07, son + .02], [.001, son + .024]);

// Gruplar oyuncuya (ilk kullanımda) takılır ve ölçekleri geçerli görünüme uydurulur: hip'in yerel ölçüsü gövde geometrisiyle aynı (w, ?stil torso).
function ustTak() {
  if (ustHip.parent !== player.hip) player.hip.add(ustHip);
  if (ustBas.parent !== player.head) player.head.add(ustBas);
  const t = J.torso || [1, 1, 1];

}
function ustGizle() { ustHip.visible = ustBas.visible = false; ustAnahtar = -1; }
const ustKad = (v, n) => Math.min(n, Math.max(0, Math.ceil(v * n - .001))); // 0..1 seviyeden kaç parça görünür

function ustKir(tip, miktar) {
  const u = G.ortak && G.ortak.ust; if (!u || !UST_TIPLER.includes(tip)) return;
  u[tip] = Math.min(1, Math.max(0, u[tip] + miktar));

}

function ustPuan() {

const ymPosetG = new THREE.BoxGeometry(.15, .19, .1), ymSeritG = new THREE.BoxGeometry(.154, .04, .104), ymSapG = new THREE.BoxGeometry(.012, .1, .012);
const ymBuharG = new THREE.SphereGeometry(1, 8, 6);
const ymPosetM = new THREE.MeshLambertMaterial({ color: 0xece6d6 }), ymSeritM = new THREE.MeshLambertMaterial({ color: 0xd2402a });
const ymBuharM = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .45, depthWrite: false });

const ymD = () => G.ortak.ym || (G.ortak.ym = { saat: 0, son: -99 }); // saat dert/yol sayacından bağımsız (G.t her yolda sıfırlanır)
// Poşeti dirseğe takar (bardak elin ucunda durur: aynı konum). Yolcu başına bir kez.
function ymTak(b) {
  if (b.yemek) return;
  const g = new THREE.Group();
  g.position.y = J.cupY - J.elbowY; g.scale.setScalar(J.cupS / 1.6);
  const gov = new THREE.Mesh(ymPosetG, ymPosetM); gov.position.y = -.115;
  const ser = new THREE.Mesh(ymSeritG, ymSeritM); ser.position.y = -.1;
  g.add(gov, ser);
  for (const s of [-1, 1]) { const h = new THREE.Mesh(ymSapG, ymSeritM); h.position.set(s * .035, -.01, 0); h.rotation.z = -s * .35; g.add(h); }
  const bur = [];
  for (let k = 0; k < YM_BUHAR_SAYI; k++) { const m = new THREE.Mesh(ymBuharG, ymBuharM); g.add(m); bur.push(m); }
  g.userData.bur = bur;
  b.elbows[1].add(g); b.yemek = g;
}
function ymLeke(n) {
  const d = ymD();
  if (d.saat - d.son < YM_ARA) return;
  d.son = d.saat;
  ustKir("leke", YM_LEKE);
  flash("YEMEK ÜSTÜNE YAPIŞTI!", C.danger, 1100);
  tone(300, .14, "sine", .08); tone(220, .18, "sine", .07, .1);
  n.ymU = YM_UZGUN; n.ymS = YM_SOZ; n.ymW = 0;
}

MODS.push({
  id: YM_ID, teh: { olasilik: YM_OLASILIK, adet: YM_ADET },
  olay(tip, v) {
    if ((tip === "carpma" || tip === "sikisma") && v && v.n && v.n.teh === YM_ID) {
      const y = G.ortak.yuk;
      if (y && y.serbest) return; // kaçmış bavulun çarpması oyuncunun çarpması değil
      ymLeke(v.n);
    }
  },
  adim(dt) {
    const d = ymD(); d.saat += dt;
    for (const n of G.npcs) {
      if (n.teh !== YM_ID) continue;
      if (n.ymU > 0) { n.ymU -= dt; if (n.mad) n.mad = null; } // üzülüyor, kızmıyor
      if (n.ymS > 0 && (n.ymS -= dt) <= 0) say(n, "Pidem!", "warn", 1.8);
      if (n.ymW > 0) n.ymW -= dt;
      if (G.sitting >= 0) continue;
      const mes = Math.hypot(n.x - G.pos[0], n.z - G.pos[1]);
      if (n.ymA) { if (mes > YM_YENI_R) n.ymA = false; }
      else if (mes < YM_UYARI_R && !(n.ymU > 0) && n.state !== "exit" && n.state !== "board") {
        n.ymA = true; n.ymW = YM_ONCE;
        say(n, "Dikkat sıcak!", "warn", YM_ONCE + .3);
        tone(900, .06, "triangle", .05);
      }
    }
  },
  npcKur(n, b) { if (n.teh === YM_ID) ymTak(b); },
  npcCiz(n, b, dt, now) {
    if (n.teh !== YM_ID) { if (b.yemek) b.yemek.visible = false; return; }
    if (!b.yemek) ymTak(b); // mesh, n.teh yazılmadan kurulmuş olabilir
    const g = b.yemek, a = b.arms[1], e = b.elbows[1];
    g.visible = !b.mats[0] || b.mats[0].opacity > .5; // kamerayla aradaysa yolcuyla birlikte kaybolur
    const dus = G.state === "fallen" || n.wob;
    let k = 0;
    if (!dus) {
      k = n.ymW > 0 ? Math.min(1, (YM_ONCE - n.ymW) / .25) : 0;
      a.rotation.set(YM_KOL[0] + .6 * k, 0, .1); e.rotation.x = YM_KOL[1] + .3 * k;
      if (n.ymU > 0) { // üzgün: kafa öne, bir el başında, poşet sarkık
        const s = Math.max(0, Math.min(1, n.ymU / .3, (YM_UZGUN - n.ymU) / .2));
        b.head.rotation.x += .38 * s; b.hip.rotation.x += .08 * s;
        a.rotation.x = YM_KOL[0] * (1 - s) + .2 * s; e.rotation.x = YM_KOL[1] * (1 - s) + .4 * s;
        const a0 = b.arms[0], e0 = b.elbows[0];
        a0.rotation.x += (1.2 - a0.rotation.x) * s; a0.rotation.z += (-.3 - a0.rotation.z) * s; e0.rotation.x += (1.6 - e0.rotation.x) * s;
      }
    }
    // Poşet kola göre değil dünyaya göre dik asılı kalır (bardağın yaptığı gibi); uyarıda öne arkaya sallanır.
    g.rotation.x = -(a.rotation.x + e.rotation.x + b.hip.rotation.x);
    g.rotation.z = -(a.rotation.z + b.hip.rotation.z) + Math.sin(now * 16) * .3 * k;
    const bur = g.userData.bur;
    for (let i = 0; i < bur.length; i++) {
      const f = (now * YM_BUHAR_HIZ + i / bur.length) % 1, m = bur[i];
      m.position.set((i - 1) * .025 + Math.sin(now * 3 + i * 2) * .02, -.02 + f * YM_BUHAR_BOY, .015 * i - .015);
      m.scale.setScalar(.012 + .03 * Math.sin(Math.PI * f));
    }
  },
});
// <<< BÖLGE teh-yemek

// >>> BÖLGE dert-ilk-bulusma
// İlk buluşma: şık giyindin, en yoğun saatte biniyorsun. Sonuç üst başa ve gecikmeye bağlı; iyi biten buluşma bir sonraki aşamayı açar.
const IB_HAT = 0, IB_SEG = 3, IB_KALABALIK = 5, IB_SURE = 125, IB_SURE_ADIM = 8, IB_MAX_ASAMA = 2;
const IB_AD = ["İlk buluşma", "İkinci buluşma", "Ailesiyle tanışma"];
const IB_GIRIS = [
  "Çok şıksın ve en yoğun saatte biniyorsun; karşındaki seni bekliyor.",
  "İkinci buluşma: bu sefer de kusursuz görünmen gerek.",
  "Ailesiyle tanışıyorsun; her şey tertemiz olmalı.",
];
const IB_GIY = { top: 0xf6f3ec, coat: 0xd8cfbf, pants: 0x2e3446, shoes: 0x2a2523 }; // açık gömlek, bej ceket: leke ve kırışıklık belli olsun
// Dört kademe: puan eşikleri (üst baş puanı eksi gecikme cezası), yüz ve tek cümle. İlk iki kademe iyi bitiştir.
const IB_ESIK = [.8, .55, .3], IB_IYI_KADEME = 1;
const IB_GEC_CEZA = .015, IB_GEC_TAVAN = .45, IB_KACIRDI_TAVAN = .2; // geç kalınan her saniye puan düşürür; durağı kaçırmak tek başına kötü bitirir
const IB_PUAN_SATIR = .7, IB_LEKE_SATIR = .2;
const IB_YUZ = [
  ["😍", "Karşındakinin gözleri parladı."],
  ["🙂", "Karşındaki gülümsedi, küçük kusurları görmedi."],
  ["😬", "Karşındaki nazikçe gülümsedi ama saatine baktı."],
  ["😒", "Karşındaki seni baştan aşağı süzdü ve yüzünü buruşturdu."],
];
const IB_IYI = [
  "Kapıda seni görünce gülümsedi; akşam güzel geçecek.",
  "Seni görünce sevindi; ikinci buluşma da güzel başladı.",
  "Annesi elini sıktı, babası çay koydu.",
];
const IB_KOTU = "Bu akşam başka biriyle buluşmaya gidiyorsun.";

// Aşama kaydın iyi sayısından gelir; yol sürerken G.ds.as değişmez (yoksa sonuçta ad kayardı).
const ibAsama = () => (G.dert === "ilk-bulusma" && G.ds && G.ds.as != null ? G.ds.as : Math.min(IB_MAX_ASAMA, dertKayit("ilk-bulusma").iyi));

DERTLER["ilk-bulusma"] = {
  get ad() { return IB_AD[ibAsama()]; },
  get giris() { return IB_GIRIS[ibAsama()]; },
  get basla() { return { hat: IB_HAT, seg: IB_SEG, kalabalik: IB_KALABALIK + ibAsama() }; },
  hedef: "Altunizade",
  get sure() { return IB_SURE - IB_SURE_ADIM * ibAsama(); },
  hat(ilk) {
    if (!ilk) return; // aktarma yok; yeni araçta durum sürer
    G.ds.as = ibAsama();
    oyuncuGiy(IB_GIY);
    ustOto(true);
    tehlikeIste("teh-kahve");
  },
  sonuc(bilgi) {
    const a = ibAsama(), puan = ustPuan(), gec = Math.max(0, Math.round(bilgi.saat - this.sure)), u = G.ortak.ust;
    let s = puan - Math.min(IB_GEC_TAVAN, gec * IB_GEC_CEZA);
    if (bilgi.kacirdi) s = Math.min(s, IB_KACIRDI_TAVAN);
    let k = IB_ESIK.findIndex((e) => s >= e); if (k < 0) k = IB_ESIK.length;
    const iyi = k <= IB_IYI_KADEME, [yuz, cumle] = IB_YUZ[k];
    return {
      iyi, baslik: `${yuz} ${cumle}`, yazi: iyi ? IB_IYI[a] : IB_KOTU,
      satirlar: [
        [puan >= IB_PUAN_SATIR, "Üstün başın derli toplu kaldı"],
        [!u || u.leke < IB_LEKE_SATIR, "Üstüne leke bulaşmadı"],
        [gec === 0, gec ? `${gec} sn geç kaldın` : "Zamanında geldin"],
        [!bilgi.kacirdi, bilgi.kacirdi ? "Durağı kaçırdın" : "Doğru durakta indin"],
      ],
    };
  },
};
// <<< BÖLGE dert-ilk-bulusma

// >>> BÖLGE dert-is-gorusmesi
// İş görüşmesi: koyu takım, elde dosya, bileğinde tek bir saat. Kalan süre saatin ibresinde ve renginde görünür (gösterge yok).
// Hedefte inince asansöre koşulur; sonuç: dosya hâlâ elde mi, asansöre yetişildi mi. Sayılar geçici.
const ISG_SURE = 115;               // toplam süre (sn)
const ISG_KOS = [8, 16], ISG_KOS_EK = 11; // koşu süresi: clamp(sure - saat + ek, alt, üst); 18,6 m / 3 m/sn = 6,2 sn alt sınırın altında kalmalı
const ISG_UYARI = 30;               // kalan süre bu kadarken saat uyarır (sn)
const ISG_GIY = { top: 0xf2f1ec, coat: 0x1d2232, pants: 0x1d2232, shoes: 0x16161a }; // beyaz gömlek, koyu takım, siyah ayakkabı
const ISG_SAAT_Y = STIL ? -.17 : -.21, ISG_SAAT_R = STIL ? .05 : .037; // sol ön kolda bilek yeri (dirsek yerelinde) ve kol yarıçapı
const ISG_YUZ = [0xf3efe0, 0xf2b84a, 0xd23c3c]; // saat yüzü: rahat, 30 sn kala, geç

// Saat: sol ön kola takılı, tek bir kez yaratılır. Kayış kolu sarar, yüz dışa (-x) bakar, ibre kalan süreyi gösterir.
const isgYuzM = new THREE.MeshLambertMaterial({ color: ISG_YUZ[0] });
const isgSaatG = new THREE.Group(), isgIbre = new THREE.Group();
{
  const r = ISG_SAAT_R, kayis = new THREE.Mesh(new THREE.CylinderGeometry(r + .006, r + .006, .03, 14), M(0x2a2118));
  const yuz = new THREE.Mesh(new THREE.CylinderGeometry(r * .95, r * .95, .016, 18), isgYuzM);
  yuz.rotation.z = Math.PI / 2; yuz.position.x = -(r + .008);
  const cerceve = new THREE.Mesh(new THREE.TorusGeometry(r * .95, .005, 6, 18), M(0xc9a64a));
  cerceve.rotation.y = Math.PI / 2; cerceve.position.x = -(r + .016);
  const ibre = new THREE.Mesh(new THREE.BoxGeometry(.005, r * 1.5, .007), M(0x1a1a1a)); ibre.position.y = r * .75 * .9;
  isgIbre.add(ibre); isgIbre.position.x = -(r + .018);
  isgSaatG.add(kayis, yuz, cerceve, isgIbre); isgSaatG.position.y = ISG_SAAT_Y; isgSaatG.visible = false;
}
function isgTakkil() { if (isgSaatG.parent !== player.elbows[0]) player.elbows[0].add(isgSaatG); } // oyuncuKur sonrası da güvenli

// Görseller her zaman çalışan modülde: dert seçili değilken (menüye dönüş, başka dert) saat gizli kalmalı.
MODS.push({
  id: "isg-gorsel",
  sifirla() { isgSaatG.visible = false; },
  oyuncuKur() { isgTakkil(); },
  ciz(dt, now) {
    const d = G.dert === "is-gorusmesi" && G.ds;
    isgSaatG.visible = !!d;
    if (!d) return;
    isgTakkil();
    const t = ISG_SURE - G.ds.saat, geç = t < 0;
    isgIbre.rotation.x = geç ? 0 : -(t / ISG_SURE) * Math.PI * 2; // dolu daire: tüm süre; ibre saat yönünün tersine azalır
    isgYuzM.color.setHex(geç ? (Math.sin(now * 10) > 0 ? ISG_YUZ[2] : ISG_YUZ[0]) : t < ISG_UYARI ? ISG_YUZ[1] : ISG_YUZ[0]);
  },
});

DERTLER["is-gorusmesi"] = {
  ad: "İş görüşmesi", giris: "Takım elbisen ütülü, dosyan elinde; görüşme birazdan başlıyor.",
  basla: { hat: 0, seg: 3 }, hedef: "Altunizade", sure: ISG_SURE,
  hat(ilk) {
    if (!ilk) return;
    oyuncuGiy(ISG_GIY);
    esyaVer("dosya", "Dosya");
  },
  durum() { return esyaElde() ? "Dosya elinde" : esyaVar() ? "Dosya yerde!" : "Dosya yok"; },
  adim() { // süre uyarıları: bir kez, G.ds düz bayraklarıyla
    const d = G.ds; if (!d) return;
    const t = ISG_SURE - d.saat;
    if (!d.isUyari && t < ISG_UYARI) { d.isUyari = true; flash(`Görüşmeye ${ISG_UYARI} saniye!`, C.danger, 1400); beep(880, .08); }
    if (!d.isGec && t < 0) { d.isGec = true; flash("GEÇ KALDIN!", C.danger, 1600); tone(160, .3, "sawtooth", .08); }
  },
  peron() { // koşu başladığında dosya elde değilse bir kez söyle (araç dosyayla gider)
    const d = G.ds; if (!d || d.isDosya || !G.pl || !G.pl.final) return;
    d.isDosya = true;
    if (!esyaElde()) flash("DOSYAN İÇERİDE KALDI!", C.danger, 1600);
  },
  varis() {
    const sure = Math.max(ISG_KOS[0], Math.min(ISG_KOS[1], ISG_SURE - G.ds.saat + ISG_KOS_EK));
    return { kos: { sure, yazi: "Asansöre yetiş" } };
  },
  sonuc(b) {
    const dosya = esyaElde(), yet = !!b.yetisti && !b.kacirdi, iyi = dosya && yet;
    let baslik, yazi;
    if (b.kacirdi) { baslik = "Durağı kaçırdın"; yazi = "Altunizade geride kaldı; görüşme saatinde hâlâ vagondasın."; }
    else if (iyi) { baslik = "Görüşmeye girdin"; yazi = "Asansör kapanmadan içeri attın kendini, dosyan elinde; kat düğmesine basarken nefesin bile düzeldi."; }
    else if (yet) { baslik = "Elin boş girdin"; yazi = "Asansöre yetiştin ama dosya vagonda kaldı; özgeçmişini ezbere anlatman gerekecek."; }
    else if (dosya) { baslik = "Asansör gitti"; yazi = "Dosyan elinde ama kapılar yüzüne kapandı; resepsiyondaki kadın geç kaldığını not etti."; }
    else { baslik = "Hem geç hem eli boş"; yazi = "Asansör gitti, dosya da yok; resepsiyondaki kadın acıyarak baktı."; }
    return { iyi, baslik, yazi, satirlar: [[dosya, dosya ? "Dosya hâlâ elinde" : "Dosyayı düşürdün"], [yet, yet ? "Asansöre yetiştin" : "Asansöre yetişemedin"]] };
  },
};
// <<< BÖLGE dert-is-gorusmesi

// >>> BÖLGE dert-sinav
// Geç kalınan sınav: uyuyakaldın, kimlik elinde; Altunizade'de Söğütlüçeşme yönüne aktar, Acıbadem'de in, salon kapısına koş.
// Kimlik ortak-esya sistemindedir (düşer, yerden alınır); bu bölge yalnız kuralı, peron hatırlatmasını ve sonucu yazar.
const SINAV_SURE = 120;           // sn (çip)
const SINAV_KAPI = .6;            // kapı açık kalma/peron bekleme çarpanı (ara duraklar kısa)
const SINAV_KOS = [8, 16, 11];    // salon koşusu: en az, en çok, saatten artan pay (sn)
const SINAV_DOGRU_HAT = 1;        // LINES indeksi: Altunizade → Söğütlüçeşme
const SINAV_AKTARMA = "Altunizade";   // aktarma peronu (startPlatform name: curSeg().to)
const SINAV_PERON_ISARET = "Söğütlüçeşme yönüne binmelisin";

DERTLER["sinav"] = {
  ad: "Geç kalınan sınav", giris: "Uyuyakaldın. Kimliğin elinde, sınav başlamak üzere.",
  basla: { hat: 0, seg: 4 }, hedef: "Acıbadem", sure: SINAV_SURE,
  hat(ilk) { if (ilk) esyaVer("kimlik", "Kimlik"); }, // aktarmada (ilk false) eldeki kimlik korunur
  mod(m) { m.kapi *= SINAV_KAPI; },
  durum() {
    if (!esyaVar()) return "Kimlik yok";
    if (!esyaElde()) return "Kimlik yerde!";
    const ds = G.ds || {};
    if (G.state === "platform") {
      if (G.pl && G.pl.final) return "Salona koş";
      if (ds.kacirdi) return "Acıbadem geçti";
      if (G.pl && G.pl.name === SINAV_AKTARMA) return "Söğütlüçeşme yönüne bin";
      return ds.yanlis ? "Yanlış araç" : "Altunizade'de aktar";
    }
    if (ds.kacirdi) return "Acıbadem geçti";
    if (G.line === SINAV_DOGRU_HAT) return "Acıbadem'de in";
    return ds.yanlis ? "Yanlış araç" : "Altunizade'de aktar";
  },
  // Altunizade peronunda LED: hangi araca binileceği (gelen araç doğru yöne gitmiyorsa uyarı). Kapı seçilince çekirdeğin yazısı kalır.
  peron() {
    const pl = G.pl; if (!pl) return;
    if (G.ds) G.ds.sAlt = pl.name === SINAV_AKTARMA; // boardBus G.pl'yi sıfırlar; "bindi" bu bayrağa bakar
    if (pl.name !== SINAV_AKTARMA || pl.final || pl.door !== null) return;
    let y = null, yanip = false;
    if (pl.bus === "open0") y = SINAV_PERON_ISARET;
    else if (pl.bus === "away" || pl.bus === "arriving" || pl.bus === "open") {
      const dogru = svcOf(pl).line === SINAV_DOGRU_HAT;
      y = `${svcName(pl)} · ${dogru ? (pl.bus === "open" ? "doğru araç, bin!" : "doğru araç geliyor") : "Söğütlüçeşme'ye gitmiyor"}`;
      yanip = dogru && pl.bus === "open";
    }
    if (y && $("led").textContent !== y) setLed(y, yanip);
  },
  olay(tip) {
    // Yanlış hatta binersen bir kez uyar; araç yine de yürür (sapma hat sonuna kadar uzar).
    if (tip !== "bindi" || !G.ds) return;
    const alt = !!G.ds.sAlt; G.ds.sAlt = false;
    if (!alt || G.state !== "ride") return; // uyarı yalnız Altunizade'den biniste
    if (G.line !== SINAV_DOGRU_HAT) { G.ds.yanlis = true; flash("Bu araç Acıbadem'e gitmiyor!", C.danger, 1800); }
    else G.ds.yanlis = false;
  },
  varis() {
    const s = Math.max(SINAV_KOS[0], Math.min(SINAV_KOS[1], SINAV_SURE - G.ds.saat + SINAV_KOS[2]));
    return { kos: { sure: s, yazi: "Salon kapısı" } };
  },
  sonuc(b) {
    const kimlik = esyaElde(), yetisti = !!b.yetisti, kacirdi = !!b.kacirdi, iyi = kimlik && yetisti;
    let baslik, yazi;
    if (kacirdi) { baslik = "Acıbadem geçti gitti"; yazi = "Gözünü açtığında durak arkada kalmıştı; sınav sensiz başladı."; }
    else if (!yetisti) { baslik = "Salon kapısı kapandı"; yazi = "Koştun ama gözetmen kapıyı tam önünde kapattı."; }
    else if (!kimlik) { baslik = "Kimliksiz kaldın"; yazi = "Salona girdin, gözetmen kimlik istedi; kimlik trende kalmıştı."; }
    else { baslik = "Sınava girdin"; yazi = "Kapı kapanırken oturdun, kimliğini masaya koydun."; }
    return { iyi, baslik, yazi, satirlar: [[kimlik, kimlik ? "Kimlik yanında" : "Kimliği kaybettin"], [!kacirdi, kacirdi ? "Acıbadem'i kaçırdın" : "Acıbadem'de indin"], [yetisti, yetisti ? "Kapı kapanmadan girdin" : "Kapı kapanmadan giremedin"]] };
  },
};
// <<< BÖLGE dert-sinav

// >>> BÖLGE dert-babaanne
// Babaanneyi hastaneye götür: yoldaş (ortak-yoldas) yavaş yürüyen bir babaanne. İlk durakta bir koltuk boşalır ve işaretlenir; oyuncu babaanneyi
// koltuğun önüne getirir, o oturur. Ayakta kalırsa sert sarsıntıda sendeler (oyuncu tutar). Hedef anons edilince koltuktan kaldırılır, birlikte inilir.
// Durum G.ds altında (yalnız sayaç ve bayrak, yolcu referansı yok); koltuk bilgisi seatOcc'ta, konumlar yolcu nesnesindedir.
const BABA_HEDEF = "Okmeydanı Hastane", BABA_HIZ = .45;                 // inilecek durak; babaannenin yürüme hızı (m/sn)
const BABA_OTUR_MESAFE = 1, BABA_KALK_MESAFE = .9;                      // koltuğun önüne bu kadar yaklaşınca oturmaya gider; oyuncu koltuğun önüne bu kadar gelirse hedefte kalkar
const BABA_RAKIP_SN = 7, BABA_RAKIP_HIZ = .8, BABA_RAKIP_MENZIL = 4.5;  // koltuk boşaldıktan bu kadar sonra yakındaki biri yönelir (hız, en çok bu kadar uzaktan)
const BABA_SARS_ESIK = 5, BABA_SARS_ARA = 6, BABA_SARS_IYI = 1;         // sendeletecek en küçük sarsıntı (s zaten .8 ile çarpılmış gelir); iki sendeleme arası en az sn; iyi sonuçta en çok sarsılma
const BABA_KAPI = 1.4;                                                  // yavaş yoldaş için kapıların açık kalma süresi çarpanı
const BABA_BASORTU = [0x3a3a40, 0xdcd8d2, 0x4a4f5e, 0x6e5a7a];

// Dert durumu ilk kullanımda kurulur (G.ds, dertAyarla'da yalın {saat: 0} olarak yaratılır).
function babaDs() {
  const d = G.ds;
  if (d && d.sarsildi === undefined) Object.assign(d, { oturdu: false, sarsildi: 0, tuttu: 0, kapildi: 0, koltuk: -1, sonKoltuk: -1, kBos: false, bosS: 0, rakip: false, wobAktif: false, wobSon: 0, sarsAt: -99 });
  return d;
}
const babaHedefte = () => { const s = curSeg(); return !!s && s.to === BABA_HEDEF; };
function babaLook() { return { ...randomLook(true), f: true, beard: false, hair: "scarf", scarfC: pick(BABA_BASORTU), skirt: true, cane: true, bag: false }; }

// Oyuncunun önünde bir koltuk boşaltır ve işaretler. sessiz: koltuktaki hemen kalkar (kapı olmayan yolda, ?aktarma).
function babaKoltukAc(ds, sessiz) {
  if (ds.oturdu || ds.koltuk >= 0 || yoldasKoltuk() >= 0 || !yoldasNpc()) return;
  const i = pickSeat(); if (i < 0) return;
  ds.koltuk = i; ds.sonKoltuk = i; ds.bosS = 0; ds.rakip = false; ds.kBos = !G.seatOcc[i];
  if (G.seatOcc[i]) {
    if (sessiz) { G.seatOcc[i] = null; G.seatsDirty = true; ds.kBos = true; }
    else seatedLeaves(i, G.doorSide);
  }
  G.isaretKoltuk = i;
  flash("Babaanne için bir koltuk boşalıyor", C.sign, 1800);
}
// Koltuk boşaldı ama babaanne oturamadı: yakındaki ayakta bir yolcu koltuğa yönelir.
function babaRakip(ds) {
  const f = seatFront(ds.koltuk);
  const r = G.npcs.filter((n) => n.state === "stand" && !n.elder && !n.yoldas && !n.teh && !n.rival && !n.dozer && !n.mad && !n.wob && !n.act && !n.exitSide && n.alightAt !== G.seg
    && Math.hypot(n.x - f[0], n.z - f[1]) < BABA_RAKIP_MENZIL).sort((a, b) => Math.hypot(a.x - f[0], a.z - f[1]) - Math.hypot(b.x - f[0], b.z - f[1]))[0];
  if (!r) { ds.bosS = BABA_RAKIP_SN - 2; return; } // yakında kimse yok: iki sn sonra yine bakar
  ds.rakip = true;
  Object.assign(r, { toSeat: ds.koltuk, goal: [...f], state: "walk", speed: BABA_RAKIP_HIZ, stuck: 0, slowT: 0, wait: 0, via: false, path: [] });
  say(r, "Boş mu burası?", "talk", 1.6);
}
// Sert sarsıntıda ayaktaki babaanne sendeler; sonucu adim'de izlenir (tutuldu mu, tutulmadı mı).
function babaSars(ds, v) {
  if (v.s < BABA_SARS_ESIK || G.state !== "ride" || ds.saat - ds.sarsAt < BABA_SARS_ARA) return;
  const n = yoldasNpc(); if (!n || n.wob || n.state !== "stand" || n.toSeat >= 0 || n.fallT !== undefined) return; // yalnız ayakta duran sendeler (çekirdekle aynı)
  if (!startWob(n, v.v)) return;
  ds.sarsAt = ds.saat; ds.wobAktif = true; ds.wobSon = 0;
}
function babaKalk() {
  if (!yoldasKalk()) return false;
  G.isaretKoltuk = -1; flash("Babaanne kalkıyor", C.safe, 1200); tone(520, .06, "triangle", .08);
  return true;
}

DERTLER["babaanne"] = {
  ad: "Babaanneyi hastaneye götür",
  giris: "Babaannenle hastaneye gidiyorsun: ona yer bul, sarsılmasın, birlikte in.",
  basla: { hat: 5, seg: 0 },
  hedef: BABA_HEDEF,
  durum() {
    const ds = babaDs(); if (!ds) return "";
    let y = yoldasKoltuk() >= 0 ? "oturuyor" : ds.koltuk >= 0 ? (ds.kBos ? "koltuk boş" : "koltuk açılıyor") : "ayakta";
    if (ds.sarsildi) y += ` · ${ds.sarsildi} sarsıntı`;
    return y;
  },

  hat(ilk) {
    const ds = babaDs(); if (!ds) return;
    if (ilk) yoldasVer({ tip: "babaanne", ad: "Babaanne", elder: true, hiz: BABA_HIZ, look: babaLook() });
    else Object.assign(ds, { koltuk: -1, sonKoltuk: -1, kBos: false, bosS: 0, rakip: false, wobAktif: false }); // aktarma: yeni araçta koltuklar baştan
    G.isaretKoltuk = -1;
  },
  // Yol başı: sendeleme izi sıfırlanır (startSeg sendelemeyi siler). Geri yüklemede koltuk durumu seatOcc'tan yeniden türetilir.
  yol(geri) {
    const ds = babaDs(); if (!ds) return;
    ds.wobAktif = false;
    if (!geri) { // ?aktarma: kapısız tek yolda koltuk başta sessizce boşalır
      if (QUICK && curSeg().mine) babaKoltukAc(ds, true);
      return;
    }
    const k = yoldasKoltuk(), s = ds.sonKoltuk;
    ds.oturdu = k >= 0; ds.kBos = false; ds.bosS = 0; ds.rakip = false; ds.koltuk = -1; G.isaretKoltuk = -1;
    if (k < 0 && s >= 0 && !G.seatOcc[s]) { ds.koltuk = s; ds.kBos = true; G.isaretKoltuk = s; }
  },
  mod(m) { m.kapi *= BABA_KAPI; },
  adim(dt, h) {
    const ds = babaDs(), y = G.ortak.yoldas; if (!ds || !y || y.peron) return;
    const n = yoldasNpc(), k = yoldasKoltuk();
    // Sendeleme bitti mi: tutulduysa tuttu, tutulmadan toparlandıysa sarsıldı (yol değişince yarıda kalan sayılmaz).
    if (ds.wobAktif) {
      if (n && n.wob) ds.wobSon = n.wob.end;
      else {
        ds.wobAktif = false;
        if (ds.wobSon < 0) { ds.sarsildi++; flash("BABAANNE SARSILDI!", C.danger, 1000); tone(200, .12, "sawtooth", .07); }
        else if (ds.wobSon > 0) ds.tuttu++;
      }
    }
    if (k >= 0) { // oturuyor
      if (ds.koltuk >= 0) { ds.oturdu = true; ds.koltuk = -1; ds.kBos = false; G.isaretKoltuk = -1; flash("BABAANNE OTURDU", C.safe, 1500); beep(660, .08); }
      if (babaHedefte() && (G.announced || G.state === "doors")) { // hedef: koltuğu işaretle; önüne gelirsen kalkar
        G.isaretKoltuk = k;
        const f = seatFront(k);
        if (G.sitting < 0 && Math.hypot(G.pos[0] - f[0], G.pos[1] - f[1]) < BABA_KALK_MESAFE) babaKalk();
      }
      return;
    }
    if (ds.koltuk >= 0 && babaHedefte() && (G.announced || G.state === "doors")) { // hedef anons edildi: boş koltuk artık aranmaz
      ds.koltuk = -1; ds.kBos = false; ds.rakip = false; G.isaretKoltuk = -1;
    }
    if (ds.koltuk < 0) return;
    const o = G.seatOcc[ds.koltuk], f = seatFront(ds.koltuk);
    if (!o) {
      ds.kBos = true; ds.bosS += h;
      if (n && n.toSeat < 0 && !n.wob && n.fallT === undefined && Math.hypot(n.x - f[0], n.z - f[1]) <= BABA_OTUR_MESAFE) yoldasOtur(ds.koltuk);
      if (ds.rakip && !G.npcs.some((q) => q.toSeat === ds.koltuk && !q.yoldas)) { ds.rakip = false; ds.bosS = 0; } // yönelen vazgeçtiyse süre yeniden işler
      else if (!ds.rakip && ds.bosS >= BABA_RAKIP_SN) babaRakip(ds);
    } else if (ds.kBos && o !== "player" && !o.yoldas) { // başkası oturdu: sonraki durakta yeni koltuk boşalır
      ds.kapildi++; ds.koltuk = -1; ds.kBos = false; ds.rakip = false; G.isaretKoltuk = -1;
      flash("KOLTUK KAPILDI!", C.danger, 1400); tone(200, .1, "square", .08);
    }
  },
  olay(tip, v) {
    const ds = babaDs(); if (!ds || !G.ortak.yoldas) return;
    if (tip === "kapi") { if (!curSeg().mine) babaKoltukAc(ds, false); } // ilk ara durakta koltuk boşalır
    else if (tip === "anons") {
      const k = babaHedefte() ? yoldasKoltuk() : -1;
      if (k >= 0) { G.isaretKoltuk = k; flash("Babaanneye dokun: kalksın", C.sign, 2400); }
    } else if (tip === "sarsinti") babaSars(ds, v);
  },
  // Hedefte oturan babaanneye dokunmak onu kaldırır. Sendeleyene dokunuş çekirdekte (tut) kalır, buradan geçer.
  dokun(cx, cy) {
    if (G.state !== "ride" && G.state !== "doors") return false;
    const k = yoldasKoltuk();
    if (k < 0 || !babaHedefte() || !(G.announced || G.state === "doors")) return false;
    if (!tapOnNpc({ x: SEATS[k][0], z: SEATS[k][1] }, cx, cy)) return false;
    babaKalk();
    return true;
  },

  sonuc(b) {
    const ds = babaDs() || {}, oturdu = !!ds.oturdu, sars = ds.sarsildi | 0, tuttu = ds.tuttu | 0, birlikte = !b.kacirdi;
    const iyi = oturdu && birlikte && sars <= BABA_SARS_IYI;
    const satirlar = [
      [oturdu, oturdu ? "Babaanne oturdu" : "Babaanne hiç oturamadı"],
      [sars <= BABA_SARS_IYI, sars ? `${sars} kez sarsıldı` : tuttu ? `Hiç sarsılmadı (${tuttu} kez tuttun)` : "Hiç sarsılmadı"],
      [birlikte, birlikte ? "Birlikte indiniz" : "Durağı kaçırdınız"],
    ];
    if (iyi) return { iyi, baslik: "Hastanedesiniz", yazi: G.lineFalls ? "Sen kalkıp devam ettin, o oturdu." : "Sen ayakta kaldın, o oturdu.", satirlar };
    if (!birlikte) return { iyi, baslik: "Durağı kaçırdınız", yazi: "Babaannenin randevusu geride kaldı.", satirlar };
    if (!oturdu) return { iyi, baslik: "Babaanne ayakta geldi", yazi: "Yol boyunca oturacak yer bulamadı; dizleri sızladı.", satirlar };
    return { iyi, baslik: "Babaanne yorgun", yazi: "Sallantıda defalarca sendeledi; hastaneye soluk soluğa girdi.", satirlar };
  },
};
// <<< BÖLGE dert-babaanne

// >>> BÖLGE dert-kutulu-raf
// Kutulu raf: kolunun altında 1,5 m'lik kutuyla en kalabalık yoldan geç. Kutu ve çarpma hesabı ortak-yuk'ta; burada yalnız sayım, söz ve sonuç.
const RAF_CARP_COK = 3, RAF_CARP_KABUL = 2;                  // "bütün vagon baktı" eşiği; iyi bitiş için en çok çarpma
const RAF_SOZ = ["Yine mi!", "Şu rafı bırak artık!", "Dikkat et be!", "Kutuyla mı yaşıyorsun sen?"]; // tekrar çarpılana ek söz
DERTLER["kutulu-raf"] = {
  ad: "Kutulu raf", giris: "Eve yeni raf taşıyorsun; kutu senden uzun.",
  basla: { hat: 1, seg: 1, kalabalik: 3 },
  hedef: "Söğütlüçeşme",
  hat(ilk) { if (ilk) yukVer("kutu", "Kutu"); }, // aktarma yok; yine de perondan yeni araçta yük yeniden kurulmasın
  durum() { const k = G.ds ? G.ds.carp | 0 : 0; return k ? `${k} çarpma` : "kutu"; },
  olay(tip, v) {
    const d = G.ds; if (!d || tip !== "yuk-carpti") return;
    d.carp = (d.carp | 0) + 1; dertCipGuncelle();
    const n = v && v.n;
    if (n && n.hits > 1 && n.rafH !== n.hits) { // anger balonu yazdı; tekrar çarpılana farklı söz
      n.rafH = n.hits;
      say(n, "\u{1F4A2} " + RAF_SOZ[(n.hits - 2) % RAF_SOZ.length], "mad", MAD_T);
    }
  },
  sonuc(b) {
    // Hedef son durak: kaçırma çekirdekte missed() ile biter, buraya ulaşmaz; sonuc yalnız hedefte inilince çağrılır.
    const k = (G.ds && G.ds.carp) | 0;
    const iyi = k <= RAF_CARP_KABUL;
    const sahne = k === 0 ? "Kimse fark etmedi bile." : k < RAF_CARP_COK ? "Birkaç kişi dönüp baktı." : "Bütün vagon sana baktı.";
    return {
      iyi,
      baslik: iyi ? "Raf eve girdi" : "Raf geldi ama vagon unutmaz",
      yazi: sahne,
      satirlar: [
        [k === 0, k === 0 ? "Kimseye çarpmadın" : `${k} kez çarptın`],
        [k <= RAF_CARP_KABUL, k <= RAF_CARP_KABUL ? "Vagon seni hoş gördü" : "Vagon seni unutmaz"],
      ],
    };
  },
};
// <<< BÖLGE dert-kutulu-raf

// >>> BÖLGE dert-dugun
// Düğüne yetiş: topuklu ayakkabı (yavaş adım), dar kıyafet (geç toparlanma), elde hediye, üstün başın düzgün kalmalı.
// Sayılar geçici.
const DUGUN_SURE = 135;                    // saniye
const DUGUN_YURU = .6, DUGUN_TOPARLA = .8; // mod çarpanları (araç içi ve peron adımı; peron koşusu da yavaşlar)
const DUGUN_KOS_PAY = 16, DUGUN_KOS = [13, 22]; // koşu süresi: sure - saat + pay, bu aralığa sıkıştırılır (arka kapıdan: önce araçtan kapı hizasına yaklaşık 2,8 m, sonra işarete KOS_R düşülünce yaklaşık 17,8 m; toplam ~20,6 m / 1,8 m/sn = ~11,4 sn, 13 sn alt sınırda pay ~1,6 sn; bekleyenlerden kaçınma yolu uzatabilir)
const DUGUN_UST_IYI = .7;                  // üst baş puanı bunun üstündeyse "derli toplu"
const DUGUN_LOOK = { top: 0x7b1e3f, coat: null, pants: 0x20202c, shoes: 0x1a1216, w: .95 }; // dar şık kıyafet: bordo üst, koyu pantolon, montsuz
const DUGUN_TOPUK_RENK = 0xb3122f;
// Topuk: ayakkabının arkasında, tabanın biraz altına inen ince blok. Ölçüler [x, y, z boyutu], konum [y, z].
const DUGUN_TOPUK = STIL ? { s: [.05, .08, .05], y: -.27, z: .1 } : { s: [.03, .075, .03], y: -.375, z: .085 };

// Mesh'ler modül yüklenirken bir kez yaratılır; baldır grubuna (knees) takılır, oyuncuGiy yalnız ilk çocuğun geometrisini değiştirdiği için yerinde kalır.
const dugunTopuk = [0, 1].map(() => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), M(DUGUN_TOPUK_RENK));
  m.scale.set(...DUGUN_TOPUK.s); m.position.set(0, DUGUN_TOPUK.y, DUGUN_TOPUK.z); m.visible = false; return m;
});
let dugunTopukAcik = false;
function dugunTopukGoster(a) {
  for (let i = 0; i < 2; i++) { if (a && dugunTopuk[i].parent !== player.knees[i]) player.knees[i].add(dugunTopuk[i]); dugunTopuk[i].visible = a; }
  dugunTopukAcik = a;
}
// Topuk, başka dert seçilince de gizlenmeli; dert kancaları o zaman çalışmadığı için kancaları kendi MODS girdisi taşır.
MODS.push({
  id: "dert-dugun-topuk",
  sifirla() { if (dugunTopukAcik) dugunTopukGoster(false); },
  oyuncuKur() { if (dugunTopukAcik) dugunTopukGoster(true); }, // oyuncuGiy sonrası yeniden takılır
  ciz() {
    const a = G.dert === "dugun";
    if (a !== dugunTopukAcik || (a && dugunTopuk[0].parent !== player.knees[0])) dugunTopukGoster(a);
  },
});

DERTLER["dugun"] = {
  ad: "Düğüne yetiş",
  giris: "Topuklu ayakkabın, dar kıyafetin ve elindeki hediyeyle düğüne yetişmen gerek.",
  basla: { hat: 0, seg: 3 },
  hedef: "Altunizade",
  sure: DUGUN_SURE,
  durum() { return esyaElde() ? "hediye elinde" : esyaVar() ? "hediye yerde!" : "hediye yok"; },
  mod(m) { m.yuru *= DUGUN_YURU; m.toparla *= DUGUN_TOPARLA; },
  hat(ilk) {
    if (!ilk) return; // aktarmada kıyafet, hediye ve üst baş olduğu gibi sürer
    oyuncuGiy(DUGUN_LOOK);
    esyaVer("hediye", "Hediye");
    ustOto(true);
  },
  varis() {
    const t = Math.min(DUGUN_KOS[1], Math.max(DUGUN_KOS[0], DUGUN_SURE - G.ds.saat + DUGUN_KOS_PAY));
    return { kos: { sure: t, yazi: "Salona son anda gir" } };
  },
  sonuc(b) {
    const hed = esyaElde(), ust = ustPuan(), derli = ust >= DUGUN_UST_IYI, yet = !!b.yetisti, iyi = yet && hed;
    let baslik, yazi;
    if (b.kacirdi) { baslik = "Durağı kaçırdın"; yazi = "Düğün sensiz başladı."; }
    else if (!yet) { baslik = "Geç kaldın"; yazi = "Salona vardığında nikâh çoktan kıyılmıştı."; }
    else if (!hed) { baslik = "Eli boş girdin"; yazi = "Salona son anda girdin ama hediyen yoktu."; }
    else if (derli) { baslik = "Düğüne yetiştin"; yazi = "Salona son anda girdin; hediyen elinde, üstün başın düzgün."; }
    else { baslik = "Düğüne yetiştin"; yazi = "Salona son anda girdin; hediyen elinde ama üstün başın dağınık."; }
    return {
      iyi, baslik, yazi,
      satirlar: [
        [hed, hed ? "Hediye elinde" : esyaVar() ? "Hediyeyi yerde bıraktın" : "Hediyeyi kaybettin"],
        [derli, derli ? "Üstün başın derli toplu" : "Üstün başın dağıldı"],
        [yet, yet ? `Salona yetiştin (${Math.ceil(b.kalan || 0)} sn kala)` : "Salona yetişemedin"],
      ],
    };
  },
};
// <<< BÖLGE dert-dugun

// >>> BÖLGE dert-bavul
// Havalimanı bavulu: dev bavulla yoğun saatte biniş, Altunizade'de aktarma, Burhaniye'de inip yürüyen merdivene koşu.
// Bavulun kendisi ortak-yuk'ta; bu bölge yalnız kurar, ipucu verir ve sonucu yazar. Yolcuya hiçbir şey takılmaz.
const BAVUL_KOS_SURE = 13, BAVUL_IYI_CARPMA = 3;   // peron koşusu süresi (sn); iyi bitiş için en çok yolcu çarpması
const BAVUL_AKTARMA = "Burhaniye için Zincirlikuyu yönüne bin";

DERTLER["bavul"] = {
  ad: "Havalimanı bavulu", giris: "Dev bavulla yoğun saatte biniyorsun; uçak seni beklemez.",
  basla: { hat: 3, seg: 2, kalabalik: 4 }, hedef: "Burhaniye",
  hat(ilk) { if (ilk) yukVer("bavul", "Bavul"); }, // aktarmada (ilk false) yük ve bavul zaten sürer
  durum() { const y = G.ortak.yuk; return y && y.serbest ? "bavul kaçtı!" : ""; },
  peron() { // Altunizade peronunda bir kez: hangi araca binileceği
    if (!G.ds || G.ds.ipucu || G.pl.final || G.pl.name !== "Altunizade") return; // Acıbadem gibi ara duraklarda gösterme
    G.ds.ipucu = true; flash(BAVUL_AKTARMA, C.sign, 2600);
  },
  varis() { return { kos: { sure: BAVUL_KOS_SURE, yazi: "Yürüyen merdivene yetiş" } }; },
  sonuc(bilgi) {
    const y = G.ortak.yuk, kacti = y ? y.kacti : 0, carpti = y ? y.carpti : 0, yetisti = !!bilgi.yetisti;
    const satirlar = [
      [kacti === 0, kacti ? `Bavul ${kacti} kez kaçtı` : "Bavul hiç kaçmadı"],
      [carpti === 0, carpti ? `Kaçan bavul ${carpti} kez yolcuya çarptı` : "Bavul kimseye çarpmadı"],
    ];
    if (bilgi.kacirdi) {
      satirlar.push([false, "Burhaniye'de inemedin"]);
      return { iyi: false, baslik: "Durağı kaçırdın", yazi: "Bavulla kapıya yetişemedin; Burhaniye arkada kaldı.", satirlar };
    }
    satirlar.push([yetisti, yetisti ? "Yürüyen merdivene yetiştin" : "Yürüyen merdivene yetişemedin"]);
    if (!yetisti) return { iyi: false, baslik: "Uçak kalktı", yazi: "Merdivenin dibine geldin, bavulun tekerleği peronda kaldı.", satirlar };
    if (carpti > BAVUL_IYI_CARPMA) return { iyi: false, baslik: "Yetiştin ama", yazi: "Merdivene yetiştin; vagon bavulunu uzun süre unutmayacak.", satirlar };
    return { iyi: true, baslik: "Uçağa yetiştin", yazi: "Bavul ayağının dibinde, merdiven önünde; kimse fark etmedi bile.", satirlar };
  },
};

// >>> BÖLGE dert-son-sefer
// Son sefer: gece, yorgunsun. Uyku ds.uyku'da (0..1) zamanla artar; dokunmak ve sarsıntı azaltır. Ekran kararır, göz kapanır, LED durak adı yazmaz.
const SS_HEDEF = "Burhaniye", SS_BASLA = .2;     // başlangıç uykusu
const SS_HIZ = .03, SS_OTUR = 2;                 // saniyede artış; otururken çarpan
const SS_DOKUN = .2, SS_SARSINTI = .08;          // dokunuş ve sarsıntı uykuyu bu kadar azaltır
const SS_GECE = .2, SS_ENCOK = .94;              // gecenin sabit koyuluğu; uyku en çok bu kadar karartır
const SS_GOZ_ESIK = .7, SS_GOZ_KAPA = .99;       // göz kapanmaları bu uykudan sonra; kapanırken en çok koyuluk
const SS_ANONS_ESIK = .6, SS_ANONS_SN = 1600;    // anonsu bu uykunun altında duyarsın; durak adı kaç ms görünür
const SS_KOTU_UYKU = .85;                        // sonuçta "gözlerin kapandı" sayılan en yüksek uyku
const SS_LED = "· · ·";
const ssKarart = document.createElement("div"); // tam ekran siyah katman: HUD'un (z 2) altında, tuvalin üstünde
ssKarart.style.cssText = "position:absolute;inset:0;z-index:1;background:#000;opacity:0;pointer-events:none";
$("game").after(ssKarart);
let ssOp = 0, ssBasEgik = false;
function ssYaz(op) { if (op !== ssOp && (op === 0 || Math.abs(op - ssOp) > .004)) { ssOp = op; ssKarart.style.opacity = op; } }
function ssAzalt(x) { const ds = G.ds; if (ds && ds.uyku !== undefined) ds.uyku = Math.max(0, ds.uyku - x); }
const ssAktif = () => G.dert === "son-sefer" && !!G.ds && G.ds.uyku !== undefined && (G.state === "ride" || G.state === "doors");

// Görsel yalnız bu dert seçiliyken çalışan kancalarla yönetilemez (menüye dönünce dert kancası gelmez); bu yüzden küçük bir ortak kanca.
MODS.push({
  id: "son-sefer-gorsel",
  sifirla() { ssYaz(0); if (ssBasEgik) { player.head.rotation.x = 0; ssBasEgik = false; } },
  ciz(dt, now) {
    if (!ssAktif()) { ssYaz(0); if (ssBasEgik) { player.head.rotation.x = 0; ssBasEgik = false; } return; }
    const ds = G.ds, u = ds.uyku;
    let op = Math.min(SS_ENCOK, SS_GECE + (1 - SS_GECE) * u * u);
    if (ds.gozK > 0) op = Math.max(op, Math.min(1, Math.sin(Math.PI * (1 - ds.gozK / ds.gozS)) * 1.6) * SS_GOZ_KAPA);
    ssYaz(op);
    // Baş düşer: ?stil'de softBody başı sıfırlayıp kendi hesaplar; orada yalnız gövde eğimi görünür.
    if (G.state !== "fallen" && !G.pl) {
      const nod = u > .35 ? (u - .35) * .8 * (.75 + .25 * Math.sin(now * 1.7)) : 0;
      if (!STIL) { player.head.rotation.x = -nod; ssBasEgik = nod > 0 || ssBasEgik; }
      player.hip.rotation.x -= .1 * u * (.75 + .25 * Math.sin(now * 1.7));
    }
  },
});

DERTLER["son-sefer"] = {
  ad: "Son sefer", giris: `Gece, yorgunsun; ${SS_HEDEF}'de inmeyi sakın kaçırma.`,
  basla: { hat: 0, seg: 2 }, hedef: SS_HEDEF,
  durum() { return `${SS_HEDEF}'de in`; },
  anonsSessiz() { return !!G.ds && G.ds.uyku >= SS_ANONS_ESIK; }, // uykuluyken çan da çalmaz
  sifirla() { ssYaz(0); },
  hat(ilk) {
    if (!ilk || !G.ds) return;
    Object.assign(G.ds, { uyku: SS_BASLA, uykuMax: SS_BASLA, gozK: 0, gozS: 1, gozBek: 4, gozSay: 0, dusme: 0 });
  },
  yol(restored) {
    setLed(SS_LED); // duraktan çıkışta ve düşüp devam edince LED durak adı vermez
    if (restored && G.ds) G.ds.gozK = 0;
  },
  adim(dt) {
    const ds = G.ds; if (!ds || ds.uyku === undefined) return;
    ds.uyku = Math.min(1, ds.uyku + dt * SS_HIZ * (G.sitting >= 0 ? SS_OTUR : 1)); // oturunca uyku iki kat hızlı
    if (ds.uyku > ds.uykuMax) ds.uykuMax = ds.uyku;
    if (ds.gozK > 0) ds.gozK = Math.max(0, ds.gozK - dt);
    else if (ds.uyku > SS_GOZ_ESIK) {
      ds.gozBek -= dt;
      if (ds.gozBek <= 0) { // kısa göz kapanması: uyku arttıkça sık ve uzun
        const k = ds.uyku - SS_GOZ_ESIK;
        ds.gozS = ds.gozK = .5 + k * 2.5; ds.gozSay++;
        ds.gozBek = Math.max(1.8, 5 - k * 10) + Math.random() * 1.2;
      }
    }
  },
  dokun() { if (G.state === "ride" || G.state === "doors") ssAzalt(SS_DOKUN); return false; }, // dokunuşu yutma
  olay(tip) {
    const ds = G.ds; if (!ds) return;
    if (tip === "sarsinti") ssAzalt(SS_SARSINTI);
    else if (tip === "dusme") ds.dusme = (ds.dusme || 0) + 1;
    else if (tip === "anons") {
      setLed(SS_LED, true);
      if (ds.uyku < SS_ANONS_ESIK) { // uyanıksan anonsu duyarsın: durak adı kısa görünür
        flash(curSeg().to, C.sign, SS_ANONS_SN); // çanı çekirdek zaten çalıyor
      }
    } else if (tip === "kapi") setLed(SS_LED, true);
  },
  sonuc(b) {
    const ds = G.ds || {}, kac = !!b.kacirdi, goz = ds.gozSay || 0, dus = ds.dusme || 0;
    return {
      iyi: !kac,
      baslik: kac ? "Hat sonu" : "Doğru durak",
      yazi: kac ? `Gözünü açtığında ${SS_HEDEF} çoktan arkada kalmıştı; hat sonuna kadar gittin.`
        : `Kapı açıldığında tam doğru yerdeydin; gece havası yüzüne çarptı.`,
      satirlar: [
        [!kac, kac ? `${SS_HEDEF}'yi kaçırdın` : `${SS_HEDEF}'de indin`],
        [(ds.uykuMax || 0) < SS_KOTU_UYKU && goz === 0, goz ? `Gözlerin ${goz} kez kapandı` : (ds.uykuMax || 0) < SS_KOTU_UYKU ? "Gözlerin hiç kapanmadı" : "Gözlerin kapanmak üzereydi"],
        [dus === 0, dus ? `${dus} kez düştün` : "Ayakta uyuklayıp düşmedin"],
      ],
    };
  },
};

// >>> BÖLGE dert-turist
// Turisti götür: valizli bir turist yol soruyor. Dört tür (her oyunda biri): dev valizli (yavaş), fotoğraf çeken (ara ara durur),
// yanlış yöne yürüyen (peronda), teşekkür eden (kapıda 1,5 sn yolu kapatır). Yoldaşlık ortak-yoldas'ta; burada yalnız tür davranışı, görsel ve sonuç var.
// Durum G.ds'te (yalnız sayı ve bayrak; yolcu nesnesi tutulmaz). Turist başta bekler: dokunup çağırmak gerekir.
const TUR_LISTE = ["valiz", "foto", "yanlis", "tesekkur"];
const TUR_URL = new URLSearchParams(location.search).get("tur");           // deneme: ?tur=valiz|foto|yanlis|tesekkur
const TUR_HEDEF = "Acıbadem";
const TUR_HIZ = { valiz: .5, foto: .8, yanlis: .8, tesekkur: .8 };        // yoldaş hızı (m/sn)
const TUR_ACIL = .8, TUR_SOZ_ARA = 7, TUR_IPUCU = 6;                      // ilk soru gecikmesi, tekrar aralığı, "dokun" ipucu süresi (sn)
const TUR_DOKUN_R = .55;                                                  // bekleyen turistin yerine dokunuş payı (m)
const TUR_FOTO_ILK = [5, 9], TUR_FOTO_ARA = [11, 17];                             // ilk ve sonraki fotoğrafa kadar (sn)
const TUR_FOTO_UYARI = .9, TUR_FOTO_KLIK = .5, TUR_FOTO_CEKIM = 1.7;                  // uyarı balonu, deklanşör, toplam çekim süresi (sn)
const TUR_YANLIS_UYARI = .9, TUR_YANLIS_HIZ = 1.1;                                // işaret süresi (sn), ters yöne yürüme hızı (m/sn)
const TUR_TES_SURE = 1.5, TUR_TES_DONDUR = .5;                                    // kapıyı kapatma süresi (sn); bu sürede kapı sayacının ne kadarı durur
const TUR_KAYIP_UZAK = 9, TUR_KAYIP_SURE = 2;                                     // peronda bu kadar uzakta bu kadar kalırsa turist kaybolur
const TUR_BAK_HIZ = 1.3, TUR_BAK_ACI = .8;                                // bekleyen turistin başını çevirişi (bakınma)
const TUR_VAR = ["Buradayım!", "Evet, evet!", "Yanındayım!"], TUR_GELIYOR = ["Tamam!", "Geliyorum!", "Thank you!"];
const TUR_SOR = ["Acıbadem?", "Acıbadem… metrobüs?", "Excuse me, Acıbadem?"];
const TUR_SON = { // iyi sonuç sahnesi türe göre
  valiz: "Dev valizin son basamağa kadar yanında yürüdü. Turist elini göğsüne koyup eğildi.",
  foto: "Son fotoğrafı seninle çekti: sen, Acıbadem tabelası, bir de arkada kalkan metrobüs.",
  yanlis: "Haritayı ters tuttuğunu söyledin. Güldü, haritayı katlayıp doğru yöne yürüdü.",
  tesekkur: "Üç dilde teşekkür etti. Dördüncüsüne kapılar kapandı.",
};
// Görseller: geometri ve malzeme bir kez yaratılır, her yolcu mesh'i yalnız küçük gruplar kurar (disposePerson bunlara dokunmaz).
const TUR_GEO = {
  valiz: new THREE.BoxGeometry(.26, .7, .46), serit: new THREE.BoxGeometry(.275, .06, .475), sap: new THREE.BoxGeometry(.025, .28, .025),
  kam: new THREE.BoxGeometry(.11, .07, .06), mercek: new THREE.CylinderGeometry(.024, .024, .03, 10),
  harita: new THREE.BoxGeometry(.22, .28, .008), hatH: new THREE.BoxGeometry(.2, .012, .01),
  sapkaK: new THREE.CylinderGeometry(.19, .19, .012, 14), sapkaT: new THREE.CylinderGeometry(.1, .11, .09, 12),
};
const TUR_MAT = { valiz: M(0xc2452d), valizK: M(0x7a2a1a), sap: M(0x333333), kam: M(0x1d1f24), mercek: M(0x8aa4c8), harita: M(0xe9e0b8), hatH: M(0x4a8f5a), sapkaK: M(0xe8d9a8), sapkaT: M(0xb0462e) };
const turMesh = (g, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(TUR_GEO[g], TUR_MAT[m]); o.position.set(x, y, z); return o; };

// Türe göre görseli yolcu gövdesine takar (npcKur ve peron mesh'i): valiz yanda, kamera ve harita sağ elde, şapka kafada.
function turTak(b, tur) {
  b.turK = tur; b.turE = null;
  if (tur === "valiz") { const g = new THREE.Group(); g.add(turMesh("valiz", "valiz", 0, .35), turMesh("serit", "valizK", 0, .47), turMesh("sap", "sap", 0, .84)); g.position.set(.36, 0, 0); b.body.add(g); }
  else if (tur === "foto" || tur === "yanlis") {
    const g = new THREE.Group();
    if (tur === "foto") { g.add(turMesh("kam", "kam"), turMesh("mercek", "mercek", 0, 0, -.045)); g.children[1].rotation.x = Math.PI / 2; }
    else g.add(turMesh("harita", "harita"), turMesh("hatH", "hatH", 0, .03, .007));
    g.position.set(0, J.cupY - J.elbowY, -.03); g.scale.setScalar(J.cupS / 1.6); b.elbows[1].add(g); b.turE = g;
  } else if (tur === "tesekkur") { const g = new THREE.Group(); g.add(turMesh("sapkaK", "sapkaK", 0, 0), turMesh("sapkaT", "sapkaT", 0, .04)); g.position.y = J.headPiv + .085; b.head.add(g); }
}
// Turist pozu (kollar poseBody'den sonra): valiz kolu dışarı, harita göğüste, fotoğraf kolu yukarıda, işaret eden kol, bakınan baş.
function turPoz(b, now, bakin, serbest = true) {
  const d = G.ds, a = b.arms[1], e = b.elbows[1], k = d.fotoK || 0, ik = d.isK || 0;
  if (bakin) b.head.rotation.y = Math.sin(now * TUR_BAK_HIZ + 1) * TUR_BAK_ACI;
  if (serbest && d.tur === "valiz") a.rotation.z += .3; // düşen, kızan ve sendeleyen turistte kol pozları çekirdeğin pozuna bırakılır
  if (serbest && d.tur === "yanlis") { a.rotation.set(.9, 0, .08); e.rotation.x = 1.45; }
  if (serbest && k > .01) { a.rotation.x += (J.filmUp - a.rotation.x) * k; a.rotation.z += (.12 - a.rotation.z) * k; e.rotation.x += (J.filmEl - e.rotation.x) * k; b.head.rotation.x -= .08 * k; }
  if (serbest && ik > .01) { const l = b.arms[0]; l.rotation.x += (1.45 - l.rotation.x) * ik; l.rotation.z += (-.35 - l.rotation.z) * ik; b.elbows[0].rotation.x += (.2 - b.elbows[0].rotation.x) * ik; }
  if (b.turE) { // kamera ve harita dik kalır; ?stil'de softBody kolu sonradan yayın değerine yazar, o yüzden yaydaki (bir kare gecikmeli) açı okunur
    const S = STIL && b.soft && b.soft.init ? b.soft.x : null;
    b.turE.rotation.x = -((S ? S[4] : a.rotation.x) + (S ? S[7] : e.rotation.x)) - b.hip.rotation.x + (d.tur === "yanlis" ? .15 : 0);
  }
}
// Balon (araçta) ya da, peronda yolcu nesnesi olmadığı için, kısa yazı.
function turSoyle(yazi, tur, sure) { const n = yoldasNpc(); if (n) say(n, yazi, tur, sure); else flash(`Turist: ${yazi}`, tur === "ok" ? C.safe : C.sign, 1300); }
// Bekleyen turisti çağırır: seninle gelir. Fotoğraf çekerken "bir saniye" der; zaten yanındaysa yalnız cevap verir.
function turCagir(n) {
  const y = G.ortak.yoldas, d = G.ds;
  if (!y.bekle) { if (n) say(n, pick(TUR_VAR), "talk", 1.1); return; }
  if (d.fotoF === 2) return turSoyle("Bir saniye!", "warn", 1);
  d.cagri++; yoldasBekle(false); y.takipT = 0;
  if (d.yF === 2) d.yF = 3;
  if (!G.pl && n) { G.wave = .7; G.waveAt = { x: n.x, z: n.z }; }
  turSoyle(pick(TUR_GELIYOR), "ok", 1.3); tone(560, .06, "triangle", .08);
}
// Fotoğraf çeken tür: arada uyarı balonu (0,9 sn), sonra durur, çeker, bekler. Yeniden çağırmak gerekir. `uygun`: şimdi başlayabilir mi.
function turFotoAdim(h, uygun) {
  const d = G.ds, y = G.ortak.yoldas;
  if (d.tur !== "foto") return;
  if (d.fotoF === 0) {
    if (uygun && !y.bekle && (d.fotoT -= h) <= 0) { d.fotoF = 1; d.fotoS = 0; turSoyle("Bir fotoğraf!", "warn", TUR_FOTO_UYARI + .3); }
    return;
  }
  d.fotoS += h;
  if (d.fotoF === 1) { if (d.fotoS >= TUR_FOTO_UYARI) { d.fotoF = 2; d.fotoS = 0; d.klik = 0; yoldasBekle(true); } return; }
  if (!d.klik && d.fotoS >= TUR_FOTO_KLIK) { d.klik = 1; tone(2600, .03, "square", .05); tone(1900, .06, "square", .04, .05); }
  if (d.fotoS >= TUR_FOTO_CEKIM) { d.fotoF = 0; d.klik = 0; d.fotoT = TUR_FOTO_ARA[0] + Math.random() * (TUR_FOTO_ARA[1] - TUR_FOTO_ARA[0]); turSoyle("Güzel!", "ok", 1.2); }
}

DERTLER["turist"] = {
  ad: "Turisti götür", giris: "Bir turist yol soruyor; sen zaten o yöne gidiyorsun.",
  basla: { hat: 0, seg: 4 }, hedef: TUR_HEDEF,
  durum() { const y = G.ortak.yoldas; if (!y) return ""; return y.bekle ? "Turist bekliyor" : yoldasUzak() > 3 ? "Turist geride" : "Turist yanında"; },
  hat(ilk) {
    const d = G.ds; if (!d || !ilk) return;
    d.tur = TUR_LISTE.includes(TUR_URL) ? TUR_URL : TUR_LISTE[Math.floor(Math.random() * TUR_LISTE.length)];
    Object.assign(d, { cagri: 0, acilT: TUR_ACIL, sozT: TUR_SOZ_ARA, ipT: 0, ipucu: false, perIpucu: false,
      fotoT: TUR_FOTO_ILK[0] + Math.random() * (TUR_FOTO_ILK[1] - TUR_FOTO_ILK[0]), fotoF: 0, fotoS: 0, fotoK: 0, klik: 0, isK: 0, yF: 0, yS: 0, yz: 1,
      tesSeg: -1, tesT: 0, uzakT: 0, kayip: false, birlikte: false, yanlisHat: false });
    yoldasVer({ tip: "turist", ad: "Turist", hiz: TUR_HIZ[d.tur] });
    yoldasBekle(true); // kapıya kendiliğinden gelmez, dokunup çağırmak gerekir
  },
  yol(geri) { const d = G.ds; if (!d || !d.tur || !geri) return; Object.assign(d, { fotoF: 0, klik: 0, tesT: 0, yF: 0 }); }, // düşüp devam edince yarım kalan sahneler sıfırlanır
  adim(dt, h) {
    const d = G.ds, y = G.ortak.yoldas; if (!d || !d.tur || !y || y.peron) return;
    const n = yoldasNpc(); if (!n) return;
    if (d.tesT > 0) { d.tesT -= h; if (G.state === "doors") G.doorT += h * TUR_TES_DONDUR; } // teşekkür kapıyı tamamen yitirtmesin
    if (y.bekle && d.cagri === 0) { // henüz çağrılmadı: balonla hedefi sorar, bir süre sonra ipucu
      if (d.acilT > 0) { if ((d.acilT -= h) <= 0) { say(n, TUR_SOR[0], "talk", 3); d.sozT = TUR_SOZ_ARA; } }
      else if ((d.sozT -= h) <= 0) { say(n, pick(TUR_SOR), "talk", 2.4); d.sozT = TUR_SOZ_ARA; }
      if (!d.ipucu && (d.ipT += h) > TUR_IPUCU) { d.ipucu = true; flash("Turiste dokun: seninle gelsin", C.sign, 2400); }
    }
    turFotoAdim(h, G.state === "ride" && !G.announced);
  },
  peron(dt) {
    const d = G.ds, y = G.ortak.yoldas, pl = G.pl;
    if (!d || !d.tur || !y || !y.peron || !pl) return;
    if (!d.perIpucu && (pl.bus === "away" || pl.bus === "arriving")) { d.perIpucu = true; flash("Acıbadem için Söğütlüçeşme yönündeki araca bin", C.sign, 2600); }
    if (!y.dis) return; // araçtan peron kenarına çıkana dek karışmaz
    // Kayıp: peronda uzun süre çok uzakta kalan turist kaybolur (sonuçta ☆).
    if (Math.hypot(y.px - pl.x, y.pz - pl.z) > TUR_KAYIP_UZAK) {
      if ((d.uzakT += dt) >= TUR_KAYIP_SURE && !d.kayip) { d.kayip = true; flash("TURİST KAYBOLDU!", C.danger, 1800); tone(180, .3, "sawtooth", .07); }
    } else d.uzakT = Math.max(0, d.uzakT - dt * 2);
    turFotoAdim(dt, pl.door === null && pl.bus !== "closing");
    if (d.tur !== "yanlis") return;
    // Yanlış yöne yürüyen: önce işaret eder (0,9 sn), sonra peronun öbür ucuna doğru yürür; dokununca döner ve yanına gelir.
    if (d.yF === 0) { if (!y.bekle && pl.door === null) { d.yF = 1; d.yS = 0; turSoyle("Şu taraf mı?", "warn", 1.2); } }
    else if (d.yF === 1) { if ((d.yS += dt) >= TUR_YANLIS_UYARI) { d.yF = 2; d.yz = y.pz >= pl.z ? 1 : -1; yoldasBekle(true); } }
    else if (d.yF === 2) {
      if (!y.bekle) d.yF = 3;
      else { y.pz = Math.max(-PLAT_Z + .5, Math.min(PLAT_Z - .5, y.pz + d.yz * TUR_YANLIS_HIZ * dt)); y.px = Math.min(PLAT_MAX_X, y.px + dt * .35); }
    }
  },
  olay(tip, v) {
    const d = G.ds; if (!d || !d.tur) return;
    if (tip === "indi") {
      if (v.hedef) d.birlikte = true;
      Object.assign(d, { yF: 0, fotoF: 0, klik: 0, uzakT: 0, perIpucu: false, tesT: 0, tesSeg: -1 });
    } else if (tip === "bindi") {
      Object.assign(d, { yF: 0, fotoF: 0, klik: 0 });
      // Yalnız binilen yoldan sonrası sayılır; Acıbadem'e ya da aktarma durağı Altunizade'ye giden araç doğrudur. ?aktarma'da hatlar son yola kısaldığı için denetim atlanır.
      if (!QUICK && !curLine().seg.slice(G.seg).some((s) => s.to === TUR_HEDEF || s.to === "Altunizade")) { d.yanlisHat = true; d.kacirdi = true; flash("Bu araç Acıbadem'e gitmiyor!", C.danger, 2200); } // dert, inilen ilk durakta kötü biter
    } else if (tip === "anons") {
      const y = G.ortak.yoldas, n = yoldasNpc(), s = curSeg(); if (!y || !n) return;
      if (s.to === TUR_HEDEF) say(n, "Acıbadem bu mu?", "talk", 2.2);
      if (y.bekle && (s.to === TUR_HEDEF || s.mine)) flash("Turiste dokun: seninle insin", C.sign, 2400);
    }
  },
  dokun(cx, cy, x, z) {
    const d = G.ds, y = G.ortak.yoldas; if (!d || !d.tur || !y) return false;
    let n = null, o;
    if (!y.bekle) return false; // yanında yürüyen turistin gövdesi dokunuşu yutmaz; çekirdek yürüme ve tutma işini görür
    if (G.wob && !G.wob.wob.end && tapOnNpc(G.wob, cx, cy)) return false; // sendeleyeni tutma dokunuşu önceliklidir
    if (y.peron) { if (G.state !== "platform" || !G.pl || !y.dis || !y.bekle) return false; o = { x: y.px, z: y.pz }; } // peronda yalnız bekleyen turiste dokunulur
    else { n = yoldasNpc(); if (!n || n.fade < .5) return false; o = n; } // kamera ile oyuncu arasında saydamlaşmış turist dokunuşu yutmaz
    if (!(tapOnNpc(o, cx, cy, true) || (y.bekle && x !== null && Math.hypot(x - o.x, z - o.z) < TUR_DOKUN_R))) return false;
    turCagir(n); return true;
  },
  engel(ne) {
    const d = G.ds; if (ne !== "in" || !d || d.tur !== "tesekkur") return null;
    const n = yoldasNpc(); if (!n) return null;
    if (d.tesSeg !== G.seg) { // bu durakta ilk kez: yanına gelmiş turist kapı ağzında durup teşekkür eder
      if (yoldasUzak() > YD_INME_MESAFE) return null; // uzaksa ortak-yoldas zaten "geride" der
      d.tesSeg = G.seg; d.tesT = TUR_TES_SURE; n.act = { type: "talk", t: 0, dur: TUR_TES_SURE }; say(n, "Çok teşekkürler!", "talk", TUR_TES_SURE);
    }
    return d.tesT > 0 ? "Turist teşekkür ediyor!" : null;
  },
  npcKur(n, b) { if (n.yoldas === "turist" && G.ds && G.ds.tur) turTak(b, G.ds.tur); },
  npcCiz(n, b, dt, now) {
    const d = G.ds, y = G.ortak.yoldas; if (n.yoldas !== "turist" || !d || !d.tur || !y) return;
    if (b.turK !== d.tur) turTak(b, d.tur);
    const serbest = !n.mad && !n.wob && n.fallT === undefined && G.state !== "fallen";
    turPoz(b, now, y.bekle && n.state === "stand" && !n.act && serbest, serbest);
  },
  ciz(dt, now) {
    const d = G.ds, y = G.ortak.yoldas; if (!d || !d.tur || !y) return;
    d.fotoK += ((d.fotoF > 0 ? 1 : 0) - d.fotoK) * Math.min(1, dt * 7);
    d.isK += ((d.yF === 1 ? 1 : 0) - d.isK) * Math.min(1, dt * 8);
    if (!ydMesh || !ydMesh.root.visible || !y.peron) return; // peron mesh'i (ortak-yoldas kurar); araçta turist yolcu olarak npcCiz'de
    if (ydMesh.turK !== d.tur) turTak(ydMesh, d.tur);
    ydMesh.head.rotation.set(0, 0, 0);
    turPoz(ydMesh, now, y.bekle && !y.yur);
  },
  sonuc(b) {
    const d = G.ds, birlikte = !!d.birlikte && !b.kacirdi, kayboldu = !!d.kayip, iyi = birlikte && !kayboldu;
    const satirlar = [[birlikte, "Birlikte indiniz"], [!kayboldu, "Aktarmada kaybolmadı"]];
    if (iyi) return { iyi, baslik: "Turist yolunu buldu", yazi: TUR_SON[d.tur], satirlar: [...satirlar, [true, "Yeni hat açıldı: Altunizade → Söğütlüçeşme"]] };
    if (d.yanlisHat) return { iyi, baslik: "Yanlış araç", yazi: "Bu araç Acıbadem'e gitmiyordu. Turist haritaya baktı, sonra sana.", satirlar };
    if (b.kacirdi) return { iyi, baslik: "Acıbadem geride kaldı", yazi: "Turist pencereden Acıbadem tabelasının uzaklaşmasını izledi. \"Burası değil miydi?\"", satirlar };
    return { iyi, baslik: "Turist kayboldu", yazi: birlikte ? "Acıbadem'e vardınız ama turist aktarmada bir süre kayboldu; yolu başkalarına sormak zorunda kaldı." : "Peronda gözden kayboldu. Elinde harita, Acıbadem'in tersine yürüyordu.", satirlar };
  },
};
// <<< BÖLGE dert-turist

// ---------- Ekranlar ----------
const panel = $("panel"), overlay = $("overlay");
const show = (html) => { panel.innerHTML = html; overlay.hidden = false; overlay.scrollTop = 0; };
const hide = () => { overlay.hidden = true; overlay.onclick = null; };
const begin = () => { initAudio(); wake(); hide(); G.paused = false; };
function play(li) { begin(); dertAyarla(null); startLine(li); }
function resume() { begin(); restartSeg(); }
function wake() { try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {} }

function showMenu() {
  if (TEST !== null) {
    show(`<h1>Tutunmak yasak</h1><button class="primary" id="go" type="button">Başla</button>`);
    $("go").onclick = () => { enableTilt(); play(-1); };
    return;
  }
  const only = new URLSearchParams(location.search).get("dert");
  if (only && DERTLER[only]) { // ?dert=<id>: menü yerine yalnız o dert
    show(`<h1>${esc(DERTLER[only].ad)}</h1><p>${esc(DERTLER[only].giris)}</p><button class="primary" id="go" type="button">Başla</button>`);
    $("go").onclick = () => { enableTilt(); dertBasla(only); };
    return;
  }
  const ids = QUICK ? [] : Object.keys(DERTLER); // ?aktarma hatları tek yola indirir, dertlerin hedefi kalmaz; dert denemek için ?dert=<ad>&aktarma
  show(`<h1>Tutunmak yasak</h1>
    <p>Telefonu eğ, ayakta kal. Yol boyunca görevini yap, durağında in.</p>
    <button class="primary" id="go" type="button">Hatta bin</button>
    ${ids.length ? `<h2>Bugünkü derdin</h2>${ids.map((id) => `<button class="dert" data-dert="${esc(id)}" type="button">${esc(DERTLER[id].ad)}<small>${esc(DERTLER[id].giris)}</small></button>`).join("")}` : ""}`);
  $("go").onclick = () => { enableTilt(); play(0); };
  panel.querySelectorAll("button.dert").forEach((b) => { b.onclick = () => { enableTilt(); dertBasla(b.dataset.dert); }; });
}

function showTest() {
  show(`<h1>${G.testWon ? "Düşmedin!" : "Düştün"}</h1>
    <p>${G.testText}</p>
    <p class="score">Puan ${Math.floor(G.score)}${G.newBest ? " · YENİ REKOR!" : ` · Rekor ${tlog.best || 0}`}</p>
    <p class="small">${Math.floor(G.testT)} sn dayandın · Deneme ${tlog.tries} · En uzun ${Math.floor(tlog.bestT)} sn · Bitiren ${tlog.wins || 0}</p>
    <button class="primary" id="again" type="button">Tekrar</button>`);
  $("again").onclick = () => play(-1);
  overlay.onclick = (e) => { if (e.target === overlay) play(-1); }; // panelin dışına dokunmak da baştan başlatır
}

function showArrived() {
  const line = curLine(), last = G.line + 1 >= LINES.length;
  const rows = line.seg.map((s, i) => segGorev(s) ? `<li>${G.results[i] ? "★ " + TASKS[s.task].ok : "☆ " + TASKS[s.task].fail}</li>` : "").join("");
  show(`<h1>İndin!</h1>
    <p>${line.name} · ${line.seg[line.seg.length - 1].to}</p>
    <div class="stars">${"★".repeat(G.lastStars)}${"☆".repeat(3 - G.lastStars)}</div>
    <ul>
      <li>★ Durağında indin</li>
      ${rows}
      <li>${!G.lineStumbled && !G.lineFalls ? "★" : "☆"} Hiç tökezlemeden, düşmeden</li>
    </ul>
    <p class="score">Puan ${Math.floor(G.score)}${G.newBest ? " · YENİ REKOR!" : ` · Rekor ${best[G.line] || 0}`}</p>
    <p class="small">Çarpma: ${G.bumps}</p>
    ${last ? `<pre id="sum">${summary()}</pre><button id="copy" type="button">Sonucu kopyala</button>` : ""}
    <button class="primary" id="next" type="button">${last ? "Baştan oyna" : "Sonraki hat"}</button>
    <button id="retry" type="button">Bu hattı tekrar oyna</button>`);
  $("next").onclick = () => play(last ? 0 : G.line + 1);
  $("retry").onclick = () => play(G.line);
  if (last) $("copy").onclick = (e) => {
    const b = e.currentTarget;
    if (!navigator.clipboard) { b.textContent = "Metni seçip kopyala"; return; }
    navigator.clipboard.writeText(summary()).then(() => { b.textContent = "Kopyalandı"; }, () => { b.textContent = "Metni seçip kopyala"; });
  };
}

// Oyunu durdurur; kapanana kadar zaman akmaz.
function showPause() {
  if (!overlay.hidden || (G.state !== "ride" && G.state !== "doors")) return;
  G.paused = true; G.userPause = true;
  show(`<h1>Durdu</h1>
    <p>${curLine().name} · ${curSeg().to} yolunda</p>
    <button class="primary" id="cont" type="button">Devam et</button>
    <button id="menu" type="button">${G.dert ? "Derdi baştan başlat" : "Hattın başına dön"}</button>`);
  $("cont").onclick = () => { G.userPause = false; begin(); };
  $("menu").onclick = () => { G.userPause = false; if (G.dert) dertBasla(G.dert); else play(G.line); };
}

function showEnd(title, text) {
  const seg = curSeg();
  show(`<h1>${title}</h1>
    <p>${text}</p>
    <button class="primary" id="retry" type="button">${G.seg ? "Bu duraktan devam" : "Tekrar dene"}</button>
    <button id="menu" type="button">${G.dert ? "Derdi baştan başlat" : "Hattın başına dön"}</button>`);
  $("retry").onclick = resume;
  $("menu").onclick = () => (G.dert ? dertBasla(G.dert) : play(G.line));
}

function summary() {
  const stars = G.starsByLine.reduce((a, b) => a + (b || 0), 0);
  return `Metro Denge Prototipi (hat yolculuğu)\nYıldız: ${stars}/${LINES.length * 3}\nDüşme: ${G.falls}\nKaçırılan durak: ${G.misses}\nKurtarma: ${G.rescues}\nKontrol: ${tilt.on ? "eğme" : "parmak"}, gizli yardım ${T.help ? "açık" : "kapalı"}\nAyarlar: eğim ${T.tilt}°, sarsıntı ${T.force}, ters ${T.invert ? "evet" : "hayır"}\nCihaz: ${navigator.userAgent}`.replace(/</g, "&lt;");
}

function showSettings() {
  const wasPaused = G.paused; G.paused = true;
  const wasHidden = overlay.hidden;
  overlay.onclick = null;
  show(`<h1>Ayarlar</h1>
    <div class="row"><label for="s-tilt">Tam güç için eğim (°) <output id="o-tilt"></output></label><input id="s-tilt" type="range" min="8" max="45" step="1"></div>
    <div class="row"><label for="s-force">Sarsıntı gücü <output id="o-force"></output></label><input id="s-force" type="range" min=".6" max="1.4" step=".05"></div>
    <div class="row"><label for="s-gain">Düzeltme gücü <output id="o-gain"></output></label><input id="s-gain" type="range" min="5" max="12" step=".5"></div>
    <p class="small">Kontrol: ${tilt.on ? "telefonu eğme" : "parmakla sürükleme (eğme verisi gelmiyor)"}</p>
    <button id="inv" type="button"></button>
    <button id="help" type="button"></button>
    <button id="snd" type="button"></button>
    <button id="reset" type="button">Varsayılana dön</button>
    ${TEST !== null ? `<button id="tclr" type="button">Test kaydını sıfırla (deneme ${tlog.tries || 0})</button>` : ""}
    <button class="primary" id="close" type="button">Kapat</button>`);
  if (TEST !== null) $("tclr").onclick = (e) => { tlog = {}; try { localStorage.removeItem(TEST_KEY); } catch (err) {} e.currentTarget.textContent = "Test kaydı sıfırlandı"; };
  const bind = (k) => {
    const i = $("s-" + k), o = $("o-" + k);
    const sync = () => { i.value = T[k]; o.textContent = T[k]; };
    i.oninput = () => { T[k] = +i.value; o.textContent = T[k]; saveT(); };
    return sync;
  };
  const syncs = ["tilt", "force", "gain"].map(bind);
  const sync = () => {
    $("snd").textContent = T.sound ? "Sesi kapat" : "Sesi aç";
    $("inv").textContent = T.invert ? "Eğim yönü: ters" : "Eğim yönü: normal";
    $("help").textContent = T.help ? "Gizli yardım: açık" : "Gizli yardım: kapalı";
  };
  $("snd").onclick = () => { T.sound = !T.sound; saveT(); sync(); };
  $("inv").onclick = () => { T.invert = !T.invert; saveT(); sync(); };
  $("help").onclick = () => { T.help = !T.help; saveT(); sync(); };
  $("reset").onclick = () => { Object.assign(T, DEFAULTS); saveT(); syncs.forEach((f) => f()); sync(); };
  syncs.forEach((f) => f()); sync();
  $("close").onclick = () => {
    G.paused = wasPaused;
    if (wasHidden) hide(); else rebindPanel();
  };
}
// Ayarlardan dönünce önceki paneli yeniden göster.
function rebindPanel() {
  if (G.userPause) { overlay.hidden = true; showPause(); }
  else if (G.state === "menu") showMenu();
  else if (curSeg().test) showTest();
  else if (G.state === "arrived" && G.dertSon) showDert();
  else if (G.state === "arrived") showArrived();
  else if (G.state === "fallen") showEnd("Düştün", FALL_LINES[G.falls % FALL_LINES.length]);
  else if (G.state === "missed") showEnd("Durağı kaçırdın", MISS_LINES[G.misses % MISS_LINES.length]);
}
$("gear").onclick = showSettings;
$("pause").onclick = showPause;
// Uygulamadan çıkınca oyun durur, dönünce "Devam et" beklenir.
document.addEventListener("visibilitychange", () => { if (document.hidden) { showPause(); G.paused = true; } });

// Test kancası
window.__denge = { DERTLER, MODS, kanca, dertBasla, dertBitir, ev: (s) => eval(s), frame, poke, tapPerson, updateGags, look, camera, catchWob, tapOnNpc, servicesAt, pickDoor, platWalk, fallEnd, phones, busG, people: () => ({ crowdMeshes, seatedMeshes, player }), STIL, renderer, bridge, land, station, G, T, LINES, SEGS, SEATS, DOORS, step, startLine, startSeg, restartSeg, setWalkTarget, seatFront, FIXED, tilt, onOrient, pushStatic, BODY_R, doorPanels, glowMats, fall, nextInLine };

startLine(TEST !== null ? -1 : 0); G.state = "menu"; setLed(TEST !== null ? "Tutunmak yasak" : "Hatta bin"); setTask(); flash("", C.text);
showMenu();
requestAnimationFrame(frame);
</script>

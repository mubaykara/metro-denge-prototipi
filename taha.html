<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Metro Denge Prototipi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
/* Düzen: tek ekran, vagonun içi 3D. Üstte vagonun LED tabelası, ortada karakter. Metro tabelası dili. */
:root {
  color-scheme: dark;
  --tunnel: #10151b;
  --wall: #232b34;
  --floor: #2e3843;
  --steel: #6d7a88;
  --text: #eef2f5;
  --muted: #a6b1bc;
  --sign: #ffc82e;
  --safe: #4cc9b0;
  --danger: #ff6b57;
  --led: #ff9f1a;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0; background: var(--tunnel); color: var(--text); font-family: var(--body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#led {
  position: absolute; z-index: 2; left: 10px; right: 92px; top: calc(10px + env(safe-area-inset-top, 0px));
  padding: 7px 10px; border-radius: 6px; background: #0b0d10; border: 1px solid #2a2f36;
  font: 700 17px/1.1 var(--display); letter-spacing: .06em; color: var(--led); text-transform: uppercase;
  text-shadow: 0 0 8px rgba(255, 159, 26, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#led.blink { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { color: #3a2a10; text-shadow: none; } }
#task {
  position: absolute; z-index: 2; left: 10px; top: calc(52px + env(safe-area-inset-top, 0px)); max-width: calc(100% - 20px);
  padding: 5px 10px; border-radius: 6px; background: rgba(11, 13, 16, .85); border: 1px solid #2a2f36;
  font: 700 15px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--text);
}
#task.ok { color: var(--safe); border-color: var(--safe); }
#task.fail { color: var(--danger); border-color: var(--danger); }
#gear {
  position: absolute; z-index: 2; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
  font: 600 13px var(--body); color: var(--muted); background: var(--wall);
  border: 1px solid var(--steel); border-radius: 6px; padding: 8px 9px;
}
#pause {
  position: absolute; z-index: 2; right: 10px; top: calc(54px + env(safe-area-inset-top, 0px));
  width: 44px; height: 44px; font: 700 16px var(--body); color: var(--text); background: var(--wall);
  border: 1px solid var(--steel); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
#pause i { width: 5px; height: 16px; background: var(--text); border-radius: 1px; }
/* Sarsıntı uyarısı: itileceğin yöndeki ekran kenarı parlar */
.cue { position: absolute; z-index: 1; pointer-events: none; opacity: 0; }
.cue.l { left: 0; top: 0; bottom: 0; width: 22%; background: linear-gradient(to right, var(--cue, rgba(255, 200, 46, .75)), transparent); }
.cue.r { right: 0; top: 0; bottom: 0; width: 22%; background: linear-gradient(to left, var(--cue, rgba(255, 200, 46, .75)), transparent); }
.cue.t { left: 0; right: 0; top: 0; height: 16%; background: linear-gradient(to bottom, var(--cue, rgba(255, 200, 46, .75)), transparent); }
.cue.b { left: 0; right: 0; bottom: 0; height: 16%; background: linear-gradient(to top, var(--cue, rgba(255, 200, 46, .75)), transparent); }
/* Tutunmama çarpanı */
#combo {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  text-align: center; pointer-events: none; font: 700 20px var(--display); letter-spacing: .04em; color: var(--muted);
  text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
}
#combo b { font-size: 40px; color: var(--sign); margin-right: 8px; display: inline-block; }
#combo b.pop { animation: pop .35s ease-out; }
#combo.lost b { color: var(--muted); }
@keyframes pop { from { transform: scale(1.6); } to { transform: scale(1); } }
#flash {
  position: absolute; z-index: 2; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none;
  font: 700 34px var(--display); letter-spacing: .03em; text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0, 0, 0, .7); opacity: 0; transition: opacity .25s;
}
#flash.on { opacity: 1; transition: none; }
#overlay {
  position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
  background: rgba(16, 21, 27, .82); overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
#panel { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; margin: auto; }
#panel h1 {
  margin: 0; font: 700 44px/1 var(--display); letter-spacing: .01em; text-transform: uppercase;
  color: var(--sign); text-wrap: balance;
}
#panel p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--text); }
#panel ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; line-height: 1.4; }
#panel .small { font-size: 14px; color: var(--muted); }
#panel .stars { font: 700 44px var(--display); color: var(--sign); letter-spacing: .1em; }
#panel .score { font: 700 22px var(--display); letter-spacing: .04em; color: var(--text); }
#panel button {
  font: 700 22px var(--display); letter-spacing: .03em; text-transform: uppercase;
  padding: 14px; border-radius: 6px; border: 1px solid var(--steel);
  background: var(--wall); color: var(--text); touch-action: manipulation;
}
#panel button.primary { background: var(--sign); color: var(--tunnel); border-color: var(--sign); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--safe); outline-offset: 2px; }
.row { display: grid; gap: 4px; font-size: 15px; }
.row label { display: flex; justify-content: space-between; gap: 12px; }
.row output { font-variant-numeric: tabular-nums; color: var(--sign); }
input[type=range] { width: 100%; accent-color: var(--sign); touch-action: pan-x; }
pre {
  margin: 0; padding: 10px; background: var(--tunnel); border: 1px solid var(--wall); border-radius: 6px;
  font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);
  -webkit-user-select: text; user-select: text;
}
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>

<body>
<div id="app">
  <canvas id="game" role="img" aria-label="Metro vagonunun içinde ayakta duran karakter, yolcular ve kapılar"></canvas>
  <div id="led"></div>
  <div id="task" hidden></div>
  <button id="gear" type="button">Ayarlar</button>
  <button id="pause" type="button" aria-label="Duraklat"><i></i><i></i></button>
  <div class="cue l"></div><div class="cue r"></div><div class="cue t"></div><div class="cue b"></div>
  <div id="combo" hidden><b>×1</b><span>0</span></div>
  <div id="flash"></div>
  <div id="overlay"><div id="panel"></div></div>
</div>

<script type="module">
import * as THREE from "three";

const $ = (id) => document.getElementById(id);
const css = getComputedStyle(document.documentElement);
const C = Object.fromEntries(["tunnel", "wall", "floor", "steel", "text", "muted", "sign", "safe", "danger"]
  .map((k) => [k, css.getPropertyValue("--" + k).trim()]));

// ---------- Ayarlanabilir değerler ----------
// tilt: tam güç için gereken eğim (derece); invert: eğim yönlerini ters çevir; help: gizli yardım açık mı.
const DEFAULTS = { gain: 8, force: 1, recover: 2, tilt: 22, invert: false, help: true, sound: true };
const T = { ...DEFAULTS };
try { Object.assign(T, JSON.parse(localStorage.getItem("denge-ayar-5") || "{}")); } catch (e) {}
const saveT = () => { try { localStorage.setItem("denge-ayar-5", JSON.stringify(T)); } catch (e) {} };

// Denge: telefonu hangi yöne eğersen karakterin ağırlığı oraya kayar. Yürümek için yere dokunursun.
// Yürürken denge çok daha zayıftır, bu yüzden ne zaman yürüyeceğine yolu okuyarak karar verirsin.
// Zor görünür, kolay oynanır: karakter gerçekte olduğundan daha yatık çizilir, gizli yardım
// zorlanan ama çabalayan oyuncuya fark ettirmeden yardım eder, kapı yetişmek üzere olana biraz daha açık kalır.
const DAMP = 3, STUMBLE_TIME = 1.6, FALL_LIMIT = 1.8, FIXED = 1 / 120, THUMB_RANGE = 60;
const SHOW = 1.5, DEAD_ZONE = 2, NEUTRAL_DRIFT = 5;
const WALK_SPEED = 1.3, WALK_FORCE = 1.7, WALK_RECOVER = .6, AHEAD = 10;
const DOOR_OPEN = 4, STOP_TIME = 5.5, ANNOUNCE = 10, NPC_SPEED = .9, ELDER_SPEED = .45, RIVAL_SPEED = .7;

// ---------- Araç ölçüleri (metre): körüklü metrobüs. x sağa, z arkaya, ön cam z = BUS.front'ta ----------
// İstanbul metrobüsü şeridin solundan gider; kapılar hep sağdan, iki yönün ortasındaki peronlara açılır.
const BUS = { halfW: 1.27, front: -9.2, back: 9.2, height: 2.45 };
const JOINT = -1; // körük (ön ve arka gövdenin birleştiği döner tabla)
const DOORS = [-7.9, -3.4, 1.9, 6.6]; // sağ duvardaki dört kapının z konumları
const START = [.2, 3.4];
const nearDoor = (z) => DOORS.some((d) => Math.abs(z - d) < .55);
const inDoorZone = (x, z, side) => x * side > .55 && nearDoor(z);
const sideName = (s) => (s > 0 ? "sağdan" : "soldan");

// ---------- Çarpışma (kuşbakışı x,z). Beden, kol ve baş duvardan, koltuktan, direkten ya da başka birinden geçmez ----------
// BODY_R kollar dahil beden yarıçapı. Üst gövde dengeye göre LEAN_M metre/birim kayar; bir şeye değince oraya yaslanır.
const BODY_R = .3, TORSO_R = .22, SHOULDER_R = .24, LEAN_M = .55, WALL_X = BUS.halfW - .04;
const POLES = []; // [x, z, yarıçap]
// Koridor kenarında, koltuk sıralarının arasında dikey direkler; körükte direk yok
for (let z = -7.2; z <= 8.4; z += 1.6) {
  if (Math.abs(z - JOINT) < .8) continue;
  POLES.push([-.31, z, .03]);
  // Sağda tekli koltuk sırası varsa koridor kenarında, yoksa (ayakta durma alanı) cam kenarında
  if (!DOORS.some((d) => Math.abs(z - d) < .8)) POLES.push([z < JOINT - .9 || z > 7.5 ? .74 : WALL_X - .07, z, .03]);
}
for (const d of DOORS) for (const s of [-1, 1]) POLES.push([WALL_X, d + s * .57, .03]); // kapı çerçeveleri
// Koltuklar öne bakar: solda ikili, sağda tekli sıralar. Kapı önleri, körük ve tekerlekli sandalye alanı boş.
// Cam kenarındaki koltuğa yalnızca yanındaki koridor koltuğundan geçilir; görevler koridor koltuklarını seçer.
const SEATS = [], SEAT_AISLE = [];
for (let z = -7.6; z <= 8.7; z += .8) {
  if (Math.abs(z - JOINT) < .9) continue;
  if (Math.abs(z - DOORS[2]) >= 1) { SEATS.push([-1, z]); SEAT_AISLE.push(false); SEATS.push([-.55, z]); SEAT_AISLE.push(true); }
  if ((z < JOINT - .9 || z > 7.5) && !DOORS.some((d) => Math.abs(z - d) < 1)) { SEATS.push([.98, z]); SEAT_AISLE.push(true); } // arka gövdenin sağı ayakta durma alanı
}
const AISLE_X = .22; // koridorun ortası
// Sağda tekli koltuk olan sıralarda koridor tek kişilik: ayakta duran orayı kapatır, yolcular orada durmaz.
const PINCH = (z) => SEATS.some(([sx, sz]) => sx > 0 && Math.abs(sz - z) < .62);
const seatFront = (i) => [SEATS[i][0] < 0 ? -.02 : .45, SEATS[i][1]];
const RECTS = SEATS.map(([x, z]) => [x - .22, x + .22, z - .21, z + .23]);
const CAB = [-BUS.halfW, -.12, BUS.front, BUS.front + 1.05]; // sol öndeki sürücü kabini
RECTS.push(CAB);
function pushCircle(pt, R, x, z) {
  const dx = pt[0] - x, dz = pt[1] - z, d = Math.hypot(dx, dz);
  if (d >= R) return;
  if (d < 1e-6) { pt[0] = x - Math.sign(x || 1) * R; return; }
  pt[0] = x + dx / d * R; pt[1] = z + dz / d * R;
}
// Noktayı (r yarıçaplı beden) sabit engellerin dışına iter; itildiyse true döner.
function pushStatic(pt, r) {
  const x0 = pt[0], z0 = pt[1];
  for (let it = 0; it < 3; it++) {
    pt[0] = Math.max(-WALL_X + r, Math.min(WALL_X - r, pt[0]));
    pt[1] = Math.max(BUS.front + .04 + r, Math.min(BUS.back - .04 - r, pt[1]));
    for (const [a, b, c, e] of RECTS) {
      const cx = Math.max(a, Math.min(b, pt[0])), cz = Math.max(c, Math.min(e, pt[1]));
      const dx = pt[0] - cx, dz = pt[1] - cz, d = Math.hypot(dx, dz);
      if (d >= r) continue;
      if (d < 1e-6) pt[0] = a > 0 ? a - r : b + r;
      else { pt[0] = cx + dx / d * r; pt[1] = cz + dz / d * r; }
    }
    for (const [x, z, pr] of POLES) pushCircle(pt, r + pr, x, z);
  }
  return Math.abs(pt[0] - x0) > 1e-6 || Math.abs(pt[1] - z0) > 1e-6;
}
// Üst gövdenin değebileceği yüzeyler: [nx, nz, uzaklık, yolcu]. Açık kapının olduğu yerde duvar yok.
function supports(x, z, openSide) {
  const out = [];
  const gap = openSide && nearDoor(z);
  if (!(gap && openSide > 0)) out.push([1, 0, WALL_X - x, null]);
  if (!(gap && openSide < 0)) out.push([-1, 0, WALL_X + x, null]);
  out.push([0, -1, z - BUS.front - .04, null], [0, 1, BUS.back - .04 - z, null]);
  const circ = (cx, cz, r, who) => {
    const dx = cx - x, dz = cz - z, d = Math.hypot(dx, dz);
    if (d < 1.4 && d > 1e-6) out.push([dx / d, dz / d, d - r, who]);
  };
  for (const [px, pz, pr] of POLES) circ(px, pz, pr, null);
  for (const n of G.npcs) if (n.state !== "exit" && n.state !== "board") circ(n.x, n.z, TORSO_R, n);
  return out;
}
// Kolların yana açılabileceği boşluk (sol, sağ), omuz ekleminden ölçülür.
function armRoom(x, z, p, openSide) {
  const room = [9, 9];
  for (const [nx, nz, d] of supports(x, z, openSide)) for (let i = 0; i < 2; i++) {
    const s = i ? 1 : -1;
    if (nx * s < .5) continue;
    room[i] = Math.min(room[i], (d - s * p[0] * LEAN_M) / (nx * s) - .33);
  }
  return room;
}
// Kapıdan çıkmakta olan (yarıdan fazlası dışarıda) artık engel sayılmaz; binmekte olan kapı ağzını tutar.
const solidNpcs = () => G.npcs.filter((n) => n.state !== "exit" || n.outT < .5);
const hitsPerson = (pt, r, skip) => solidNpcs().some((n) => n !== skip && Math.hypot(n.x - pt[0], n.z - pt[1]) < r);
// Bir yönde düşmeden önce ne kadar boş yer var
function freeDist(x, z, dx, dz, skip = null, noPeople = false) {
  for (let t = .1; t < 1.8; t += .05) {
    const pt = [x + dx * t, z + dz * t];
    if (pushStatic(pt, .15) || (!noPeople && hitsPerson(pt, TORSO_R + .15, skip))) return t;
  }
  return 1.8;
}

// ---------- Hat verisi ----------
// Bir oyun bir hat yolculuğudur. Ara duraklarda yolcular iner biner, kapı tarafı duraktan durağa değişir,
// her ara yolun bir görevi olur. Asıl hedef kendi durağında inmektir.
const UP = [0, -1], DOWN = [0, 1], L = [-1, 0], R = [1, 0];
const KV = { accel: DOWN, brake: UP, left: R, right: L };
const ev = (t, k, s, d, v) => ({ t, k, s: s * .8, d, v: v || KV[k] });
// Yol kalıpları: kuvvetler sabit, ezberlenebilir; sonuncusu en zoru.
const SEGS = [
  { dur: 24, sway: .3, ev: [ev(1.5, "accel", 4, 1.4), ev(6, "left", 4, 1.8), ev(11, "right", 4, 1.8), ev(21, "brake", 4.5, 2.6)] },
  { dur: 26, sway: .5, ev: [ev(1.5, "accel", 4.5, 1.4), ev(6, "brake", 4, .9), ev(8, "accel", 4, 1), ev(12, "left", 5, 1.6), ev(15.5, "right", 5, 1.6), ev(22.8, "brake", 5, 2.8)] },
  { dur: 28, sway: .7, ev: [ev(1.5, "accel", 5, 1.3), ev(5, "pot", 11, .22, UP), ev(8, "right", 5.5, 1.7), ev(12, "pot", 12, .22, L), ev(13.4, "pot", 12, .22, R), ev(16, "left", 5.5, 1.7), ev(19, "pot", 12, .22, DOWN), ev(24.6, "brake", 5.5, 2.8)] },
  { dur: 30, sway: .9, ev: [ev(1.5, "accel", 5.5, 1.2), ev(5, "left", 6, 1.3), ev(6.6, "right", 6, 1.3), ev(10, "brake", 6, .8), ev(11.2, "accel", 5.5, .9), ev(14, "pot", 13, .22, UP), ev(17, "right", 6.5, 1.6), ev(20, "left", 6.5, 1.4), ev(22.5, "pot", 13, .22, R), ev(26.4, "brake", 6, 3)] },
];
// Mekanik testi (adrese ?test eklenince): yalnızca denge. Yürüme, görev, durak ve inme yok; 30 saniyelik tek yol,
// düşünce bir dokunuşla baştan. ?test=1..4 yukarıdaki kalıplardan birini seçer; sayı yoksa bu 30 saniyelik kalıp oynanır.
const TEST = new URLSearchParams(location.search).get("test");
SEGS.push({ dur: 30, sway: .6, ev: [ev(1.5, "accel", 4.5, 1.4), ev(5.5, "left", 5, 1.6), ev(9, "right", 5, 1.6), ev(12.5, "brake", 4.5, .9), ev(14.2, "accel", 4.5, 1), ev(17.5, "pot", 11, .22, UP), ev(20, "right", 5.5, 1.5), ev(22.2, "left", 5.5, 1.5), ev(26.6, "brake", 5.5, 2.8)] });
const TEST_LINE = { name: "Mekanik testi", from: "", crowd: 6, seat: .85, seg: [{ to: "Durak", side: 1, tpl: TEST >= 1 && TEST <= 4 ? TEST - 1 : 4, task: null, view: "sehir", test: true }] };
// seg: duraktan durağa yol. to: varılan durak, side: kapının açılacağı yan, board: binecek yolcu sayısı.
// Metrobüs hattı, gerçek durak sırasıyla (Söğütlüçeşme yönü). İlk hat Okmeydanı Hastane → Altunizade dilimi
// (Mehmet Umut'un kararı, tasarim/README.md); köprü oyunda "Boğaz Köprüsü" adını taşır.
// view: camdan görünen manzara ("sehir" ya da Boğaz'ı geçen "kopru"). Köprü, Zincirlikuyu ile köprü durağı arasında geçilir:
// durak Anadolu yakasında, köprünün çıkışındadır (data/haritalar/istanbul-metrobus.json).
const LINES = [
  { name: "Metrobüs · Okmeydanı Hastane → Altunizade", from: "Okmeydanı Hastane", codes: ["34A", "34AS"], crowd: 5, seat: .8, seg: [
    { to: "Çağlayan", side: 1, tpl: 0, board: 3, task: null, view: "sehir" },
    { to: "Mecidiyeköy", side: 1, tpl: 1, board: 4, task: "kahve", view: "sehir" },
    { to: "Zincirlikuyu", side: 1, tpl: 2, board: 3, task: "yasli", view: "sehir" },
    { to: "Boğaz Köprüsü", side: 1, tpl: 2, board: 2, task: "kahve", view: "kopru" },
    { to: "Burhaniye", side: 1, tpl: 3, board: 2, task: "koltuk", view: "sehir" },
    { to: "Altunizade", side: 1, tpl: 3, task: null, mine: true, view: "sehir" },
  ] },
  { name: "Metrobüs · Altunizade → Söğütlüçeşme", from: "Altunizade", codes: ["34A", "34AS"], crowd: 7, seat: .85, seg: [
    { to: "Acıbadem", side: 1, tpl: 1, board: 3, task: "kahve", view: "sehir" },
    { to: "Uzunçayır", side: 1, tpl: 2, board: 3, task: "yasli", view: "sehir" },
    { to: "Fikirtepe", side: 1, tpl: 3, board: 3, task: "koltuk", view: "sehir" },
    { to: "Söğütlüçeşme", side: 1, tpl: 3, task: null, mine: true, view: "sehir" },
  ] },
  // Peronda binilen araca göre başlayan hatlar. Duraklar ve sıraları gerçek veriden (data/haritalar/istanbul-metrobus.csv);
  // sarsıntı şablonları ve görevler mevcut bölümlerden geçici olarak dağıtıldı.

// ---------- Aktarma: in, peronda bekle, sonraki araca bin ----------
// Panel açılmaz; kamera oyuncuyla perona çıkar. Araç kalkar, başka hatların araçları sırayla gelir.
// Oyuncu peronda serbest yürür, istediği araca dokunup biner; bindiği aracın hattı başlar.
const PLAT_X = BUS.halfW + .58, PLAT_WAIT_Z = 7.7, PLAT_SPEED = 3, PICK_TIME = 8;
const PLAT_MIN_X = BUS.halfW + .4, PLAT_MAX_X = 4.2, PLAT_Z = 13, WAITER_R = .5;
const svcOf = (pl) => pl.list[pl.svc % pl.list.length];
const svcName = (pl) => `${svcOf(pl).code} ${lineEnd(svcOf(pl).line)}`;
const awayFrom = (pt) => { for (const w of waiters) { const dx = pt[0] - w[0], dz = pt[1] - w[1], d = Math.hypot(dx, dz) || 1e-3; if (d < WAITER_R) { pt[0] += dx / d * (WAITER_R - d); pt[1] += dz / d * (WAITER_R - d); } } };
function startPlatform() {
  const d = DOORS.reduce((a, b) => (Math.abs(b - G.pos[1]) < Math.abs(a - G.pos[1]) ? b : a));
  G.state = "platform"; G.target = null; G.walking = false; G.p = [0, 0]; G.v = [0, 0]; G.F = [0, 0]; G.speed = G.speedTarget = 0;
  G.pl = { x: G.pos[0], z: G.pos[1], wp: 0, moving: false, yaw: 0, path: [[PLAT_X, d], [PLAT_X, PLAT_WAIT_Z]],
    bus: "open0", t: 0, open: true, name: curSeg().to, door: null, ghost: null, gz: 0, gv: 0,
    svc: -1, list: servicesAt(curSeg().to) }; // svc -1: indiğin araç; kalkınca listedeki ilk araç gelir
  setBusSign(`${G.code || curLine().codes[0]} ${curSeg().to}`);
  setLed("Peronda yürümek için yere dokun");
}
function leaveGhost() {
  // Kalkan araç: o anki hâlinin kopyası uzaklaşır; asıl araç yeni yolcularla arkadan gelir.
  const pl = G.pl, g = busG.clone(true), lights = [];
  g.traverse((o) => { if (o.isLight) lights.push(o); });
  for (const l of lights) l.removeFromParent();
  if (pl.ghost) scene.remove(pl.ghost);
  pl.ghost = g; pl.gz = 0; pl.gv = 0; scene.add(g);
  // Kalkan araç kendi tabelasıyla gider; sıradaki araç öbür tabelayı takar.
  busSignCur = 1 - busSignCur; for (const m of busSigns) m.material = busSignMats[busSignCur].mat;
  pl.svc++; setBusSign(svcName(pl));
}
function updatePlatform(dt) {
  const pl = G.pl;
  pl.t += dt;
  updateNpcs(dt);
  // Oyuncu sıradaki noktaya yürür
  const aim = pl.path[0];
  pl.moving = !!aim;
  if (aim) {
    const dx = aim[0] - pl.x, dz = aim[1] - pl.z, d = Math.hypot(dx, dz), stepLen = PLAT_SPEED * dt;
    pl.wantYaw = Math.atan2(-dx, -dz);
    if (d <= stepLen) { pl.x = aim[0]; pl.z = aim[1]; pl.path.shift(); }
    else { pl.x += dx / d * stepLen; pl.z += dz / d * stepLen; pl.wp += dt * 11; }
    if (pl.x > BUS.halfW + .3) { const pt = [pl.x, pl.z]; awayFrom(pt); pl.x = Math.min(PLAT_MAX_X, pt[0]); pl.z = pt[1]; } // bekleyenlerin içinden geçmez
  } else pl.wantYaw = 0;
  pl.yaw += Math.atan2(Math.sin(pl.wantYaw - pl.yaw), Math.cos(pl.wantYaw - pl.yaw)) * Math.min(1, dt * 9);
  if (pl.ghost) { pl.gv += 3.5 * dt; pl.gz -= pl.gv * dt; if (pl.gz < -170) { scene.remove(pl.ghost); pl.ghost = null; } }

  if (pl.bus === "open0" && pl.t > 1.5) { pl.bus = "closing"; pl.t = 0; pl.open = false; doorSound(); setLed("Kapılar kapanıyor"); }
  else if (pl.bus === "closing" && pl.t > .8) {
    // Araç kalkar. Gelen her araç kendi hattının yolcuları ve görevleriyle kurulur.
    leaveGhost();
    startLine(svcOf(pl).line, svcOf(pl).seg); G.state = "platform"; flash("", C.text);
    G.busZ = 60; pl.bus = "away"; pl.t = 0; pl.door = null;
    setLed(`${svcName(pl)} · geliyor`);
  } else if (pl.bus === "away" && pl.t > 1.5) { pl.bus = "arriving"; pl.t = 0; }
  else if (pl.bus === "arriving") {
    const k = Math.min(1, pl.t / 4.5);
    G.busZ = 55 * (1 - k) * (1 - k);
    if (k >= 1) {
      G.busZ = 0; pl.bus = "open"; pl.t = 0; pl.open = true; doorSound(); clearDoorways(1);
      setLed(`${svcName(pl)} · binmek için araca dokun`, true);
    }
  } else if (pl.bus === "open") {
    // Kapı seçilmediyse araç beklemez: kapanır, kalkar, sıradaki gelir.
    if (pl.door === null && pl.t > PICK_TIME) { pl.bus = "closing"; pl.t = 0; pl.open = false; doorSound(); setLed(`${svcName(pl)} kalkıyor`); }
    else if (pl.door !== null && !pl.path.length) boardBus();
  }
}
function pickDoor(z) {
  const pl = G.pl;
  if (!pl || pl.bus !== "open" || pl.x < BUS.halfW + .2) return false;
  pl.door = DOORS.reduce((a, b) => (Math.abs(b - z) < Math.abs(a - z) ? b : a));
  pl.path = [[PLAT_X, pl.door], [.85, pl.door]];
  setLed(`Sıradaki durak: ${curSeg().to}`); beep(700, .06);
  return true;
}
// Peronda serbest yürüme: dokunulan yere gider. Araçtan inerken ya da kapıdan girerken yön değişmez.
function platWalk(x, z) {
  const pl = G.pl;
  if (!pl || pl.x < BUS.halfW + .2) return;
  const pt = [Math.max(PLAT_MIN_X, Math.min(PLAT_MAX_X, x)), Math.max(-PLAT_Z, Math.min(PLAT_Z, z))];
  awayFrom(pt);
  if (pl.door !== null && pl.bus === "open") setLed(`${svcName(pl)} · binmek için araca dokun`, true);
  pl.door = null; pl.path = [pt];
}
function boardBus() {
  const pl = G.pl, line = curLine();
  // Kapının hemen içi doluysa bir adım daha içeri girer.
  for (const x of [.85, .65, .45, .25]) { G.pos = [x, pl.door]; pushStatic(G.pos, BODY_R); if (!hitsPerson(G.pos, 2 * BODY_R)) break; }
  if (G.snap) G.snap.pos = [...G.pos]; // düşersen bindiğin kapının önünden devam edersin
  if (pl.ghost) scene.remove(pl.ghost);
  G.code = svcOf(pl).code;
  G.pl = null; G.busZ = 0; G.t = 0; G.state = "ride";

// Mekanik testi: 30 saniye düşmeden biterse yol tamamlanır. Deneme sayısı ve en uzun dayanma telefonda saklanır,
// oynatan kişi oyuncunun kendiliğinden kaç kez yeniden başladığını buradan görür.
const TEST_KEY = "denge-test-kayit";
let tlog = {}; try { tlog = JSON.parse(localStorage.getItem(TEST_KEY)) || {}; } catch (e) {}
function recordTest(won) {

  tlog.tries = (tlog.tries || 0) + 1; if (won) tlog.wins = (tlog.wins || 0) + 1;
  tlog.bestT = Math.max(tlog.bestT || 0, G.testT);
  const sc = Math.floor(G.score); G.newBest = sc > (tlog.best || 0); if (G.newBest) tlog.best = sc;
  try { localStorage.setItem(TEST_KEY, JSON.stringify(tlog)); } catch (e) {}
}
function testDone() {
  G.state = "arrived"; G.testText = "30 saniye tutunmadan durdun."; recordTest(true);
  setLed("İyi yolculuklar"); beep(660, .1); setTimeout(() => beep(990, .16), 120);
  setTimeout(() => showTest(), 600);

function missed() {

function fall() {
  const m = Math.hypot(G.p[0], G.p[1]) || 1;
  G.fallDir = [G.p[0] / m, G.p[1] / m];
  // Önü kapalıysa koridor boyunca düşer; açı da boş yere göre sınırlanır, kimsenin ya da hiçbir şeyin içine girmez.
  const [x, z] = G.pos, fd = G.fallDir, sz = Math.sign(fd[1]) || 1;
  const opts = [fd, [0, sz], [0, -sz]].map((u) => ({ u, f: freeDist(x, z, u[0], u[1]) }));
  // Önünde biri varsa ona doğru düşer (domino); yoksa boş yere.
  const best = opts[0].f >= 1.4 || nextInLine([x, z], fd) ? opts[0] : opts.reduce((a, b) => (b.f > a.f + .2 ? b : a));
  G.fallDir = best.u;
  G.fallMax = Math.min(1.35, Math.asin(Math.min(1, Math.max(.25, best.f - .05) / 1.6)));
  G.state = "fallen"; G.fallT = 0; G.falls++; G.lineFalls++; G.stumble = 0; G.target = null;
  G.assist = Math.min(1, G.assist + .4); // sonraki deneme fark ettirmeden kolaylaşır
  thud(); buzz([80, 50, 150]);
  // Domino: düştüğün yönde biri varsa onu da devirirsin, o da önündekini.
  // Her beden önündekine yaslanabildiği kadar eğilir; önündeki devrildikçe o da devrilir (bkz. leanOnto).
  G.knocked = 0; G.chain = []; G.fallAng = 0;
  let from = [x, z], dir = G.fallDir, delay = .3;
  for (let k = 0; k < 4; k++) {
    const hit = nextInLine(from, dir);
    if (!hit) break;
    hit.fallT = -delay; hit.fallDir = [...dir]; hit.fallAng = 0;
    hit.gap = (hit.x - from[0]) * dir[0] + (hit.z - from[1]) * dir[1];
    G.chain.push(hit); G.knocked++; from = [hit.x, hit.z]; delay += .28;
  }
  G.chain.forEach((n, i) => {
    const last = i === G.chain.length - 1, f = freeDist(n.x, n.z, dir[0], dir[1], n, !last);
    n.fallMax = Math.min(1.25, Math.asin(Math.min(1, Math.max(.3, f - .05) / 1.6)));
  });
  if (G.chain.length) G.fallMax = Math.min(1.35, Math.asin(Math.min(1, Math.max(.25, freeDist(x, z, dir[0], dir[1], null, true) - .05) / 1.6)));
  const text = G.knocked ? KNOCK_LINES[Math.min(G.knocked, KNOCK_LINES.length) - 1] : FALL_LINES[G.falls % FALL_LINES.length];
  if (curSeg().test) { G.testText = text; recordTest(false); }
  G.endText = text; G.endT = FALL_HOLD + G.knocked * .35;
  startReactions();
}
// Düşünce ekran hemen kapanmaz: sahne bir süre izlenir. Ayaktakiler döner, güler, bir ikisi telefonla çeker.
// Beklemek istemeyen ekrana dokunur, panel hemen gelir.
const FALL_HOLD = 3.6;
function fallEnd() {
  if (G.state !== "fallen" || G.endT === null) return;
  G.endT = null;
  if (curSeg().test) showTest(); else showEnd("Düştün", G.endText);
}
function startReactions() {
  hidePhones();
  const [x, z] = G.pos;
  const others = G.npcs.filter((n) => n.fallT === undefined && (n.state === "stand" || n.state === "walk"));
  for (const n of others) {
    const d = Math.hypot(n.x - x, n.z - z);
    n.react = { t: -(.45 + d * .1 + Math.random() * .35), film: false, d, ph: Math.random() * 6 };
  }
  // Çekenler: kameranın gördüğü tarafta, bir adımdan uzak, en yakın iki kişi
  const film = others.filter((n) => !n.elder && n.react.d > .9 && n.z < z + .3).sort((a, b) => a.react.d - b.react.d).slice(0, 2);
  film.forEach((n, i) => { n.react.film = true; n.react.t = -(.9 + i * .5); });
  G.chain.forEach((n, i) => say(n, i % 2 ? "Ayy!" : "Hop hop!", "mad", 2.2, .3 + i * .28));
  film.forEach((n, i) => say(n, "\u25CF REC", "rec", 9, .9 + i * .5 + .3));
  others.filter((n) => !n.react.film).slice(0, 4).forEach((n) => say(n, "\u{1F602}", "fun", 9, -n.react.t + .15));
  // Kahkaha: iki ayrı ses, kısa inen heceler
  for (let v = 0; v < Math.min(2, others.length); v++)
    for (let r = 0; r < 2; r++)
      for (let j = 0; j < 5; j++) tone((v ? 560 : 400) - j * 28 + r * 20, .09, "triangle", .05, .9 + v * .22 + r * 1.1 + j * .13);
  film.forEach((n, i) => tone(2600, .03, "square", .03, 1.25 + i * .5));
}
// Arası gap olan, önündeki phi açısıyla eğikken bir bedenin ona değmeden eğilebileceği en büyük açı
const FALL_H = 1.6, FALL_T = 2 * TORSO_R;
const leanOnto = (gap, phi) => phi - Math.asin(Math.max(-1, Math.min(1, (FALL_T - gap * Math.cos(phi)) / FALL_H)));
// Düşme yönünde, yaklaşık bir boy mesafesindeki ilk yolcu
function nextInLine([x, z], [dx, dz]) {
  let best = null, bd = 9;
  for (const n of G.npcs) {
    if (n.fallT !== undefined || n.state === "exit" || n.state === "board") continue;
    const ox = n.x - x, oz = n.z - z, along = ox * dx + oz * dz, side = Math.abs(ox * dz - oz * dx);
    if (along > .2 && along < 1.25 && side < .5 && along < bd) { best = n; bd = along; }
  }
  return best;
}

let ac = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume().catch(() => {}); }
function tone(freq, dur, type, vol, at = 0) {
  if (!T.sound || !ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + at;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}

    const sync = () => { i.value = T[k]; o.textContent = T[k]; };
    i.oninput = () => { T[k] = +i.value; o.textContent = T[k]; saveT(); };
    return sync;
  };
  const syncs = ["tilt", "force", "gain"].map(bind);
  const sync = () => {
    $("snd").textContent = T.sound ? "Sesi kapat" : "Sesi aç";
    $("inv").textContent = T.invert ? "Eğim yönü: ters" : "Eğim yönü: normal";
    $("help").textContent = T.help ? "Gizli yardım: açık" : "Gizli yardım: kapalı";
  };
  $("snd").onclick = () => { T.sound = !T.sound; saveT(); sync(); };
  $("inv").onclick = () => { T.invert = !T.invert; saveT(); sync(); };
  $("help").onclick = () => { T.help = !T.help; saveT(); sync(); };
  $("reset").onclick = () => { Object.assign(T, DEFAULTS); saveT(); syncs.forEach((f) => f()); sync(); };
  syncs.forEach((f) => f()); sync();
  $("close").onclick = () => {
    G.paused = wasPaused;
    if (wasHidden) hide(); else rebindPanel();
  };
}
// Ayarlardan dönünce önceki paneli yeniden göster.
function rebindPanel() {
  if (G.userPause) { overlay.hidden = true; showPause(); }

  else if (G.state === "missed") showEnd("Durağı kaçırdın", MISS_LINES[G.misses % MISS_LINES.length]);
}

$("pause").onclick = showPause;

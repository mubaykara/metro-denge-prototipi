const TILT_RANGE=22,TILT_DEAD=2,NEUTRAL_DRIFT=5,LEG_TILT_ON=10,LEG_TILT_OFF=6;
const gyro={on:false,gamma:0,beta:0,beta0:null,val:0,legs:false,invert:false,status:"Bu sayfa eğme verisi almıyor"};
function onOrient(e){if(e.gamma==null||e.beta==null)return;gyro.on=true;gyro.gamma=e.gamma;gyro.beta=e.beta;gyro.status="Eğme açık";if(gyro.beta0==null)gyro.beta0=e.beta}
let tiltAsked=false;
function enableTilt(){if(tiltAsked)return;tiltAsked=true;const D=window.DeviceOrientationEvent;if(!D){gyro.status="Bu cihaz eğmeyi desteklemiyor";return}if(!window.isSecureContext){gyro.status="Eğme için HTTPS gerekiyor";return}const listen=()=>addEventListener("deviceorientation",onOrient);if(typeof D.requestPermission==="function")D.requestPermission().then(r=>{if(r==="granted")listen();else gyro.status="Eğme izni verilmedi"}).catch(()=>{gyro.status="Bu sayfa eğme izni isteyemiyor"});else listen()}
function updateTilt(dt){if(!gyro.on)return;const v=Math.sign(gyro.gamma)*Math.max(0,Math.abs(gyro.gamma)-TILT_DEAD)/TILT_RANGE*(gyro.invert?-1:1);gyro.val+=(v-gyro.val)*Math.min(1,dt*14);gyro.beta0+=(gyro.beta-gyro.beta0)*Math.min(1,dt/NEUTRAL_DRIFT);const q=Math.abs(gyro.beta-gyro.beta0);gyro.legs=gyro.legs?q>LEG_TILT_OFF:q>LEG_TILT_ON}
function readInput(){let x=gyro.on?gyro.val:0,legs=gyro.on&&gyro.legs?1:0;if(touch){const dx=touch.x-touch.ox,a=Math.abs(dx);if(a<DEAD)legs=1;else x=Math.sign(dx)*(a-DEAD)/FINGER_RANGE}if(keys.ArrowLeft)x=-1;if(keys.ArrowRight)x=1;if(keys.Space)legs=1;G.dir=[Math.max(-1,Math.min(1,x)),legs]}
let started=false;
function startGame(){enableTilt();started=true;document.getElementById("start").hidden=true;restart();setTimeout(()=>{const st=document.getElementById("stat");st.textContent=gyro.on?"Eğme açık":gyro.status+". Parmakla oynayabilirsin.";st.hidden=false;setTimeout(()=>st.hidden=true,6000)},1200)}
document.getElementById("go").onclick=startGame;

let last=0,acc=0,camX=0,camZ=walk.z+ang.back,tilt=0,yaw=0;resize();
setTimeout(()=>document.getElementById("how").classList.add("off"),8000);
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(started){updateTilt(dt);readInput();acc+=dt;while(acc>=FIXED){step(FIXED);acc-=FIXED}}
 updateLegs(dt);updateWalk(dt);if(hintT>0){hintT-=dt;if(hintT<=0)hint.textContent=""}hintFor();draw(now,dt);window.__raf=requestAnimationFrame(frame)}
function draw(now,dt=.016){root.position.x=walk.x;root.position.z=walk.z;if(G.state==="fallen")poseFallen();else poseStand(now);npcUpdate(now,dt);scrollWorld(dt);updateSign();
 camX+=(walk.x*ang.xk-camX)*Math.min(1,dt*3.5);camZ+=(walk.z+ang.back-camZ)*Math.min(1,dt*3.5);const fx=-G.need[0],pitch=G.throwY*.18;
 tilt+=(-swing*.035-tilt)*Math.min(1,dt*4);bus.rotation.z=tilt;const sh=Math.abs(swing),shk=sh*.018;
 cam.position.set(camX+swing*.32+Math.sin(now/31)*shk,ang.y+Math.sin(now/23)*shk,camZ+pitch);cam.lookAt(camX,1,camZ-ang.back-ang.look);cam.rotation.z+=-swing*.04;R.render(S,cam)}

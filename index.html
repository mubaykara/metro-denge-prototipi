<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Metro Denge Prototipi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
/* Düzen: tek ekran vagon. Üstte yolu gösteren ön cam, altta karakter. Ekranda tuş yok. Metro tabelası dili. */
:root {
  color-scheme: dark;
  --tunnel: #10151b;
  --wall: #232b34;
  --floor: #2e3843;
  --steel: #6d7a88;
  --text: #eef2f5;
  --muted: #a6b1bc;
  --sign: #ffc82e;
  --safe: #4cc9b0;
  --danger: #ff6b57;
  --window: #182029;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0; background: var(--tunnel); color: var(--text); font-family: var(--body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#gear {
  position: absolute; z-index: 2; right: 10px; top: 62px;
  font: 600 13px var(--body); color: var(--muted); background: var(--wall);
  border: 1px solid var(--steel); border-radius: 6px; padding: 6px 9px;
}
#overlay {
  position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
  background: rgba(16, 21, 27, .86); overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
#panel { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; margin: auto; }
#panel h1 {
  margin: 0; font: 700 44px/1 var(--display); letter-spacing: .01em; text-transform: uppercase;
  color: var(--sign); text-wrap: balance;
}
#panel p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--text); }
#panel ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; line-height: 1.4; }
#panel .small { font-size: 14px; color: var(--muted); }
#panel button {
  font: 700 22px var(--display); letter-spacing: .03em; text-transform: uppercase;
  padding: 14px; border-radius: 6px; border: 1px solid var(--steel);
  background: var(--wall); color: var(--text); touch-action: manipulation;
}
#panel button.primary { background: var(--sign); color: var(--tunnel); border-color: var(--sign); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--safe); outline-offset: 2px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; font-variant-numeric: tabular-nums; }
.stats b { display: block; font: 700 30px var(--display); color: var(--sign); }
.stats span { font-size: 13px; color: var(--muted); }
.row { display: grid; gap: 4px; font-size: 15px; }
.row label { display: flex; justify-content: space-between; gap: 12px; }
.row output { font-variant-numeric: tabular-nums; color: var(--sign); }
input[type=range] { width: 100%; accent-color: var(--sign); touch-action: pan-x; }
pre {
  margin: 0; padding: 10px; background: var(--tunnel); border: 1px solid var(--wall); border-radius: 6px;
  font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);
  -webkit-user-select: text; user-select: text;
}
</style>

<div id="app">
  <canvas id="game" role="img" aria-label="Metro vagonunda ayakta duran karakter ve yolu gösteren ön cam"></canvas>
  <button id="gear" type="button">Ayarlar</button>
  <div id="overlay"><div id="panel"></div></div>
</div>

<script>
(() => {
  "use strict";
  document.documentElement.lang = "tr"; // büyük harfte "i" doğru yazılsın
  const $ = (id) => document.getElementById(id);
  const canvas = $("game"), ctx = canvas.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const C = Object.fromEntries(["tunnel","wall","floor","steel","text","muted","sign","safe","danger","window"]
    .map((k) => [k, css.getPropertyValue("--" + k).trim()]));
  const DISPLAY = '"Barlow Condensed", "Arial Narrow", sans-serif';
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Ayarlanabilir değerler ----------
  const DEFAULTS = { look: 1, tol: .4, hit: 1, tilt: 22, invert: false, sound: true };
  const T = { ...DEFAULTS };
  try { Object.assign(T, JSON.parse(localStorage.getItem("denge-ayar-6") || "{}")); } catch (e) {}
  const saveT = () => { try { localStorage.setItem("denge-ayar-6", JSON.stringify(T)); } catch (e) {} };
  const FIXED = 1 / 120;
  const LEG_TIME = .2;      // bacak açma süresi (sn)
  const ENV_TIME = .3;      // olayın başlama ve bitme yumuşaklığı (sn)
  // Oyun zor görünür ama bağışlayıcıdır: küçük gecikmeler cezasızdır, denge yavaş bozulur.
  const GRACE = .35;        // ceza başlamadan önceki tolerans (sn)
  const DRIFT = .65;        // yanlış duruşta dengenin bozulma hızı
  const CALM = .2;          // doğru duruşta toparlanma hızı (saniyede)
  const STUMBLE_TIME = 1.4; // tökezleyince kurtarma süresi (sn)
  const OVER = 1.5;         // bundan fazla yatınca karakter kapaklanmaya başlar
  const MAX_LEAN = 2.4;     // ekranda sert sınır yok, karakter burada zaten devrilmiştir
  const FINGER_RANGE = 70;  // 1 birim yatma için parmak yolu (px)
  const DEAD = 14;          // bundan az kayan parmak "bacak aç" sayılır (px)
  const TILT_DEAD = 2;      // eğmede ölü bölge (derece)
  const NEUTRAL_DRIFT = 5;  // öne-arka nötr açının tutuşa uyum süresi (sn)
  const LEG_TILT_ON = 10, LEG_TILT_OFF = 6; // öne-arka eğimle bacak açma eşikleri (derece)

  // ---------- Hat verisi ----------
  // push[0]: yan savrulma, doğru duruş bunun tersine yatmaktır. push[1]: öne (-) veya arkaya (+) savrulma, doğru duruş bacak açmaktır.
  // s: virajın şiddeti, ne kadar yatılacağını belirler. Araç sağa dönerken karakter kendi soluna, sola dönerken kendi sağına yatar.
  const K = {
    accel: { label: "KALKIŞ",     tip: "Parmağını kaydırmadan bas: bacaklarını aç", push: [0, 1],  w: 1 },
    brake: { label: "FREN",       tip: "Parmağını kaydırmadan bas: bacaklarını aç", push: [0, -1], w: 1 },
    left:  { label: "SOLA VİRAJ", tip: "Sağına yat. Keskin virajda daha çok yat",   push: [-1, 0], w: 1 },
    right: { label: "SAĞA VİRAJ", tip: "Soluna yat. Keskin virajda daha çok yat",   push: [1, 0],  w: 1 },
    pot:   { label: "ÇUKUR",      tip: "Parmağını kaydırmadan bas: bacaklarını aç", push: [0, -1], w: 1.5 },
    npc:   { label: "ÇANTALI YOLCU", tip: "Geldiği tarafa yat",                     w: 1.5 },
  };
  const ev = (t, k, d, s = 1) => ({ t, k, d, s, push: K[k].push, w: K[k].w, label: K[k].label, tip: K[k].tip });
  const LINE = [
    { dur: 18, bumps: 0, crowd: 3, ev: [
      ev(2.5,"accel",2), ev(8.5,"brake",2), ev(13.5,"brake",2.4) ] },
    { dur: 24, bumps: 0, crowd: 4, ev: [
      ev(2.5,"accel",1.8), ev(7,"left",3,.55), ev(13,"right",3,.9), ev(19,"brake",2.4) ] },
    { dur: 25, bumps: 0, crowd: 6, ev: [
      ev(2.5,"accel",1.6), ev(6.5,"pot",.8), ev(10,"right",2.8,.6), ev(15,"pot",.8), ev(17,"left",2.4,1.1), ev(21,"brake",2.2) ] },
    { dur: 26, bumps: 2, crowd: 8, ev: [
      ev(2.5,"accel",1.5), ev(9,"brake",1.5), ev(12,"accel",1.4), ev(16,"left",2.4,1), ev(22,"brake",2.2) ] },
    { dur: 28, bumps: 3, crowd: 12, ev: [
      ev(2.5,"accel",1.4), ev(7,"right",2,.6), ev(10,"left",2,1.1), ev(14.5,"pot",.8), ev(19,"right",2.2,1.2), ev(24,"brake",2) ] },
    { dur: 30, bumps: 4, crowd: 17, ev: [
      ev(2.5,"accel",1.3), ev(6,"pot",.8), ev(8,"left",1.8,.6), ev(10.6,"right",1.8,1.2), ev(15.5,"brake",1.2), ev(17.5,"accel",1.2), ev(21,"pot",.8), ev(23,"left",2,1.1), ev(26.5,"brake",1.8) ] },
  ];
  const FALL_LINES = [
    "Yanındaki amcanın kucağına oturdun.",
    "Çantan ayakta kaldı, sen kalamadın.",
    "Bütün vagon sana baktı. Kimse yardım etmedi.",
    "Bir teyze sana yer vermeyi düşündü, sonra vazgeçti.",
    "Bu video akşama kadar bütün gruplarda olur.",
  ];

  // ---------- Oyun durumu ----------
  const G = {
    state: "menu", paused: false, stopIndex: 0, attempt: 0, t: 0, stopT: 0, fallT: 0,
    dir: [0, 0],        // girdi: [yatma miktarı, bacak açma 0/1]
    L: [0, 0],          // karakterin duruşu: [yatma, bacak açıklığı]
    need: [0, 0],       // o an doğru olan duruş
    show: [0, 0],       // ekranda görünen eğim: [yan, öne-arkaya]
    throwY: 0, badT: 0, tip: 0,
    peak: 0, err: 0, stumble: 0, stumbleDir: [1, 0], stumbleOver: false, stumbled: false,
    legIdle: 0, bumpCool: 0, bumpCount: 0,
    events: [], crowd: [], fallDir: 1, fallLine: "", seen: new Set(), relHints: 0, relShow: 0,
    segScore: 0, score: 0, falls: 0, rescues: 0, starsBySeg: [], lastStars: 0,
    speed: 0, speedTarget: 0, travel: 0, flash: null, shake: 0, puff: 0,
  };

  function rng(seed) { // mulberry32
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  function startSegment(i) {
    const seg = LINE[i];
    const r = rng(1000 * (i + 1) + G.attempt);
    Object.assign(G, { stopIndex: i, t: 0, state: "ride", stumble: 0, stumbled: false, stumbleOver: false, tip: 0, peak: 0, err: 0, segScore: 0,
      L: [0, 0], need: [0, 0], show: [0, 0], speed: 0, speedTarget: 0, throwY: 0, badT: 0, legIdle: 0, bumpCool: 0, fallT: 0, puff: 0 });
    G.events = seg.ev.map((e) => ({ ...e, good: 0, warned: false, warnedErr: false, done: false }));
    // Yolcular yol olaylarıyla çakışmayacak aralara yerleşir
    const clear = (t) => G.events.every((e) => t + .8 < e.t - 1.2 || t > e.t + e.d + 1.2);
    for (let n = 0; n < seg.bumps; n++) {
      const span = (seg.dur - 8) / seg.bumps;
      let t = 3.5 + span * n + r() * span * .6, tries = 0;
      while (!clear(t) && tries++ < 60) t += .25;
      if (!clear(t) || t > seg.dur - 3.5) continue;
      const dir = r() < .5 ? -1 : 1;
      G.events.push({ t, k: "npc", d: .8, s: .7, push: [-dir, 0], w: K.npc.w, label: K.npc.label, tip: K.npc.tip, dir, good: 0, warned: false, warnedErr: false, done: false });
    }
    G.events.sort((a, b) => a.t - b.t);
    const rc = rng(77 + i);
    G.crowd = Array.from({ length: seg.crowd }, (_, n) => ({
      // İlk iki yolcu karakterin hemen yanında durur: domino onlardan başlar.
      side: n % 2 ? 1 : -1, x: n < 2 ? 0 : rc(), z: n < 2 ? .88 : .3 + rc() * .5, tone: rc(), phase: rc() * 6,
      react: null, fallAt: null, fallDir: 1, thud: false, flashT: rc(), shove: 0,
    })).sort((a, b) => a.z - b.z);
  }

  const lookFor = () => (3 - G.stopIndex * .12) * T.look;
  const leadFor = () => lookFor() * .6;
  const needOf = (e) => [-e.push[0] * e.s, e.push[1] ? 1 : 0];
  const legMax = () => 1 - (LINE[G.stopIndex].crowd / 17) * .3; // kalabalıkta bacak açacak yer daralır

  // Oyun adımı. Konsoldan test edilebilsin diye çizimden ayrı tutuldu.
  function step(dt) {
    if (G.state !== "ride" && G.state !== "stop") { updateBody(dt); return; }
    const riding = G.state === "ride";
    const seg = LINE[G.stopIndex];
    const h = G.stumble > 0 ? dt * .35 : dt; // tökezleyince zaman yavaşlar

    // Yatma parmağı neredeyse gecikmesiz izler, bacak açma kısa sürede tamamlanır.
    G.L[0] += (G.dir[0] - G.L[0]) * Math.min(1, dt * 18);
    const legT = G.dir[1] * legMax(), legD = legT - G.L[1], legR = dt / LEG_TIME;
    G.L[1] += Math.abs(legD) <= legR ? legD : Math.sign(legD) * legR;

    let nx = 0, ny = 0, w = 1, active = null, py = 0;
    if (riding) {
      G.t += h;
      for (const e of G.events) {
        if (!e.warned && G.t >= e.t - leadFor()) { e.warned = true; warnSound(e); }
        if (e.k === "accel" && G.t >= e.t) G.speedTarget = 1;
        if (e.k === "brake" && G.t >= e.t) G.speedTarget = e.t > seg.dur - 6 ? 0 : (G.t <= e.t + e.d ? .35 : 1);
        if (G.t >= e.t && G.t <= e.t + e.d) {
          const env = Math.min(1, (G.t - e.t) / ENV_TIME, (e.t + e.d - G.t) / ENV_TIME);
          const n = needOf(e); nx += n[0] * env; ny += n[1] * env; py += e.push[1] * env; w = e.w; active = e;
          if (e.k === "brake" && !e.thud) { e.thud = true; hiss(); }
          if (e.k === "pot" && !e.thud) { e.thud = true; thud(); buzz(50); G.shake = .5; }
          if (e.k === "npc" && !e.thud) { e.thud = true; thud(); buzz(50); G.shake = .4; }
        }
        if (!e.done && G.t > e.t + e.d) { // olay bitti: nasıl geçtiğini söyle
          e.done = true; G.seen.add(e.k);
          if (G.relHints < 2 && G.L[1] + Math.abs(G.L[0]) > .4) { G.relHints++; G.relShow = 1.2; }
          if (e.good / e.d > .55) { G.segScore += 100; flash("DENGEDE +100", C.safe); beep(760, .08); buzz(15); }
          else if (G.stumble <= 0) { G.segScore += 25; flash("KIL PAYI +25", C.sign); }
        }
      }
    }
    G.need = [nx, ny]; G.throwY = py;

    // Doğru yöne yeterince yatan doğru sayılır, tam açıyı bulmak gerekmez.
    const lean = G.L[0], absL = Math.abs(lean);
    let ex;
    if (Math.abs(nx) > .05) {
      const sameWay = Math.sign(lean) === Math.sign(nx) || !lean;
      ex = sameWay && absL >= Math.abs(nx) * .3 && absL <= Math.abs(nx) + .7 ? 0 : Math.abs(lean - nx);
    } else ex = Math.max(0, absL - .25); // sakin anda hafif eğim serbest
    const es = ny > .05 ? (G.dir[1] ? 0 : ny) : G.L[1] * .5;
    const err = Math.hypot(ex, es);
    G.err = err;
    const bad = err > T.tol;
    G.badT = bad ? G.badT + h : 0;
    const over = absL > OVER;

    if (riding) {
      if (active && !bad) active.good += h;
      if (active && G.badT > GRACE && !active.warnedErr) { active.warnedErr = true; flash("SAVRULUYORSUN!", C.danger); buzz(60); }
      // İlk üç durak bağışlayıcıdır, sonra hatalar biraz daha ağır basar ve toparlanma yavaşlar.
      const later = Math.max(0, G.stopIndex - 2);
      if (G.badT > GRACE) G.tip += (err - T.tol + .15) * DRIFT * T.hit * w * (1 + later * .4) * h;
      else if (!bad && !over) G.tip = Math.max(0, G.tip - CALM * (1 - later * .15) * h);
      // Fazla yatmak: ne kadar çok yatarsan o kadar hızlı kapaklanırsın.
      if (over) G.tip += (absL - OVER + .4) * 1.1 * h;
      G.peak = Math.max(G.peak, G.tip);

      // Kalabalıkta gereksiz yere bacak açık durmak yanındakine çarpar.
      G.bumpCool = Math.max(0, G.bumpCool - h);
      G.legIdle = G.L[1] > .4 && ny < .05 ? G.legIdle + h : 0;
      if (seg.crowd >= 8 && G.legIdle > .7 && G.bumpCool <= 0) {
        G.bumpCool = 1.6; G.bumpCount++; G.tip += .12; G.segScore = Math.max(0, G.segScore - 25);
        flash("YANINDAKİNE ÇARPTIN -25", C.danger); thud(); buzz(40);
        const near = [...G.crowd].sort((a, b) => dist(a) - dist(b)).slice(0, 2);
        near.forEach((c) => { c.shove = 1; });
      }

      if (G.stumble > 0) {
        if (G.stumbleOver && absL < 1.2) rescue();
        else { G.stumble -= dt; if (G.stumble <= 0) return fall(); }
      } else if (G.tip >= 1) {
        G.stumbleOver = over;
        G.stumbleDir = [Math.sign(lean - nx) || (Math.sin(G.t * 5) > 0 ? 1 : -1), 0];
        G.stumble = STUMBLE_TIME; G.stumbled = true; beep(180, .2); buzz(120);
        G.crowd.forEach((c, i) => { if (i % 3 === 0) c.react = "film"; }); // felaket kokusunu alan telefonunu çıkarır
      }
      if (G.t >= seg.dur) arrive();
    } else {
      G.tip = Math.max(0, G.tip - CALM * 3 * dt);
      G.stopT -= dt;
      if (G.stopT <= 0) {
        if (G.stopIndex + 1 < LINE.length) startSegment(G.stopIndex + 1);
        else finish();
      }
    }
    G.speed += (G.speedTarget - G.speed) * Math.min(1, dt * 1.6);
    G.travel += G.speed * dt;
    updateBody(dt);
  }

  // Görünen duruş: karakterin eğimi + araç savurması. Yatma parmağı anında izler, savrulma yumuşak gelir.
  function updateBody(dt) {
    const sd = G.stumble > 0 ? 1 - G.stumble / STUMBLE_TIME : 0;
    const nx = G.need[0];
    const sideOk = nx ? Math.max(0, Math.min(1, G.L[0] / nx)) : 0;
    const tx = G.L[0] - nx * .9 * (1 - .8 * sideOk) + G.stumbleDir[0] * sd * 1.1;
    const ty = G.throwY * (1 - .8 * Math.min(1, G.L[1]));
    G.show[0] += (tx - G.show[0]) * Math.min(1, dt * 22);
    G.show[1] += (ty - G.show[1]) * Math.min(1, dt * 7);
  }

  function arrive() {
    const stars = 1 + (G.stumbled ? 0 : 1) + (G.peak < .5 ? 1 : 0);
    G.starsBySeg[G.stopIndex] = Math.max(G.starsBySeg[G.stopIndex] || 0, stars);
    G.lastStars = stars;
    G.score += Math.round(G.segScore) + 500;
    G.segScore = 0;
    G.state = "stop"; G.stopT = 3; G.speedTarget = 0; G.stumble = 0;
    G.crowd.forEach((c) => { c.react = null; });
    dingDong();
  }

  function rescue() {
    G.stumble = 0; G.stumbleOver = false; G.tip = .45; G.badT = 0; G.rescues++; G.segScore += 250;
    G.crowd.forEach((c) => { c.react = null; });
    flash("KURTARDIN! +250", C.safe); beep(880, .12); buzz(30);
  }

  const dist = (c) => W * (.22 + c.z * .1) + c.x * W * .2;

  function fall() {
    const dir = G.stumbleDir[0] >= 0 ? 1 : -1;
    G.fallDir = dir;
    G.state = "fallen"; G.fallT = 0; G.falls++; G.attempt++; G.stumble = 0; G.puff = 0;
    G.need = [0, 0]; G.throwY = 0; // araç sakinleşir, sahne düşene kalır
    G.fallLine = FALL_LINES[G.falls % FALL_LINES.length];
    thud(); buzz([80, 50, 150]);
    // Domino: düşülen taraftakiler sırayla devrilir, diğerleri güler veya videoya çeker.
    const hit = G.crowd.filter((c) => c.side === dir).sort((a, b) => dist(a) - dist(b)).slice(0, 5);
    hit.forEach((c, i) => { c.fallAt = .45 + i * .32; c.fallDir = dir; c.thud = false; c.react = null; });
    G.crowd.forEach((c, i) => { if (c.fallAt === null) c.react = i % 2 ? "laugh" : "film"; });
    setTimeout(laugh, 700);
    setTimeout(showFallen, 1400 + hit.length * 320 + 900); // domino bitmeden ekran kapanmaz
  }
  const flash = (text, color) => { G.flash = { text, color, life: .9 }; };
  function finish() { G.state = "done"; showDone(); }

  // Düşme sahnesi: devrilen yolcuların sesi, fotoğraf flaşları.
  function updateComedy(dt) {
    let filming = false;
    for (const c of G.crowd) {
      c.shove = Math.max(0, c.shove - dt * 1.8);
      if (c.fallAt !== null && !c.thud && G.state === "fallen" && G.fallT >= c.fallAt) { c.thud = true; thud(); }
      if (c.react === "film") { filming = true; c.flashT -= dt; if (c.flashT <= 0) c.flashT = .5 + c.phase * .2; }
    }
    if (filming && G.state === "fallen" && Math.random() < dt * 1.4) shutter();
  }

  // ---------- Ses: uyarılar yazı yerine sesle gelir ----------
  let ac = null, noiseBuf = null, engine = null;
  function initAudio() {
    if (!ac) { try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sawtooth"; o.frequency.value = 45; g.gain.value = 0; o.connect(g); g.connect(ac.destination); o.start();
      engine = { o, g };
    } catch (e) {} }
    if (ac && ac.state === "suspended") ac.resume().catch(() => {});
  }
  function tone(freq, dur, type, vol, delay = 0, to = 0) {
    if (!T.sound || !ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + delay;
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur);
    } catch (e) {}
  }
  function noise(dur, vol, cutoff, delay = 0) {
    if (!T.sound || !ac || !noiseBuf) return;
    try {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t0 = ac.currentTime + delay;
      s.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = cutoff;
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
      s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t0); s.stop(t0 + dur);
    } catch (e) {}
  }
  const beep = (f, d) => tone(f, d, "square", .05);
  const thud = () => tone(70, .22, "sine", .35);
  const hiss = () => noise(.7, .16, 3200);
  const shutter = () => { noise(.04, .22, 5000); noise(.05, .18, 3000, .07); };
  const horn = () => { tone(330, .28, "sawtooth", .07); tone(415, .28, "sawtooth", .06); };
  const blinker = () => { for (let i = 0; i < 3; i++) tone(1400, .03, "square", .05, i * .28); };
  const dingDong = () => { tone(784, .35, "sine", .14); tone(622, .5, "sine", .14, .32); };
  const laugh = () => { for (let i = 0; i < 6; i++) tone(520 - i * 28, .1, "triangle", .1, i * .15, 340 - i * 20); };
  function warnSound(e) {
    if (e.k === "brake") horn();
    else if (e.k === "accel") tone(90, .8, "sawtooth", .06, 0, 220);
    else if (e.k === "left" || e.k === "right") blinker();
    else if (e.k === "pot") noise(.3, .22, 180);
    else if (e.k === "npc") { tone(440, .1, "triangle", .1); tone(350, .14, "triangle", .1, .12); }
  }
  const buzz = (p) => {
    try { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(p); } catch (e) {}
  };

  // ---------- Telefonu eğme (jiroskop) ----------
  // Sağa-sola eğmek karakteri yatırır, öne-arkaya eğmek bacak açar. Öne-arka nötr açı tutuşa göre kendini ayarlar.
  // Telefonlar eğme verisini yalnızca HTTPS sayfalara verir, iOS ayrıca izin ister.
  const tilt = { on: false, gamma: 0, beta: 0, beta0: null, val: 0, legs: false, status: "Henüz denenmedi" };
  function onOrient(e) {
    if (e.gamma == null || e.beta == null) return;
    tilt.on = true; tilt.gamma = e.gamma; tilt.beta = e.beta; tilt.status = "Çalışıyor";
    if (tilt.beta0 == null) tilt.beta0 = e.beta;
  }
  let tiltAsked = false;
  function enableTilt() { // dokunma olayının içinde çağrılmalı
    if (tiltAsked) return; tiltAsked = true;
    const DOE = window.DeviceOrientationEvent;
    if (!DOE) { tilt.status = "Bu cihaz veya tarayıcı desteklemiyor"; return; }
    if (!window.isSecureContext) { tilt.status = "Sayfa HTTPS değil"; return; }
    const listen = () => {
      addEventListener("deviceorientation", onOrient);
      tilt.status = "Sayfaya sensör verisi gelmiyor";
    };
    if (typeof DOE.requestPermission === "function") {
      DOE.requestPermission().then((r) => { if (r === "granted") listen(); else tilt.status = "İzin verilmedi"; })
        .catch(() => { tilt.status = "Sayfa izin isteyemiyor"; });
    } else listen();
  }
  function updateTilt(dt) {
    if (!tilt.on) return;
    const v = Math.sign(tilt.gamma) * Math.max(0, Math.abs(tilt.gamma) - TILT_DEAD) / T.tilt * (T.invert ? -1 : 1);
    tilt.val += (v - tilt.val) * Math.min(1, dt * 14);
    tilt.beta0 += (tilt.beta - tilt.beta0) * Math.min(1, dt / NEUTRAL_DRIFT);
    const pitch = Math.abs(tilt.beta - tilt.beta0);
    tilt.legs = tilt.legs ? pitch > LEG_TILT_OFF : pitch > LEG_TILT_ON;
  }

  // ---------- Girdi: ekranın her yerine bas. Kaydırmadan tutmak bacak açar. Kaydırmak veya telefonu eğmek karakteri yatırır. ----------
  let touch = null;
  function readInput() {
    let x = tilt.on ? tilt.val : 0, legs = tilt.on && tilt.legs ? 1 : 0;
    if (touch) {
      const dx = touch.x - touch.ox, a = Math.abs(dx);
      if (a < DEAD) legs = 1;
      else x = Math.sign(dx) * (a - DEAD) / FINGER_RANGE; // parmak ne kadar kayarsa o kadar yatar
    }
    x = Math.max(-MAX_LEAN, Math.min(MAX_LEAN, x));
    G.dir = [x, legs];
  }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault(); initAudio(); enableTilt();
    if (touch) return;
    touch = { id: e.pointerId, ox: e.clientX, x: e.clientX };
    readInput();
    if (G.stumble > 0) rescue();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!touch || e.pointerId !== touch.id) return;
    e.preventDefault(); touch.x = e.clientX;
    readInput();
  });
  const endTouch = (e) => { if (touch && e.pointerId === touch.id) { touch = null; readInput(); } };
  canvas.addEventListener("pointerup", endTouch);
  canvas.addEventListener("pointercancel", endTouch);
  document.addEventListener("touchmove", (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });

  // ---------- Çizim ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    const r = $("app").getBoundingClientRect();
    W = r.width; H = r.height; DPR = Math.min(2.5, devicePixelRatio || 1);
    canvas.width = W * DPR; canvas.height = H * DPR;
  }
  addEventListener("resize", resize); resize();

  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); };
  const text = (s, x, y, size, color, align = "center", weight = 700) => {
    ctx.font = `${weight} ${size}px ${DISPLAY}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(s, x, y);
  };

  function drawHUD() {
    const y = 26, x0 = 20, x1 = W - 96, n = LINE.length;
    const dx = (x1 - x0) / (n - 1);
    ctx.strokeStyle = C.steel; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    const seg = LINE[G.stopIndex];
    const prog = G.state === "ride" ? Math.min(1, G.t / seg.dur) : (G.state === "stop" || G.state === "done") ? 1 : 0;
    ctx.strokeStyle = C.sign; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + dx * (G.stopIndex + (G.stopIndex < n - 1 ? prog : 0)), y); ctx.stroke();
    for (let i = 0; i < n; i++) {
      ctx.beginPath(); ctx.arc(x0 + dx * i, y, 7, 0, 7);
      ctx.fillStyle = (G.starsBySeg[i] ? C.sign : C.tunnel); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = i <= G.stopIndex ? C.sign : C.steel; ctx.stroke();
    }
    text(String(G.score + Math.round(G.segScore)), W - 16, y, 26, C.text, "right");
    text(`DURAK ${G.stopIndex + 1}/${n}`, 20, y + 22, 15, C.muted, "left", 500);
  }

  // Ön camdaki yol: q=0 araca yakın, q=1 ufukta. Olaylar zamanına göre bu yolda yaklaşır.
  let bend = 0;
  const view = { camBottom: 0, feetY: 0 };
  function drawRoad(cam, seg) {
    ctx.save(); rr(cam.x, cam.y, cam.w, cam.h, 8); ctx.clip();
    ctx.fillStyle = C.window; ctx.fillRect(cam.x, cam.y, cam.w, cam.h);
    const hor = cam.y + cam.h * .2, bot = cam.y + cam.h, cx = cam.x + cam.w / 2;
    const LOOK = lookFor();
    let target = 0;
    if (G.state === "ride") for (const e of G.events) {
      if (e.k !== "left" && e.k !== "right") continue;
      const tau = e.t - G.t;
      // Yolun kıvrılma miktarı virajın şiddetini gösterir.
      if (tau < LOOK && tau > -e.d) { target = (e.k === "left" ? -1 : 1) * e.s * 1.15 * (tau > 0 ? 1 - tau / LOOK * .5 : 1); break; }
    }
    bend += (target - bend) * .07;
    const at = (q) => {
      const d = 1 - q;
      return { x: cx + bend * cam.w * .62 * q * q, y: hor + (bot - hor) * d * d, hw: cam.w * .42 * d * d + 3, s: d * d };
    };
    ctx.fillStyle = C.floor; ctx.beginPath();
    for (let i = 0; i <= 24; i++) { const a = at(i / 24); ctx[i ? "lineTo" : "moveTo"](a.x - a.hw, a.y); }
    for (let i = 24; i >= 0; i--) { const a = at(i / 24); ctx.lineTo(a.x + a.hw, a.y); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.muted;
    for (let i = 0; i < 6; i++) {
      const q = ((i / 6 - G.travel * .9) % 1 + 1) % 1, a = at(q), b = at(Math.min(1, q + .06));
      ctx.beginPath(); ctx.moveTo(a.x - a.hw * .03, a.y); ctx.lineTo(a.x + a.hw * .03, a.y); ctx.lineTo(b.x + b.hw * .03, b.y); ctx.lineTo(b.x - b.hw * .03, b.y); ctx.closePath(); ctx.fill();
    }
    // yaklaşan olaylar: uzaktakiler önce çizilir
    if (G.state === "ride") {
      const list = G.events.filter((e) => e.k !== "npc" && e.t - G.t < LOOK && e.t - G.t > -.2).sort((a, b) => b.t - a.t);
      for (const e of list) {
        const q = Math.max(0, (e.t - G.t) / LOOK), a = at(q), size = 7 + a.s * cam.h * .46;
        if (e.k === "pot") {
          ctx.fillStyle = C.tunnel; ctx.strokeStyle = C.sign; ctx.lineWidth = 1.5 + a.s * 3;
          const rx = a.hw * .55 + 3;
          ctx.beginPath(); ctx.ellipse(a.x, a.y, rx, rx * .34, 0, 0, 7); ctx.fill(); ctx.stroke();
        } else if (e.k === "left" || e.k === "right") {
          // Tabeladaki ok sayısı şiddeti söyler: 1 hafif, 2 orta, 3 keskin.
          const side = e.k === "left" ? -1 : 1, count = e.s < .7 ? 1 : e.s < 1.05 ? 2 : 3;
          const sw = size * (.8 + count * .42), px = a.x + side * (a.hw + sw * .45), top = a.y - size * .95;
          ctx.fillStyle = C.sign; rr(px - sw / 2, top, sw, size * .8, 3); ctx.fill();
          ctx.strokeStyle = C.tunnel; ctx.lineWidth = 2 + size * .08; ctx.lineJoin = "round";
          for (let i = 0; i < count; i++) {
            const ox = px + (i - (count - 1) / 2) * size * .4;
            ctx.beginPath();
            ctx.moveTo(ox - side * size * .14, top + size * .14); ctx.lineTo(ox + side * size * .14, top + size * .4); ctx.lineTo(ox - side * size * .14, top + size * .66); ctx.stroke();
          }
        } else {
          const stopSign = e.k === "brake" && e.t > seg.dur - 6;
          const px = a.x + a.hw + size * .35, top = a.y - size * 1.25;
          ctx.fillStyle = C.steel; ctx.fillRect(px - 1 - a.s * 2, top, 2 + a.s * 4, size * 1.25);
          if (stopSign) {
            ctx.fillStyle = C.sign; rr(px - size * .75, top - size * .22, size * 1.5, size * .58, 3); ctx.fill();
            if (size > 20) text("DURAK", px, top + size * .07, size * .4, C.tunnel);
          } else {
            ctx.fillStyle = C.tunnel; rr(px - size * .3, top - size * .3, size * .6, size * .6, 3); ctx.fill();
            ctx.fillStyle = e.k === "brake" ? C.danger : C.safe;
            ctx.beginPath(); ctx.arc(px, top, size * .22, 0, 7); ctx.fill();
          }
        }
      }
    }
    ctx.restore();
    ctx.strokeStyle = C.steel; ctx.lineWidth = 3; rr(cam.x, cam.y, cam.w, cam.h, 8); ctx.stroke();
  }

  function drawScene() {
    const seg = LINE[G.stopIndex];
    const tx = -G.need[0], ty = G.throwY; // aracın savurma yönü
    const shake = reduceMotion ? 0 : G.shake * 3;
    const sx = (Math.sin(performance.now() / 23) * shake) + (reduceMotion ? 0 : -tx * 8);
    const sy = (Math.cos(performance.now() / 29) * shake) + (reduceMotion ? 0 : -ty * 20);
    const top = 58, ch = (H - top) * .34, cw = Math.min(W * .8, ch * 1.5);
    const cam = { x: W / 2 - cw / 2 + sx, y: top + 10 + sy, w: cw, h: ch };
    const camB = cam.y + cam.h;
    view.camBottom = top + 10 + ch; view.feetY = H * .9;
    ctx.fillStyle = C.wall; ctx.fillRect(0, top, W, H - top);
    for (const side of [-1, 1]) {
      const inner = W / 2 + side * (cw / 2 + 4) + sx, outer = W / 2 + side * (W * .56);
      ctx.fillStyle = C.window; ctx.beginPath();
      ctx.moveTo(inner, cam.y + ch * .15); ctx.lineTo(outer, cam.y - ch * .05); ctx.lineTo(outer, camB + ch * .35); ctx.lineTo(inner, camB - ch * .2); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.clip();
      ctx.strokeStyle = C.steel; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const q = (i / 6 + G.travel * .55) % 1, lx = inner + (outer - inner) * q * q, ly = cam.y + ch * .45;
        ctx.globalAlpha = .2 + .6 * G.speed; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + side * 26 * q * (G.speed + .05), ly); ctx.stroke();
      }
      ctx.restore(); ctx.globalAlpha = 1;
      if (G.state === "stop") {
        ctx.fillStyle = C.sign; ctx.globalAlpha = .28;
        ctx.beginPath(); ctx.moveTo(inner, camB - ch * .2); ctx.lineTo(outer, cam.y); ctx.lineTo(outer, H * .85); ctx.lineTo(inner, camB + ch * .25); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
      }
    }
    ctx.fillStyle = C.floor; ctx.beginPath();
    ctx.moveTo(W / 2 - cw / 2 + sx, camB); ctx.lineTo(W / 2 + cw / 2 + sx, camB); ctx.lineTo(W + 60, H); ctx.lineTo(-60, H); ctx.closePath(); ctx.fill();
    drawRoad(cam, seg);
    // Kalabalık aynı sarsıntıya tepki verir, düşene güler ve videoya çeker.
    const py = view.feetY, now = performance.now();
    for (const c of G.crowd) {
      let px = W / 2 + c.side * (dist(c) + c.shove * 18);
      let y = camB + (py - camB) * (.3 + c.z * .55);
      const s = .5 + c.z * .6;
      let lean = tx * .22 * (1 + c.z) + Math.sin(now / 700 + c.phase) * .02 + c.side * c.shove * .22;
      let toppled = false;
      if (c.fallAt !== null && G.state === "fallen" && G.fallT >= c.fallAt) {
        const k = Math.min(1, (G.fallT - c.fallAt) / .5);
        // Yere kadar devrilmez, yanındakinin üstüne yığılır: ekrandan çıkmadan zincir görünür kalır.
        lean += c.fallDir * k * k * .78; px -= c.fallDir * k * 16; toppled = true;
      }
      if (c.react === "laugh" && !reduceMotion) y += Math.abs(Math.sin(now / 90 + c.phase)) * -4;
      const col = toppled ? C.danger : c.tone > .5 ? C.steel : "#4f5a66"; // devrilen yolcu kalabalıktan ayrılır
      person(px, y, s, lean, col, ty);
      if (c.react) drawReaction(c, px, y, s, lean, now);
    }
    if (G.state === "ride") for (const n of G.events) {
      if (n.k !== "npc") continue;
      const lead = lookFor() * .85;
      const k = (G.t - (n.t - lead)) / lead;
      if (k < 0 || k > 1.3) continue;
      const px = W / 2 + n.dir * (W * .62 * (1 - Math.min(1, k)) + 50 + Math.max(0, k - 1) * 200);
      person(px, py, 1.15, 0, C.danger, 0);
      ctx.fillStyle = C.text; rr(px - n.dir * 38, py - 82, 28, 44, 5); ctx.fill();
    }
    if (G.state === "fallen") drawFallen(W / 2, py); else drawPlayer(W / 2, py);
    drawCue();
  }

  function person(x, y, s, lean, col, pitch) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(lean);
    ctx.scale(s * (1 + Math.max(0, pitch) * .12), s * (1 - Math.abs(pitch) * .14));
    ctx.fillStyle = col; rr(-17, -100, 34, 100, 10); ctx.fill();
    const hr = 15 * (1 + pitch * .28);
    ctx.beginPath(); ctx.arc(0, -100 - hr * .9, hr, 0, 7); ctx.fill();
    ctx.restore();
  }

  // Seyirciler: gülen açık ağızlı, çeken telefonu kaldırmış ve flaş patlatıyor.
  function drawReaction(c, x, y, s, lean, now) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(lean); ctx.scale(s, s);
    if (c.react === "laugh") {
      ctx.fillStyle = C.tunnel;
      ctx.beginPath(); ctx.arc(0, -109, 7, 0, Math.PI); ctx.fill(); // ağız
      ctx.strokeStyle = C.tunnel; ctx.lineWidth = 2.5;
      for (const e of [-6, 6]) { ctx.beginPath(); ctx.arc(e, -115, 3.5, Math.PI, 0); ctx.stroke(); } // gülen gözler
      if (G.state === "fallen") {
        const t = ((now / 1100 + c.phase) % 1);
        ctx.globalAlpha = 1 - t;
        text("HA HA", c.side * -6, -142 - t * 34, 19, C.text);
        ctx.globalAlpha = 1;
      }
    } else {
      const hand = c.side * -30;
      ctx.strokeStyle = c.tone > .5 ? C.steel : "#4f5a66"; ctx.lineWidth = 9; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(c.side * -14, -84); ctx.lineTo(hand, -136); ctx.stroke();
      ctx.fillStyle = C.tunnel; rr(hand - 9, -158, 18, 30, 3); ctx.fill();
      ctx.fillStyle = C.safe; rr(hand - 7, -156, 14, 26, 2); ctx.fill();
      if (G.state === "fallen" && c.flashT < .1) { // flaş
        ctx.fillStyle = "#ffffff"; ctx.globalAlpha = .9;
        ctx.beginPath(); ctx.arc(hand, -145, 24, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
  }

  // Karakter arkadan görünür. Bacak açınca alçalır ve sağlam durur; açmazsa frende ve kalkışta öne arkaya savrulur.
  function drawPlayer(x, y) {
    const wob = Math.min(1.2, G.tip);
    const sway = reduceMotion ? 0 : Math.sin(performance.now() / 420) * wob * .12; // yavaş sallanma, titreme yok
    const S = Math.min(1, G.L[1]);
    const sx = Math.max(-MAX_LEAN, Math.min(MAX_LEAN, G.show[0] + sway));
    const sy = Math.max(-1.3, Math.min(1.3, G.show[1]));
    const f = Math.max(0, -sy), b = Math.max(0, sy);
    const s = Math.min(1.5, H * .0019);
    const h0 = 112 * s;
    const aS = Math.min(2.4, Math.abs(sx));
    ctx.fillStyle = "rgba(16,21,27,.4)"; ctx.beginPath();
    ctx.ellipse(x + sx * 40 * s, y + 2 + sy * 10 * s, (42 + S * 30) * s, 12 * s, 0, 0, 7); ctx.fill();
    // bacaklar: basılı tutunca iki yana iyice açılır, karakter alçalır
    const hipDrop = S * 18 * s;
    const hipX = x + sx * 14 * s, hipY = y - 42 * s * (1 - f * .2 - b * .22) + hipDrop;
    const stance = 14 * s + aS * 8 * s + S * 40 * s;
    ctx.strokeStyle = C.sign; ctx.lineCap = "round"; ctx.lineWidth = 13 * s;
    for (const side of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(hipX + side * 7 * s, hipY);
      ctx.lineTo(x + side * stance + (side === Math.sign(sx) ? sx * 8 * s : 0), y);
      ctx.stroke();
    }
    // gövde: yatma arttıkça üst beden yere yaklaşır
    const reach = (aS <= 1 ? aS : 1 + (aS - 1) * .4) * Math.sign(sx); // çok yatınca ekrandan taşmaz, yere yaklaşır
    const shX = x + reach * Math.min(62 * s, W * .24);
    const shY = y + hipDrop - h0 * (1 - .46 * f - .24 * b - .2 * aS);
    const tw = 38 * s * (1 - .3 * f + .55 * b);
    ctx.lineWidth = tw;
    ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.quadraticCurveTo(hipX + sx * 14 * s, (hipY + shY) / 2, shX, shY); ctx.stroke();
    const fl = Math.max(wob * .8, aS * .35, b * 1.1, S * .35);
    ctx.lineWidth = 9 * s;
    for (const side of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(shX + side * tw * .42, shY + 2 * s);
      ctx.lineTo(shX + side * (26 + fl * 34 - f * 20) * s, shY + (28 - fl * 58 + f * 16) * s);
      ctx.stroke();
    }
    const r = 18 * s * (1 - .42 * f + .75 * b);
    const hx = shX + reach * 14 * s, hy = shY - r * (1.15 - .62 * Math.min(1.2, b)) * (1 - .3 * Math.min(1, Math.max(0, aS - 1)));
    ctx.fillStyle = C.sign; ctx.beginPath(); ctx.arc(hx, hy, r, 0, 7); ctx.fill();
    const eye = (wob > .5 || aS > OVER ? .28 : .15) * r;
    ctx.fillStyle = C.tunnel;
    ctx.beginPath(); ctx.arc(hx - r * .36, hy - r * .1, eye, 0, 7); ctx.arc(hx + r * .36, hy - r * .1, eye, 0, 7); ctx.fill();
  }

  // Yüz üstü kapaklanma: gövde ayakların üstünden devrilir, yere çarpar, yüzü görünmez.
  function drawFallen(x, y) {
    const k = Math.min(1, G.fallT / .5), e = k * k * k;
    const bounce = k >= 1 ? Math.max(0, Math.sin((G.fallT - .5) * 12)) * Math.max(0, 1 - (G.fallT - .5) * 3) * 8 : 0;
    const start = Math.atan(G.show[0] * .7);
    const a = start + (G.fallDir * Math.PI / 2 - start) * e;
    const s = Math.min(1.25, H * .0015);
    const px = x - G.fallDir * e * 44 * s;
    ctx.fillStyle = "rgba(16,21,27,.4)"; ctx.beginPath();
    ctx.ellipse(px + G.fallDir * e * 66 * s, y + 3, (40 + e * 46) * s, 11 * s, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(px, y - 8 * s * e - bounce); ctx.rotate(a); ctx.scale(s, s);
    ctx.strokeStyle = C.sign; ctx.lineCap = "round";
    ctx.lineWidth = 13;
    for (const side of [-1, 1]) { ctx.beginPath(); ctx.moveTo(side * 7, -42); ctx.lineTo(side * (14 + e * 10), 0); ctx.stroke(); }
    ctx.lineWidth = 9;
    for (const side of [-1, 1]) { ctx.beginPath(); ctx.moveTo(side * 16, -92); ctx.lineTo(side * (28 + e * 16), -128 - e * 12); ctx.stroke(); }
    ctx.lineWidth = 38; ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(0, -96); ctx.stroke();
    ctx.fillStyle = C.sign; ctx.beginPath(); ctx.arc(0, -134, 18, 0, 7); ctx.fill();
    if (e < .5) { // yere değmeden önce gözler kocaman
      ctx.fillStyle = C.tunnel; ctx.beginPath(); ctx.arc(-6, -136, 5, 0, 7); ctx.arc(6, -136, 5, 0, 7); ctx.fill();
    }
    ctx.restore();
    if (k >= 1) { // toz bulutu
      const p = Math.min(1, (G.fallT - .5) / .7);
      ctx.fillStyle = C.muted; ctx.globalAlpha = (1 - p) * .55;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath(); ctx.arc(px + G.fallDir * 120 * s + i * (16 + p * 30), y - 4 - Math.abs(i) * 3 - p * 14, 8 + p * 12, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  function nextEvent() {
    if (G.state !== "ride") return null;
    const lead = leadFor();
    for (const e of G.events) {
      if (G.t > e.t + e.d) continue;
      if (e.t - G.t <= lead) return { e, on: G.t >= e.t };
      break;
    }
    return null;
  }

  // Yazı yalnızca bir olayla ilk karşılaşmada çıkar. Sonrasında oyuncu yolu ve sesi okur.
  function drawCue() {
    const y = view.camBottom + 26, w = nextEvent();
    const pill = (ww, hh) => { ctx.fillStyle = "rgba(16,21,27,.8)"; rr(W / 2 - ww / 2, y - 21, ww, hh, 6); ctx.fill(); };
    if (G.stumble > 0) {
      pill(250, 42);
      text(G.stumbleOver ? "DİKLEŞ!" : touch ? "BIRAK VE BAS!" : "HEMEN BAS!", W / 2, y, 32, C.danger);
    } else if (w && !G.seen.has(w.e.k)) {
      pill(Math.min(W - 24, 330), 70);
      text(w.e.label, W / 2, y, 30, w.on ? C.safe : C.sign);
      text(w.e.tip, W / 2, y + 32, 18, C.text, "center", 500);
    } else if (G.relShow > 0 && G.state === "ride") {
      pill(240, 42); text("PARMAĞINI ÇEK", W / 2, y, 28, C.sign);
    }
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = C.tunnel; ctx.fillRect(0, 0, W, H);
    drawScene();
    ctx.fillStyle = C.tunnel; ctx.fillRect(0, 0, W, 58);
    drawHUD();
    if (G.state === "stop") {
      const y = view.camBottom + 26;
      ctx.fillStyle = "rgba(16,21,27,.8)"; rr(W / 2 - 110, y - 21, 220, 78, 6); ctx.fill();
      text(`${G.stopIndex + 1}. DURAK`, W / 2, y, 30, C.text);
      text("★".repeat(G.lastStars) + "☆".repeat(3 - G.lastStars), W / 2, y + 34, 30, C.sign);
    }
    if (G.flash) {
      ctx.globalAlpha = Math.min(1, G.flash.life * 2);
      text(G.flash.text, W / 2, view.camBottom + 96, 26, G.flash.color);
      ctx.globalAlpha = 1;
    }
  }

  let last = 0, acc = 0;
  function frame(ts) {
    const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
    if (!G.paused) {
      updateTilt(dt);
      readInput();
      acc += dt;
      while (acc >= FIXED) { step(FIXED); acc -= FIXED; }
      if (G.state === "fallen") G.fallT += dt;
      updateComedy(dt);
      if (G.flash && (G.flash.life -= dt) <= 0) G.flash = null;
      G.relShow = Math.max(0, G.relShow - dt);
      G.shake = Math.max(0, G.shake - dt * 3);
      if (engine && ac) { // motor sesi araç hızına göre
        engine.o.frequency.value = 45 + G.speed * 55;
        engine.g.gain.value = T.sound && G.state === "ride" ? .012 + G.speed * .018 : 0;
      }
    }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- Ekranlar ----------
  const panel = $("panel"), overlay = $("overlay");
  const show = (html) => { panel.innerHTML = html; overlay.hidden = false; overlay.scrollTop = 0; };
  const hide = () => { overlay.hidden = true; };

  function play(i) { initAudio(); wake(); hide(); G.paused = false; startSegment(i); }
  function wake() { try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {} }

  function showMenu() {
    show(`<h1>Tutunmak yasak</h1>
      <p>Telefonu eğ veya parmağını kaydır, ayakta kal.</p>
      <ul>
        <li><b>Fren, kalkış, çukur:</b> Ekrana kaydırmadan bas veya telefonu öne-arkaya eğ, bacaklarını aç.</li>
        <li><b>Sağa viraj:</b> Soluna yat. <b>Sola viraj:</b> Sağına yat. Keskin virajda daha çok yat.</li>
        <li>Çok yatarsan yüz üstü kapaklanırsın. Herkes de videoya çeker.</li>
      </ul>
      <button class="primary" id="go" type="button">Hatta bin</button>`);
    $("go").onclick = () => { enableTilt(); play(0); };
  }

  function showFallen() {
    if (G.state !== "fallen") return;
    show(`<h1>Kapaklandın</h1>
      <p>${G.fallLine}</p>
      <p class="small">${G.stopIndex + 1}. durak yolunda, ${Math.round(G.t)}. saniyede.</p>
      <button class="primary" id="retry" type="button">Bu duraktan devam et</button>
      <button id="restart" type="button">Hattın başına dön</button>`);
    $("retry").onclick = () => play(G.stopIndex);
    $("restart").onclick = () => { resetRun(); play(0); };
  }

  function resetRun() { G.score = 0; G.segScore = 0; G.falls = 0; G.rescues = 0; G.bumpCount = 0; G.starsBySeg = []; }

  function summary() {
    const stars = G.starsBySeg.reduce((a, b) => a + (b || 0), 0);
    return `Metro Denge Prototipi\nSkor: ${G.score}\nYıldız: ${stars}/18\nDüşme: ${G.falls}\nKurtarma: ${G.rescues}\nYanındakine çarpma: ${G.bumpCount}\nKontrol: ${tilt.on ? "eğme ve parmak" : "parmak"}\nAyarlar: yol süresi ${T.look}, hata payı ${T.tol}, savrulma ${T.hit}, eğim ${T.tilt}°, ters ${T.invert ? "evet" : "hayır"}\nCihaz: ${navigator.userAgent}`;
  }

  function showDone() {
    const stars = G.starsBySeg.reduce((a, b) => a + (b || 0), 0);
    show(`<h1>Hat bitti</h1>
      <div class="stats">
        <div><b>${G.score}</b><span>Skor</span></div>
        <div><b>${stars}/18</b><span>Yıldız</span></div>
        <div><b>${G.falls}</b><span>Düşme</span></div>
        <div><b>${G.rescues}</b><span>Kurtarma</span></div>
      </div>
      <p>Şunları not et:</p>
      <ul>
        <li>Yatarken karakteri kontrol ediyormuş gibi hissettin mi?</li>
        <li>Kapaklanma ve domino güldürdü mü?</li>
        <li>Yazılar kaybolunca sesi ve yolu okuyabildin mi?</li>
      </ul>
      <pre id="sum">${summary().replace(/&/g, "&amp;").replace(/</g, "&lt;")}</pre>
      <button id="copy" type="button">Sonucu kopyala</button>
      <button class="primary" id="again" type="button">Yeniden oyna</button>`);
    $("again").onclick = () => { resetRun(); play(0); };
    $("copy").onclick = (e) => {
      const b = e.currentTarget;
      if (!navigator.clipboard) { b.textContent = "Metni seçip kopyala"; return; }
      navigator.clipboard.writeText(summary()).then(() => { b.textContent = "Kopyalandı"; }, () => { b.textContent = "Metni seçip kopyala"; });
    };
  }

  function showSettings() {
    const wasPaused = G.paused; G.paused = true;
    const wasHidden = overlay.hidden;
    show(`<h1>Ayarlar</h1>
      <p class="small">Telefonu eğme: ${tilt.status}. Parmak her zaman çalışır.</p>
      <div class="row"><label for="s-tilt">Tam yatma için eğim (°) <output id="o-tilt"></output></label><input id="s-tilt" type="range" min="8" max="45" step="1"></div>
      <div class="row"><label for="s-look">Yolu görme süresi <output id="o-look"></output></label><input id="s-look" type="range" min=".7" max="1.5" step=".05"></div>
      <div class="row"><label for="s-tol">Hata payı <output id="o-tol"></output></label><input id="s-tol" type="range" min=".2" max=".8" step=".05"></div>
      <div class="row"><label for="s-hit">Savrulma gücü <output id="o-hit"></output></label><input id="s-hit" type="range" min=".5" max="1.5" step=".05"></div>
      <button id="inv" type="button"></button>
      <button id="snd" type="button"></button>
      <button id="reset" type="button">Varsayılana dön</button>
      <button class="primary" id="close" type="button">Kapat</button>`);
    const bind = (k) => {
      const i = $("s-" + k), o = $("o-" + k);
      const sync = () => { i.value = T[k]; o.textContent = T[k]; };
      i.oninput = () => { T[k] = +i.value; o.textContent = T[k]; saveT(); };
      return sync;
    };
    const syncs = ["tilt", "look", "tol", "hit"].map(bind);
    const btnSync = () => {
      $("snd").textContent = T.sound ? "Sesi kapat" : "Sesi aç";
      $("inv").textContent = T.invert ? "Eğim yönü: ters" : "Eğim yönü: normal";
    };
    $("snd").onclick = () => { T.sound = !T.sound; saveT(); btnSync(); };
    $("inv").onclick = () => { T.invert = !T.invert; saveT(); btnSync(); };
    $("reset").onclick = () => { Object.assign(T, DEFAULTS); saveT(); syncs.forEach((f) => f()); btnSync(); };
    syncs.forEach((f) => f()); btnSync();
    $("close").onclick = () => {
      G.paused = wasPaused;
      if (wasHidden) hide();
      else if (G.state === "menu") showMenu();
      else if (G.state === "fallen") showFallen();
      else if (G.state === "done") showDone();
      else hide();
    };
  }
  $("gear").onclick = showSettings;

  // Test kancası
  window.__denge = { G, T, LINE, step, draw, startSegment, resetRun, FIXED, needOf, tilt, onOrient, updateTilt, updateComedy, readInput };

  startSegment(0); G.state = "menu";
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
